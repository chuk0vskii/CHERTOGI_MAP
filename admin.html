<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👑 Админ-панель</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#0a0a1a;color:white;font-family:Arial,sans-serif;padding:30px;}
    #admin-panel{max-width:1200px;margin:0 auto;}
    h1{color:#ffd700;text-align:center;margin-bottom:30px;}
    .admin-hex{background:rgba(255,255,255,0.05);border-radius:12px;padding:15px;margin:10px 0;display:flex;align-items:center;gap:15px;flex-wrap:wrap;border-left:4px solid #666;transition:0.3s;}
    .admin-hex:hover{background:rgba(255,255,255,0.1);}
    .admin-hex input[type="text"]{flex:1;min-width:150px;padding:8px 12px;border-radius:6px;border:1px solid #444;background:#222;color:white;}
    .admin-hex input[type="text"]:focus{border-color:#ffd700;outline:none;}
    .admin-hex input[type="checkbox"]{width:20px;height:20px;cursor:pointer;}
    .admin-hex strong{min-width:80px;}
    .admin-hex .status{font-size:24px;}
    .controls{margin:20px 0;display:flex;gap:15px;align-items:center;flex-wrap:wrap;}
    .btn-save{background:#4caf50;color:white;padding:15px 40px;border:none;border-radius:10px;font-size:18px;cursor:pointer;transition:0.3s;}
    .btn-save:hover{background:#45a049;transform:scale(1.02);}
    #save-status{margin-left:20px;color:#aaa;font-size:16px;}
    .total-info{color:#aaa;margin-bottom:20px;font-size:14px;}
  </style>
</head>
<body>
  <div id="admin-panel">
    <p style="text-align:center;color:#aaa;">⏳ Загрузка...</p>
  </div>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
