<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: grab;
        }
        .wrapper:active {
            cursor: grabbing;
        }
        .wrapper img {
            display: block;
            max-width: none;
            max-height: none;
            transform-origin: center center;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
            /* ===== ПЛАВНОСТЬ ЗУМА ===== */
            transition: transform 0.08s ease-out;
        }
    </style>
</head>
<body>

<div class="wrapper" id="mapWrapper">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта" id="mapImage">
</div>

<script>
    (function() {
        const img = document.getElementById('mapImage');
        const wrapper = document.getElementById('mapWrapper');

        let scale = 1;

        const MIN_SCALE = 0.4;
        const MAX_SCALE = 2.0;

        function resetSize() {
            img.style.width = '';
            img.style.height = '';
            img.style.transform = 'scale(1)';
            scale = 1;
        }

        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();

            // ===== ШАГ ЗУМА (ЧЕМ МЕНЬШЕ — ТЕМ ПЛАВНЕЕ) =====
            const delta = e.deltaY > 0 ? -0.06 : 0.06;

            let newScale = scale + delta;
            newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);

            if (newScale === scale) return;

            img.style.transform = `scale(${newScale})`;
            scale = newScale;
        }, { passive: false });

        // ===== ПЕРЕТАСКИВАНИЕ =====
        let isDragging = false;
        let startX, startY, startScrollLeft, startScrollTop;

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startScrollLeft = wrapper.scrollLeft;
            startScrollTop = wrapper.scrollTop;
            wrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            wrapper.scrollLeft = startScrollLeft - dx;
            wrapper.scrollTop = startScrollTop - dy;
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            }
        });

        // ===== ЗАПУСК =====
        resetSize();

        if (img.complete) {
            resetSize();
        } else {
            img.addEventListener('load', resetSize);
        }

        window.addEventListener('resize', resetSize);

    })();
</script>

</body>
</html>
