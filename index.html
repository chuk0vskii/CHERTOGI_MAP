<!DOCTYPE html>
<html>
<head>
  <title>Огненные чертоги</title>
  <meta charset="utf-8">
  <meta http-equiv="imagetoolbar" content="no"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style type="text/css">
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #0d0d1a; }
    body { width: 100%; height: 100%; display: flex; flex-direction: column; }

    .top-banner {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: #4a0e0e;
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      user-select: none;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 14px; letter-spacing: 1px;
      transition: all 0.3s ease; padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    #map {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #0d0d1a;
    }

    #version-counter {
      position: fixed;
      top: 80px;
      left: 16px;
      z-index: 200;
      color: rgba(255, 215, 0, 0.5);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 0, 0.1);
      user-select: none;
      pointer-events: none;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.maptiler.com/ol/v6.12.0/ol.css" type="text/css">
  <script src="https://cdnjs.cloudflare.com/polyfill/v2/polyfill.min.js?features=requestAnimationFrame,Element.prototype.classList,URL,fetch,Function.prototype.bind,es5&flags=always,gated&unknown=polyfill" type="text/javascript"></script>
  <script src="https://cdn.maptiler.com/ol/v6.12.0/ol.js" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <div id="version-counter">⚙️ v1.0</div>
  <div id="map"></div>

  <!-- БОКОВАЯ ПАНЕЛЬ -->
  <div id="region-sidebar" style="display: none; position: fixed; right: 0; top: 70px; width: 420px; height: calc(100vh - 70px); background: rgba(20, 15, 30, 0.95); backdrop-filter: blur(12px); border-left: 2px solid rgba(255, 215, 0, 0.3); z-index: 1000; padding: 24px; overflow-y: auto; color: #e0d5c0; box-shadow: -8px 0 40px rgba(0,0,0,0.6); transform: translateX(100%); transition: transform 0.3s ease-in-out;">
    <button id="close-sidebar" style="position: sticky; top: 0; float: right; background: none; border: none; color: #ffd700; font-size: 28px; cursor: pointer; padding: 0 8px; z-index: 10;">✕</button>
    <h2 id="sidebar-title" style="color: #ffd700; font-size: 28px; margin-bottom: 6px; font-family: 'Calypso', serif;">Название региона</h2>
    <p id="sidebar-description" style="font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #aaa;">Описание региона</p>
    <button id="report-btn" style="width: 100%; padding: 14px; background: #4a0e0e; border: 2px solid #ffd700; border-radius: 10px; color: #ffd700; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-bottom: 24px;">📝 Составить отчёт</button>
    <div style="border-top: 1px solid rgba(255, 215, 0, 0.1); padding-top: 16px;">
      <h4 style="color: #aaa; font-size: 14px; letter-spacing: 1px; margin-bottom: 12px;">📋 Отчёты игроков</h4>
      <div id="reports-list" style="max-height: 300px; overflow-y: auto;"><p style="color: #777; font-size: 14px;">Загрузка...</p></div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ДЛЯ ОТЧЁТА -->
  <div id="report-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
    <div style="background: #1e1428; padding: 32px; border-radius: 16px; max-width: 520px; width: 90%; border: 1px solid rgba(255, 215, 0, 0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.8);">
      <h3 style="color: #ffd700; margin-bottom: 8px;">📝 Новый отчёт</h3>
      <p id="modal-region-name" style="color: #888; font-size: 13px; margin-bottom: 16px;">Регион: Лесной край</p>
      
      <input id="report-author" type="text" placeholder="Ваше имя (опционально)" style="width: 100%; padding: 10px; background: #2a1a3a; border: 1px solid #4a2a5a; border-radius: 8px; color: #e0d5c0; font-size: 14px; margin-bottom: 12px; outline: none;">
      
      <textarea id="report-content" style="width: 100%; height: 150px; background: #2a1a3a; border: 1px solid #4a2a5a; border-radius: 8px; padding: 12px; color: #e0d5c0; font-size: 14px; resize: vertical; font-family: inherit; outline: none;" placeholder="Опишите события, которые произошли в этом регионе..."></textarea>
      
      <div style="display: flex; gap: 12px; margin-top: 16px;">
        <button id="submit-report-btn" style="flex: 1; padding: 12px; background: #ffd700; border: none; border-radius: 8px; color: #1a0a1a; font-weight: bold; cursor: pointer; transition: 0.2s;">Отправить</button>
        <button id="cancel-report-btn" style="flex: 1; padding: 12px; background: #3a2a3a; border: none; border-radius: 8px; color: #aaa; cursor: pointer;">Отмена</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ===== ПОДКЛЮЧЕНИЕ К БАЗЕ ДАННЫХ =====
      const { createClient } = supabase;
      const _supabase = createClient(
        'https://djieimjwhgjgsjcysceh.supabase.co',
        'sb_publishable_R2gXWQPVT5trC7cL2BDIpw_Av1QHxDi'
      );
      console.log('✅ Supabase подключён');

      // ===== КАРТА =====
      var mapExtent = [0.00000000, -7026.00000000, 9189.00000000, -400.00000000];
      var mapMinZoom = 0;
      var mapMaxZoom = 5;
      var mapMaxResolution = 1.00000000;
      var tileExtent = [0.00000000, -7026.00000000, 9189.00000000, -400.00000000];
      var tileWidth = 512;
      var tileHeight = 512;

      var mapResolutions = [];
      for (var z = 0; z <= mapMaxZoom; z++) {
        mapResolutions.push(Math.pow(2, mapMaxZoom - z) * mapMaxResolution);
      }

      var mapTileGrid = new ol.tilegrid.TileGrid({
        tileSize: [tileWidth, tileHeight],
        extent: tileExtent,
        minZoom: mapMinZoom,
        resolutions: mapResolutions
      });

      var layer = new ol.layer.Tile({
        source: new ol.source.XYZ({
          attributions: '<a href="https://www.maptiler.com/engine/">Rendered with MapTiler Engine</a>, non-commercial use only',
          projection: 'PIXELS',
          tileGrid: mapTileGrid,
          tilePixelRatio: 1.00000000,
          url: "TILES/{z}/{x}/{y}.webp",
        })
      });

      var map = new ol.Map({
        target: 'map',
        layers: [layer],
        view: new ol.View({
          projection: ol.proj.get('PIXELS'),
          extent: mapExtent,
          maxResolution: mapTileGrid.getResolution(mapMinZoom),
          constrainOnlyCenter: false
        })
      });

      // ===== НАСТРОЙКА НАЧАЛЬНОГО ВИДА =====
      setTimeout(function() {
        map.updateSize();
        map.getView().fit(mapExtent, {
          padding: [100, 60, 60, 60],
          maxZoom: 3.8,
          constrainResolution: true
        });
        var view = map.getView();
        var res = view.getResolution();
        view.setResolution(res * 1.15);
      }, 200);

      window.addEventListener('resize', function() {
        map.updateSize();
        map.getView().fit(mapExtent, {
          padding: [100, 60, 60, 60],
          maxZoom: 3.8,
          constrainResolution: true
        });
      });

      // ===== ОБЛАКО =====
      var cloudImageLayer = new ol.layer.Image({
        source: new ol.source.ImageStatic({
          url: 'cloud.png',
          imageExtent: [3950, -3590, 5150, -2500],
          projection: 'PIXELS'
        }),
        zIndex: 10
      });
      map.addLayer(cloudImageLayer);

      // ===== СЛОЙ РЕГИОНОВ =====
      let regionLayer = new ol.layer.Vector({
        source: new ol.source.Vector(),
        zIndex: 5,
        style: function(feature) {
          const name = feature.get('name') || '';
          const radius = feature.get('radius') || 350;
          const color = feature.get('color') || 'rgba(255, 215, 0, 0.25)';
          const borderColor = feature.get('borderColor') || 'rgba(255, 215, 0, 0.6)';

          return [
            new ol.style.Style({
              image: new ol.style.Circle({
                radius: radius,
                fill: new ol.style.Fill({ color: color }),
                stroke: new ol.style.Stroke({ color: borderColor, width: 2 })
              })
            }),
            new ol.style.Style({
              text: new ol.style.Text({
                text: name,
                font: 'bold 16px Arial',
                fill: new ol.style.Fill({ color: '#ffffff' }),
                stroke: new ol.style.Stroke({ color: 'rgba(0,0,0,0.7)', width: 3 }),
                textAlign: 'center',
                textBaseline: 'middle'
              })
            })
          ];
        }
      });

      map.addLayer(regionLayer);

      // ===== ЗАГРУЗКА РЕГИОНОВ ИЗ БАЗЫ =====
      async function loadRegions() {
        const { data, error } = await _supabase
          .from('regions')
          .select('*')
          .eq('is_active', true);

        if (error) {
          console.error('❌ Ошибка загрузки регионов:', error);
          return;
        }

        console.log(`✅ Загружено ${data.length} регионов`);

        const features = data.map(region => {
          return new ol.Feature({
            geometry: new ol.geom.Point([region.x, region.y]),
            id: region.id,
            name: region.name,
            description: region.description,
            radius: region.radius,
            color: region.color,
            borderColor: region.border_color
          });
        });

        regionLayer.getSource().addFeatures(features);
        console.log('✅ Регионы добавлены на карту');
      }

      loadRegions();

      // ===== ВЗАИМОДЕЙСТВИЕ С РЕГИОНАМИ =====
      let hoveredRegion = null;

      map.on('pointermove', function(event) {
        const pixel = event.pixel;
        const hit = map.forEachFeatureAtPixel(pixel, function(feature) {
          return feature;
        }, {
          layerFilter: function(layer) {
            return layer === regionLayer;
          }
        });

        if (hoveredRegion) {
          hoveredRegion.set('hover', false);
        }

        if (hit && hit.getGeometry() instanceof ol.geom.Point) {
          hoveredRegion = hit;
          hoveredRegion.set('hover', true);
          map.getTargetElement().style.cursor = 'pointer';
        } else {
          hoveredRegion = null;
          map.getTargetElement().style.cursor = '';
        }

        regionLayer.changed();
      });

      // ===== КЛИК ПО РЕГИОНУ =====
      map.on('click', function(event) {
        const pixel = event.pixel;
        const hit = map.forEachFeatureAtPixel(pixel, function(feature) {
          return feature;
        }, {
          layerFilter: function(layer) {
            return layer === regionLayer;
          }
        });

        if (hit && hit.getGeometry() instanceof ol.geom.Point) {
          const regionId = hit.get('id');
          const name = hit.get('name');
          const desc = hit.get('description');
          openSidebar(regionId, name, desc);
        }
      });

      // ===== БОКОВАЯ ПАНЕЛЬ =====
      let currentRegionId = null;
      const sidebar = document.getElementById('region-sidebar');
      const sidebarTitle = document.getElementById('sidebar-title');
      const sidebarDesc = document.getElementById('sidebar-description');
      const reportsList = document.getElementById('reports-list');

      function openSidebar(regionId, name, description) {
        currentRegionId = regionId;
        sidebarTitle.textContent = name;
        sidebarDesc.textContent = description || 'Описание отсутствует';
        sidebar.style.display = 'block';
        setTimeout(() => { sidebar.style.transform = 'translateX(0)'; }, 10);
        loadReports(regionId);
      }

      function closeSidebar() {
        sidebar.style.transform = 'translateX(100%)';
        setTimeout(() => { sidebar.style.display = 'none'; }, 300);
      }

      document.getElementById('close-sidebar').addEventListener('click', closeSidebar);

      // ===== ЗАГРУЗКА ОТЧЁТОВ =====
      async function loadReports(regionId) {
        reportsList.innerHTML = '<p style="color: #777; font-size: 14px;">Загрузка...</p>';
        const { data, error } = await _supabase
          .from('game_reports')
          .select('*')
          .eq('region_id', regionId)
          .order('created_at', { ascending: false })
          .limit(10);

        if (error) {
          console.error('❌ Ошибка загрузки отчётов:', error);
          reportsList.innerHTML = '<p style="color: #ff6b6b; font-size: 14px;">❌ Ошибка загрузки</p>';
          return;
        }

        if (!data || data.length === 0) {
          reportsList.innerHTML = '<p style="color: #777; font-size: 14px;">📭 Пока нет отчётов для этого региона</p>';
          return;
        }

        reportsList.innerHTML = data.map(report => `
          <div style="background: rgba(255,255,255,0.05); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; border-left: 3px solid rgba(255, 215, 0, 0.3);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
              <span style="color: #aaa; font-size: 11px;">🗓️ ${new Date(report.created_at).toLocaleDateString('ru-RU')} ${report.user_name ? ` · ${report.user_name}` : ''}</span>
              <span style="color: #555; font-size: 10px;">#${report.id}</span>
            </div>
            <div style="color: #e0d5c0; font-size: 14px; line-height: 1.4; word-wrap: break-word;">${report.content}</div>
          </div>
        `).join('');
      }

      // ===== МОДАЛЬНОЕ ОКНО ДЛЯ ОТЧЁТА =====
      const modal = document.getElementById('report-modal');
      const modalRegionName = document.getElementById('modal-region-name');
      const reportAuthor = document.getElementById('report-author');
      const reportContent = document.getElementById('report-content');

      document.getElementById('report-btn').addEventListener('click', function() {
        if (!currentRegionId) return;
        const regionName = sidebarTitle.textContent;
        modalRegionName.textContent = `📍 Регион: ${regionName}`;
        reportAuthor.value = '';
        reportContent.value = '';
        modal.style.display = 'flex';
      });

      function closeModal() {
        modal.style.display = 'none';
      }

      document.getElementById('cancel-report-btn').addEventListener('click', closeModal);
      modal.addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });

      // ===== ОТПРАВКА ОТЧЁТА =====
      document.getElementById('submit-report-btn').addEventListener('click', async function() {
        const content = reportContent.value.trim();
        const author = reportAuthor.value.trim() || 'Аноним';

        if (!content) {
          alert('Напишите текст отчёта');
          return;
        }

        const { data, error } = await _supabase
          .from('game_reports')
          .insert([{
            region_id: currentRegionId,
            user_name: author,
            content: content,
            game_date: new Date().toISOString().split('T')[0]
          }]);

        if (error) {
          alert('❌ Ошибка: ' + error.message);
          return;
        }

        alert('✅ Отчёт сохранён!');
        closeModal();
        loadReports(currentRegionId);
      });

    })();
  </script>

</body>
</html>
