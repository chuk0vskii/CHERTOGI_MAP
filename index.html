<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с зумом (из форума)</title>
    <style>
        /* Убираем всё лишнее */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер, в котором будет карта */
        #mapContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: grab;
        }

        #mapContainer:active {
            cursor: grabbing;
        }

        /* Сама картинка */
        #mapImage {
            display: block;
            width: 5100px;  /* Оригинальная ширина */
            height: 2500px; /* Оригинальная высота */
            max-width: none;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

<div id="mapContainer">
    <img id="mapImage" src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта">
</div>

<script>
    (function() {
        // ===== ЭЛЕМЕНТЫ =====
        const container = document.getElementById('mapContainer');
        const img = document.getElementById('mapImage');

        // ===== РАЗМЕРЫ КАРТЫ (оригинальные) =====
        const IMG_W = 5100;
        const IMG_H = 2500;

        // ===== СОСТОЯНИЕ =====
        let scale = 1;          // Текущий масштаб
        const MIN_SCALE = 1.0;  // Не меньше 100%
        const MAX_SCALE = 2.0;  // Не больше 200%

        // ===== ФУНКЦИЯ ОБНОВЛЕНИЯ =====
        function updateScale() {
            img.style.transform = `scale(${scale})`;
        }

        // ===== ЦЕНТРИРОВАНИЕ ПРИ ЗАГРУЗКЕ =====
        function centerImage() {
            const rect = container.getBoundingClientRect();
            // Считаем, какой масштаб нужен, чтобы карта поместилась в экран
            const scaleX = rect.width / IMG_W;
            const scaleY = rect.height / IMG_H;
            // Берём минимальный, чтобы карта не вылезала за границы
            scale = Math.min(scaleX, scaleY);
            // Но не меньше 1.0 (чтобы карта не была меньше оригинала)
            scale = Math.max(scale, 1.0);
            updateScale();
        }

        // ===== ЗУМ КОЛЕСИКОМ (как на форуме, но с ограничениями) =====
        container.addEventListener('wheel', function(e) {
            e.preventDefault();

            // Определяем направление прокрутки
            const delta = e.deltaY || e.detail || e.wheelDelta;
            let newScale = scale;

            if (delta > 0) {
                // Крутим вниз — уменьшаем
                newScale = scale - 0.05;
                if (newScale < MIN_SCALE) newScale = MIN_SCALE;
            } else {
                // Крутим вверх — увеличиваем
                newScale = scale + 0.05;
                if (newScale > MAX_SCALE) newScale = MAX_SCALE;
            }

            // Если масштаб не изменился — ничего не делаем
            if (newScale === scale) return;

            scale = newScale;
            updateScale();
        }, { passive: false });

        // ===== ПЕРЕТАСКИВАНИЕ =====
        let isDragging = false;
        let startX, startY, startScrollLeft, startScrollTop;

        container.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startScrollLeft = container.scrollLeft;
            startScrollTop = container.scrollTop;
            container.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            container.scrollLeft = startScrollLeft - dx;
            container.scrollTop = startScrollTop - dy;
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                container.style.cursor = 'grab';
            }
        });

        // ===== ЗАПУСК =====
        if (img.complete) {
            centerImage();
        } else {
            img.addEventListener('load', centerImage);
        }

        // Запасной вариант, если картинка долго грузится
        setTimeout(centerImage, 1000);

        // Пересчёт при изменении размера окна
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(centerImage, 100);
        });

    })();
</script>

</body>
</html>
