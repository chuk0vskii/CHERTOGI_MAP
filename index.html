<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
    }
    body {
      display: flex;
      flex-direction: column;
    }

    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
      flex-shrink: 0;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    .map-wrapper {
      flex: 1;
      width: 100vw;
      height: calc(100vh - 70px);
      margin-top: 70px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      cursor: grab;
    }
    .map-wrapper:active { cursor: grabbing; }

    #tileContainer {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      grid-template-rows: repeat(14, 1fr);
      gap: 0;
      width: fit-content;
      height: fit-content;
      background: #0d0d1a;
      border: none;
      margin: 0;
      padding: 0;
      line-height: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #tileContainer img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      background: #0d0d1a;
      outline: none;
      box-shadow: none;
    }

    .markers-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 9189px;
      height: 7026px;
      transform-origin: 0 0;
      pointer-events: none;
      z-index: 10;
    }
    .marker {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      transform: translate(-50%, -50%);
    }
    .marker img { display: block; width: auto; height: auto; max-width: 50px; max-height: 50px; }
    .marker:hover { transform: translate(-50%, -50%) scale(1.3); filter: brightness(1.3); }
    .marker-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffd700;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .marker:hover .marker-tooltip { opacity: 1; }

    .info-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 400px;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #2d2d44);
      color: white;
      padding: 30px 25px;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1000;
      font-family: Arial, sans-serif;
      overflow-y: auto;
      border-left: 2px solid rgba(255, 215, 0, 0.3);
    }
    .info-panel.open { right: 0; }
    .info-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }
    .info-panel-title { font-size: 24px; color: #ffd700; font-weight: bold; text-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }
    .info-panel-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      line-height: 1;
      padding: 0 8px;
    }
    .info-panel-close:hover { color: #ffd700; transform: rotate(90deg); }
    .info-panel-content { font-size: 16px; line-height: 1.8; color: #ccc; }
    .info-panel-content strong { color: #ffd700; }
    .info-panel-content .description {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 3px solid #ffd700;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 999;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      .top-banner { height: 56px; }
      .map-wrapper { height: calc(100vh - 56px); margin-top: 56px; }
      .info-panel { width: 320px; right: -360px; }
      .info-panel-title { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .top-banner { height: 48px; }
      .map-wrapper { height: calc(100vh - 48px); margin-top: 48px; }
      .info-panel { width: 280px; right: -320px; padding: 20px 16px; }
      .info-panel-title { font-size: 18px; }
    }
  </style>
</head>
<body>

<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html" class="active">Карта</a>
    <a href="znaki.html">Знаки</a>
    <a href="put.html">Путь</a>
  </div>
</div>

<div class="map-wrapper" id="mapWrapper">
  <div id="tileContainer"></div>

  <div class="markers-container" id="markersContainer">
    <div class="marker" style="left: 1500px; top: 800px;" 
         data-name="Штаб синдиката"
         data-description="Здесь находится главный штаб синдиката. Вход строго по пропускам.">
      <img src="assets/icons/sindicat.png" alt="Синдикат">
      <span class="marker-tooltip">Штаб синдиката</span>
    </div>
    <div class="marker" style="left: 2800px; top: 1200px;" 
         data-name="Замок графа"
         data-description="Мрачный замок на скале. Говорят, там водятся призраки.">
      <img src="https://cdn-icons-png.flaticon.com/512/542/542558.png" alt="Замок">
      <span class="marker-tooltip">Замок графа</span>
    </div>
    <div class="marker" style="left: 3800px; top: 600px;" 
         data-name="Деревня Ольховка"
         data-description="Мирная деревня, где можно купить провизию и отдохнуть.">
      <img src="https://cdn-icons-png.flaticon.com/512/1828/1828977.png" alt="Деревня">
      <span class="marker-tooltip">Деревня Ольховка</span>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"></div>
<div class="info-panel" id="infoPanel">
  <div class="info-panel-header">
    <span class="info-panel-title" id="infoTitle">Название</span>
    <button class="info-panel-close" id="infoClose">✕</button>
  </div>
  <div class="info-panel-content" id="infoContent">
    <p><strong>Описание:</strong></p>
    <div class="description" id="infoDescription">Описание отсутствует.</div>
  </div>
</div>

<script>
  (function() {
    const container = document.getElementById('tileContainer');
    const markersContainer = document.getElementById('markersContainer');
    const wrapper = document.getElementById('mapWrapper');
    const infoPanel = document.getElementById('infoPanel');
    const infoTitle = document.getElementById('infoTitle');
    const infoDescription = document.getElementById('infoDescription');
    const infoClose = document.getElementById('infoClose');
    const overlay = document.getElementById('overlay');

    const COLS = 18;
    const ROWS = 14;
    const totalTiles = COLS * ROWS;

    // ===== ЗАГРУЗКА ТАЙЛОВ =====
    for (let i = 1; i <= totalTiles; i++) {
      const img = document.createElement('img');
      const padded = String(i).padStart(2, '0');
      img.src = `tiles2/tile_${padded}.jpg`;
      img.alt = `tile ${i}`;
      img.loading = 'lazy';
      container.appendChild(img);
    }

    // ===== СОСТОЯНИЕ =====
    let scale = 1;
    let tx = 0;
    let ty = 0;
    let tileSize = 0;
    let minScale = 1;
    const MAX_SCALE = 3.0;
    const STEP = 0.08;

    // ===== ФУНКЦИЯ РАЗМЕРА ТАЙЛОВ =====
    function fitTiles() {
      const rect = wrapper.getBoundingClientRect();
      const tileW = Math.floor(rect.width / COLS);
      const tileH = Math.floor(rect.height / ROWS);
      tileSize = Math.min(tileW, tileH);

      const images = container.querySelectorAll('img');
      images.forEach(img => {
        img.style.width = tileSize + 'px';
        img.style.height = tileSize + 'px';
      });

      const containerW = tileSize * COLS;
      const containerH = tileSize * ROWS;
      container.style.width = containerW + 'px';
      container.style.height = containerH + 'px';

      // Центрируем (как в старой карте)
      const wrapperRect = wrapper.getBoundingClientRect();
      minScale = Math.min(wrapperRect.width / containerW, wrapperRect.height / containerH);
      scale = minScale;
      tx = (wrapperRect.width - containerW * scale) / 2;
      ty = (wrapperRect.height - containerH * scale) / 2;
      applyTransform();
    }

    // ===== ПРИМЕНЕНИЕ =====
    function applyTransform() {
      const transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      container.style.transform = transform;
      markersContainer.style.transform = `scale(${tileSize / 512 * scale})`;
      markersContainer.style.transformOrigin = '0 0';
    }

    // ===== ЗУМ ПОД КУРСОРОМ =====
    wrapper.addEventListener('wheel', function(e) {
      e.preventDefault();

      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const delta = e.deltaY > 0 ? -STEP : STEP;
      let newScale = scale + delta;
      newScale = Math.min(Math.max(newScale, minScale), MAX_SCALE);

      if (newScale === scale) return;

      // Координаты точки под мышью внутри карты
      const px = (mouseX - tx) / scale;
      const py = (mouseY - ty) / scale;

      // Обновляем масштаб
      scale = newScale;

      // Новое смещение, чтобы точка под мышью осталась на месте
      tx = mouseX - px * scale;
      ty = mouseY - py * scale;

      applyTransform();
    }, { passive: false });

    // ===== ПЕРЕТАСКИВАНИЕ =====
    let isDragging = false;
    let startX, startY, startTx, startTy;

    wrapper.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startTx = tx;
      startTy = ty;
      wrapper.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      tx = startTx + (e.clientX - startX);
      ty = startTy + (e.clientY - startY);
      applyTransform();
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        wrapper.style.cursor = 'grab';
      }
    });

    // ===== ЗАПУСК =====
    window.addEventListener('load', fitTiles);
    window.addEventListener('resize', fitTiles);

    // ===== КЛИК ПО МЕТКЕ =====
    document.querySelectorAll('.marker').forEach(marker => {
      marker.addEventListener('click', function(e) {
        e.stopPropagation();
        const name = this.dataset.name || 'Без названия';
        const desc = this.dataset.description || 'Описание отсутствует.';
        infoTitle.textContent = name;
        infoDescription.textContent = desc;
        infoPanel.classList.add('open');
        overlay.classList.add('active');
      });
    });

    // ===== ЗАКРЫТИЕ =====
    function closeInfo() {
      infoPanel.classList.remove('open');
      overlay.classList.remove('active');
    }
    infoClose.addEventListener('click', closeInfo);
    overlay.addEventListener('click', closeInfo);
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeInfo();
    });

  })();
</script>

</body>
</html>
