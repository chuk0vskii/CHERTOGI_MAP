<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Карта</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 0; width: 98vw; max-width: 1200px; }
    .grid img { display: block; width: 100%; height: auto; border: none; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    for (let i = 1; i <= 252; i++) {
      const img = document.createElement('img');
      const padded = String(i).padStart(2, '0');
      img.src = `https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/tile_${padded}.jpg`;
      grid.appendChild(img);
    }
  </script>
</body>
</html>
