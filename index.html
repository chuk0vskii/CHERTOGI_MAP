<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с зумом</title>
    <style>
        /* Убираем всё лишнее */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: grab;
            transition: transform 0.1s ease;
            transform-origin: center center;
        }
        .wrapper img:active {
            cursor: grabbing;
        }
    </style>
</head>
<body>

<div class="wrapper" id="mapWrapper">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта" id="mapImage">
</div>

<script>
    const img = document.getElementById('mapImage');
    let scale = 1;

    // Зум колесиком
    document.getElementById('mapWrapper').addEventListener('wheel', function(e) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        scale = Math.min(Math.max(scale + delta, 0.3), 1.5);
        img.style.transform = `scale(${scale})`;
    }, { passive: false });
</script>

</body>
</html>
