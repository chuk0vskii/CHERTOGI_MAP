<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта с зумом (OpenLayers)</title>
  
  <!-- Подключаем OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Информация о зуме */
    .zoom-info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #aaa;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 1000;
    }

    .zoom-info span {
      color: #ffd700;
      font-weight: bold;
    }

    .hint {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 1000;
      text-align: center;
    }

    /* Стили OpenLayers */
    .ol-viewport {
      border-radius: 8px;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="zoom-info">Зум: <span id="zoomLevel">1</span>x</div>
<div class="hint">🖱 Колесико мыши — приблизить / отдалить</div>

<script>
  (function() {
    'use strict';

    // ===== 1. СОЗДАЁМ КАРТУ =====
    const map = new ol.Map({
      target: 'map', // id элемента, куда вставляем карту
      layers: [
        new ol.layer.Image({
          source: new ol.source.ImageStatic({
            url: 'https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg',
            imageSize: [5100, 2500], // РАЗМЕРЫ ТВОЕЙ КАРТЫ
            projection: 'EPSG:3857'
          })
        })
      ],
      view: new ol.View({
        projection: 'EPSG:3857',
        center: [0, 0],
        zoom: 0.5,
        minZoom: 0.3,
        maxZoom: 2
      })
    });

    // ===== 2. ОТОБРАЖЕНИЕ ТЕКУЩЕГО ЗУМА =====
    const zoomDisplay = document.getElementById('zoomLevel');

    map.getView().on('change:resolution', function() {
      const zoom = map.getView().getZoom();
      // Переводим зум в проценты (условно)
      const percent = Math.round((zoom / 2) * 100);
      zoomDisplay.textContent = percent + '%';
    });

    // ===== 3. НАСТРОЙКА КАРТЫ =====
    // Отключаем все лишние элементы управления (для чистоты)
    const view = map.getView();
    view.setCenter([0, 0]);

    // ===== 4. ПЕРЕСЧЁТ ПРИ ИЗМЕНЕНИИ РАЗМЕРА =====
    window.addEventListener('resize', function() {
      map.updateSize();
    });

    // ===== 5. ДОПОЛНИТЕЛЬНЫЙ КОНТРОЛЬ =====
    // Если карта не отображается — принудительно обновляем через 1 секунду
    setTimeout(function() {
      map.updateSize();
    }, 1000);

  })();
</script>

</body>
</html>
