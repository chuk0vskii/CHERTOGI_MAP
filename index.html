<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тайлы</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .grid {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      grid-template-rows: repeat(14, 1fr);
      gap: 0;
      width: 98vw;
      max-width: 1400px;
      aspect-ratio: 18 / 14;
    }
    .grid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    for (let row = 0; row < 14; row++) {
      for (let col = 1; col <= 18; col++) {
        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles4/tile_${row}_${col}.jpg`;
        img.alt = `tile_${row}_${col}`;
        grid.appendChild(img);
      }
    }
  </script>
</body>
</html>
