<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; height: 100vh; }
    #map { width: 100vw; height: 100vh; background: #1a1a2e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    // ===== РАЗМЕРЫ КАРТЫ =====
    const IMG_W = 9189;
    const IMG_H = 7026;

    // ===== СОЗДАЁМ КАРТУ ЧЕРЕЗ ImageStatic =====
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Image({
          source: new ol.source.ImageStatic({
            url: 'tiles2/tile_01.jpg',
            imageSize: [IMG_W, IMG_H],
            projection: 'EPSG:3857',
            imageExtent: [-IMG_W/2, -IMG_H/2, IMG_W/2, IMG_H/2]
          })
        })
      ],
      view: new ol.View({
        projection: 'EPSG:3857',
        center: [0, 0],
        zoom: 0.5,
        minZoom: 0.1,
        maxZoom: 2.5
      })
    });

    // ===== АДАПТАЦИЯ ПОД РАЗМЕР ОКНА =====
    window.addEventListener('resize', function() {
      map.updateSize();
    });
  </script>
</body>
</html>
