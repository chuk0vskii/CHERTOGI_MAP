<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Карта</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== ТОЛЬКО ДЛЯ КАРТЫ ===== */
    .wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }
    .wrapper:active { cursor: grabbing; }
    .wrapper img#mapImage {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
    .markers-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 5100px;
      height: 2500px;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
    }
    .marker {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      transform: translate(-50%, -50%);
    }
    .marker img {
      display: block;
      width: auto;
      height: auto;
      max-width: 50px;
      max-height: 50px;
    }
    .marker:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
    }
    .marker-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffd700;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }
    .marker:hover .marker-tooltip { opacity: 1; }

    /* Инфо-панель */
    .info-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 400px;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #2d2d44);
      color: white;
      padding: 30px 25px;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1000;
      overflow-y: auto;
      border-left: 2px solid rgba(255, 215, 0, 0.3);
    }
    .info-panel.open { right: 0; }
    .info-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }
    .info-panel-title {
      font-size: 24px;
      color: #ffd700;
      font-weight: bold;
    }
    .info-panel-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .info-panel-close:hover { color: #ffd700; transform: rotate(90deg); }
    .info-panel-content { font-size: 16px; line-height: 1.8; color: #ccc; }
    .info-panel-content .description {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 3px solid #ffd700;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 999;
    }
    .overlay.active { opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      .info-panel { width: 320px; right: -360px; }
      .info-panel-title { font-size: 20px; }
    }
    @media (max-width: 480px) {
      .info-panel { width: 280px; right: -320px; padding: 20px 16px; }
      .info-panel-title { font-size: 18px; }
    }
  </style>
</head>
<body>

<!-- ===== БАННЕР ===== -->
<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html" class="active">Карта</a>
    <a href="znaki.html">Знаки</a>
    <a href="put.html">Путь</a>
  </div>
</div>

<!-- ===== КАРТА ===== -->
<div class="wrapper" id="mapWrapper">
  <img id="mapImage" src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта">
  <div class="markers-container" id="markersContainer">
    <div class="marker" style="left: 1500px; top: 800px;" data-name="Штаб синдиката" data-description="Здесь находится главный штаб синдиката.">
      <img src="assets/icons/sindicat.png" alt="Синдикат">
      <span class="marker-tooltip">Штаб синдиката</span>
    </div>
    <div class="marker" style="left: 2800px; top: 1200px;" data-name="Замок графа" data-description="Мрачный замок на скале.">
      <img src="https://cdn-icons-png.flaticon.com/512/542/542558.png" alt="Замок">
      <span class="marker-tooltip">Замок графа</span>
    </div>
    <div class="marker" style="left: 3800px; top: 600px;" data-name="Деревня Ольховка" data-description="Мирная деревня.">
      <img src="https://cdn-icons-png.flaticon.com/512/1828/1828977.png" alt="Деревня">
      <span class="marker-tooltip">Деревня Ольховка</span>
    </div>
  </div>
</div>

<!-- ===== ИНФО-ПАНЕЛЬ ===== -->
<div class="overlay" id="overlay"></div>
<div class="info-panel" id="infoPanel">
  <div class="info-panel-header">
    <span class="info-panel-title" id="infoTitle">Название</span>
    <button class="info-panel-close" id="infoClose">✕</button>
  </div>
  <div class="info-panel-content">
    <p><strong>Описание:</strong></p>
    <div class="description" id="infoDescription">Описание отсутствует.</div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
