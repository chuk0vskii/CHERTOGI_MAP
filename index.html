<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; height: 100vh; }
    #map { width: 100vw; height: 100vh; background: #1a1a2e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    (function() {
      'use strict';

      const IMG_W = 9189;
      const IMG_H = 7026;
      const COLS = 18;
      const ROWS = 14;
      const TILE_SIZE = 512;
      const EXTENT = [0, 0, IMG_W, IMG_H];

      const map = new ol.Map({
        target: 'map',
        layers: [
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              tileUrlFunction: function(tileCoord) {
                const x = tileCoord[1];
                const y = tileCoord[2];
                if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return '';
                const col = x + 1;
                return `tiles4/tile_${y}_${col}.jpg`;
              },
              tileSize: TILE_SIZE,
              crossOrigin: 'anonymous'
            })
          })
        ],
        view: new ol.View({
          center: [IMG_W / 2, IMG_H / 2],
          zoom: 0.5,
          minZoom: 0.1,
          maxZoom: 2.5,
          extent: EXTENT
        })
      });

      // === АВТОМАТИЧЕСКИЙ ЗУМ, ЧТОБЫ КАРТА ВЛЕЗЛА В ЭКРАН ===
      map.getView().fit(EXTENT, {
        padding: [10, 10, 10, 10],
        maxZoom: 2.5
      });

      window.addEventListener('resize', function() {
        map.updateSize();
        map.getView().fit(EXTENT, {
          padding: [10, 10, 10, 10],
          maxZoom: 2.5
        });
      });

    })();
  </script>
</body>
</html>
