<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .map-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .map-wrapper:active {
      cursor: grabbing;
    }

    .map-container {
      position: relative;
      transform-origin: center center;
      transition: transform 0.05s linear;
      will-change: transform;
    }

    .map-container img {
      display: block;
      width: 5100px;
      height: 2500px;
      max-width: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .zoom-info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #aaa;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      z-index: 100;
    }

    .zoom-info span {
      color: #ffd700;
      font-weight: bold;
    }

    .hint {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.3);
      font-family: Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      z-index: 100;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="map-wrapper" id="mapWrapper">
  <div class="map-container" id="mapContainer">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта">
  </div>
</div>

<div class="zoom-info">Зум: <span id="zoomLevel">100</span>%</div>
<div class="hint">🖱 Колесико мыши — приблизить / отдалить</div>

<script>
  (function() {
    'use strict';

    const wrapper = document.getElementById('mapWrapper');
    const container = document.getElementById('mapContainer');
    const zoomDisplay = document.getElementById('zoomLevel');

    // ===== ПАРАМЕТРЫ =====
    const MIN_SCALE = 0.3;
    const MAX_SCALE = 1.5;
    const ZOOM_STEP = 0.08;

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY, startTranslateX, startTranslateY;

    // ===== ОБНОВЛЕНИЕ =====
    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
      zoomDisplay.textContent = Math.round(scale * 100);
    }

    // ===== ЦЕНТРИРОВАНИЕ =====
    function centerMap() {
      const rect = wrapper.getBoundingClientRect();
      const w = 5100 * scale;
      const h = 2500 * scale;
      translateX = (rect.width - w) / 2;
      translateY = (rect.height - h) / 2;
      constrain();
      updateTransform();
    }

    // ===== ГРАНИЦЫ =====
    function constrain() {
      const rect = wrapper.getBoundingClientRect();
      const w = 5100 * scale;
      const h = 2500 * scale;

      const minX = rect.width - w;
      const maxX = 0;
      translateX = Math.min(Math.max(translateX, minX), maxX);

      const minY = rect.height - h;
      const maxY = 0;
      translateY = Math.min(Math.max(translateY, minY), maxY);
    }

    // ===== ЗУМ =====
    wrapper.addEventListener('wheel', function(e) {
      e.preventDefault();

      const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
      const newScale = Math.min(Math.max(scale + delta, MIN_SCALE), MAX_SCALE);

      if (newScale === scale) return;

      scale = newScale;
      centerMap(); // просто центрируем заново
    }, { passive: false });

    // ===== ПЕРЕТАСКИВАНИЕ =====
    wrapper.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      startTranslateX = translateX;
      startTranslateY = translateY;
      wrapper.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      translateX = startTranslateX + (e.clientX - startX);
      translateY = startTranslateY + (e.clientY - startY);
      constrain();
      updateTransform();
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        wrapper.style.cursor = 'grab';
      }
    });

    // ===== РЕСАЙЗ =====
    let resizeTimeout;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(centerMap, 100);
    });

    // ===== СТАРТ =====
    const img = container.querySelector('img');
    if (img.complete) {
      centerMap();
    } else {
      img.addEventListener('load', centerMap);
    }

    setTimeout(centerMap, 1000);

  })();
</script>

</body>
</html>
