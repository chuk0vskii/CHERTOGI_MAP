<!DOCTYPE html>
<html>
<head>
  <title>TILE</title>
  <meta charset="utf-8">
  <meta http-equiv="imagetoolbar" content="no"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <style type="text/css">
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #0d0d1a; }
    body { width: 100%; height: 100%; display: flex; flex-direction: column; }

    /* ===== БАННЕР (БОРДОВЫЙ) ===== */
    .top-banner {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: #4a0e0e;
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 215, 0, 0.3);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      user-select: none;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: #ffffff; /* ← БЕЛЫЙ */
      text-decoration: none;
      font-size: 14px; letter-spacing: 1px;
      transition: all 0.3s ease; padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    /* ===== КАРТА ===== */
    #map {
      flex: 1;
      width: 100vw;
      height: 100vh;
      background: #0d0d1a;
      padding-top: 70px; /* ← ОТСТУП ПОД БАННЕР */
    }
    #slider { display: none; }
  </style>
  <link rel="stylesheet" href="https://cdn.maptiler.com/ol/v6.12.0/ol.css" type="text/css">
  <script src="https://cdnjs.cloudflare.com/polyfill/v2/polyfill.min.js?features=requestAnimationFrame,Element.prototype.classList,URL,fetch,Function.prototype.bind,es5&flags=always,gated&unknown=polyfill" type="text/javascript"></script>
  <script src="https://cdn.maptiler.com/ol/v6.12.0/ol.js" type="text/javascript"></script>
</head>
<body>

  <!-- ===== БАННЕР ===== -->
  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <!-- ===== КАРТА ===== -->
  <div id="map"></div>

  <script type="text/javascript">
    (function() {
      var mapExtent = [0.00000000, -7026.00000000, 9189.00000000, 0.00000000];
      var mapMinZoom = 0;
      var mapMaxZoom = 5;
      var mapMaxResolution = 1.00000000;
      var tileExtent = [0.00000000, -7026.00000000, 9189.00000000, 0.00000000];
      var tileWidth = 512;
      var tileHeight = 512;

      var mapResolutions = [];
      for (var z = 0; z <= mapMaxZoom; z++) {
        mapResolutions.push(Math.pow(2, mapMaxZoom - z) * mapMaxResolution);
      }

      var mapTileGrid = new ol.tilegrid.TileGrid({
        tileSize: [tileWidth, tileHeight],
        extent: tileExtent,
        minZoom: mapMinZoom,
        resolutions: mapResolutions
      });

      var layer = new ol.layer.Tile({
        source: new ol.source.XYZ({
          attributions: '<a href="https://www.maptiler.com/engine/">Rendered with MapTiler Engine</a>, non-commercial use only',
          projection: 'PIXELS',
          tileGrid: mapTileGrid,
          tilePixelRatio: 1.00000000,
          url: "TILES/{z}/{x}/{y}.webp",
        })
      });

      var map = new ol.Map({
        target: 'map',
        layers: [layer],
        view: new ol.View({
          projection: ol.proj.get('PIXELS'),
          extent: mapExtent,
          maxResolution: mapTileGrid.getResolution(mapMinZoom),
          constrainOnlyCenter: false
        })
      });

      map.getView().fit(mapExtent, map.getSize());

      window.addEventListener('resize', function() {
        map.updateSize();
        map.getView().fit(mapExtent, map.getSize());
      });

    })();
  </script>

</body>
</html>
