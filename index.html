<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    .top-banner {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,215,0,0.2);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      user-select: none;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-size: 14px; letter-spacing: 1px;
      transition: all 0.3s ease; padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    .wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 70px;
      background: #1a1a2e;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(18, 1fr);
      grid-template-rows: repeat(14, 1fr);
      gap: 0;
      width: fit-content;
      height: fit-content;
      max-width: 98vw;
      max-height: 92vh;
    }
    .grid img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
      background: #1a1a2e;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <div class="wrapper">
    <div class="grid" id="grid"></div>
  </div>

  <script>
    (function() {
      const grid = document.getElementById('grid');
      const wrapper = document.querySelector('.wrapper');

      // === РАЗМЕРЫ ===
      const COLS = 18;
      const ROWS = 14;

      // === ЗАГРУЗКА ТАЙЛОВ ===
      function loadTiles() {
        grid.innerHTML = '';
        for (let row = 0; row < ROWS; row++) {
          for (let col = 1; col <= COLS; col++) {
            const img = document.createElement('img');
            img.src = `https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles4/tile_${row}_${col}.jpg`;
            img.alt = `tile_${row}_${col}`;
            grid.appendChild(img);
          }
        }
      }

      // === РАЗМЕР ТАЙЛОВ ПОД ЭКРАН ===
      function fitTiles() {
        const rect = wrapper.getBoundingClientRect();
        const tileW = Math.floor(rect.width / COLS);
        const tileH = Math.floor(rect.height / ROWS);
        const tileSize = Math.min(tileW, tileH);

        const images = grid.querySelectorAll('img');
        images.forEach(img => {
          img.style.width = tileSize + 'px';
          img.style.height = tileSize + 'px';
        });
      }

      loadTiles();
      fitTiles();

      window.addEventListener('resize', function() {
        fitTiles();
      });

    })();
  </script>

</body>
</html>
