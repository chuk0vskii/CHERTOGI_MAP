<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OL тест</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; background: #1a1a2e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: 'https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/tile_01.jpg',
            tileSize: 512,
            crossOrigin: 'anonymous'
          })
        })
      ],
      view: new ol.View({
        center: [0, 0],
        zoom: 0.5
      })
    });
  </script>
</body>
</html>
