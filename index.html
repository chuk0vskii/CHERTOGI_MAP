<script>
  // ===== ФУНКЦИЯ ПОКАЗА КАРТЫ =====
  window.showMap = function() {
    console.log('✅ Показываем карту');
    const mapEl = document.getElementById('map');
    if (mapEl) {
      mapEl.classList.add('visible');
    }
    const preloader = document.getElementById('preloader');
    if (preloader) {
      preloader.classList.add('hidden');
      setTimeout(function() {
        preloader.style.display = 'none';
      }, 800);
    }
  };

  // ===== ЖДЁМ ИНИЦИАЛИЗАЦИИ КАРТЫ =====
  function waitForMap(callback) {
    let attempts = 0;
    const maxAttempts = 50; // 5 секунд
    
    const checkMap = setInterval(function() {
      attempts++;
      if (typeof window.map !== 'undefined' && window.map) {
        clearInterval(checkMap);
        console.log('✅ Карта готова');
        callback();
      } else if (attempts >= maxAttempts) {
        clearInterval(checkMap);
        console.warn('⚠️ Карта не инициализирована, показываем в любом случае');
        callback();
      }
    }, 100);
  }

  // Ждём карту, потом загружаем облака
  waitForMap(function() {
    if (typeof loadClouds === 'function') {
      loadClouds();
    } else {
      console.warn('⚠️ Функция loadClouds не найдена');
      window.showMap();
    }
  });

  // ===== ЗАПАСНОЙ ВАРИАНТ: через 5 секунд показываем в любом случае =====
  setTimeout(function() {
    const mapEl = document.getElementById('map');
    if (mapEl && !mapEl.classList.contains('visible')) {
      console.log('⏰ Запасной таймер: показываем карту');
      window.showMap();
    }
  }, 5000);
</script>
