<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>18 на 14</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; background: #1a1a1a; }
    #info {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 8px 20px;
      border-radius: 20px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">18 × 14</div>
  <div id="map"></div>

  <script type="importmap">
    {
      "imports": {
        "ol": "https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.esm.js"
      }
    }
  </script>

  <script type="module">
    import { Map, View } from 'ol';
    import TileLayer from 'ol/layer/Tile';
    import TileImage from 'ol/source/TileImage';
    import { get as getProjection } from 'ol/proj';
    import { createXYZ } from 'ol/tilegrid';

    // ===== НАСТРОЙКИ =====
    const COLS = 18;
    const ROWS = 14;
    const TILE_EXT = '.jpg';

    // ===== ПРАВИЛЬНЫЙ ПУТЬ ДЛЯ GITHUB PAGES =====
    // Берёт имя репозитория из URL
    const repoName = window.location.pathname.split('/')[1] || '';
    const TILE_PATH = repoName ? `/${repoName}/tiles2/` : '/tiles2/';

    console.log('🔍 Тайлы ищутся по адресу:', TILE_PATH);

    // ===== КАСТОМНЫЙ ИСТОЧНИК =====
    class FlatTileSource extends TileImage {
      constructor(options) {
        super({
          projection: getProjection('EPSG:3857'),
          tileGrid: createXYZ({
            minZoom: 6,
            maxZoom: 6,
            tileSize: 256
          }),
          transition: 0,
        });
        this.baseUrl = options.url || TILE_PATH;
      }

      getTileUrl(tileCoord) {
        const z = tileCoord[0];
        const x = tileCoord[1];
        const y = tileCoord[2];

        if (z !== 6) return undefined;
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return undefined;

        const index = y * COLS + x + 1;
        const paddedIndex = String(index).padStart(2, '0');

        const url = `${this.baseUrl}tile_${paddedIndex}${TILE_EXT}`;
        console.log('📦 Запрос тайла:', url);
        return url;
      }
    }

    // ===== КАРТА =====
    const map = new Map({
      target: 'map',
      layers: [
        new TileLayer({
          source: new FlatTileSource(),
        }),
      ],
      view: new View({
        center: [0, 0],
        zoom: 6,
        minZoom: 6,
        maxZoom: 6,
      }),
    });

    console.log('✅ Карта создана. Сетка 18×14 = 252 тайла');
  </script>
</body>
</html>
