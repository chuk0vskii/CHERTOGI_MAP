<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с зумом под курсором</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .wrapper:active {
            cursor: grabbing;
        }
        .wrapper img {
            display: block;
            position: absolute;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

<div class="wrapper" id="mapWrapper">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта" id="mapImage">
</div>

<script>
    (function() {
        'use strict';

        const img = document.getElementById('mapImage');
        const wrapper = document.getElementById('mapWrapper');

        // ===== РАЗМЕРЫ КАРТЫ =====
        const IMG_WIDTH = 5100;
        const IMG_HEIGHT = 2500;

        // ===== СОСТОЯНИЕ =====
        let scale = 1;
        let translateX = 0;
        let translateY = 0;

        // ===== ОБНОВЛЕНИЕ =====
        function updateTransform() {
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // ===== ЦЕНТРИРОВАНИЕ =====
        function centerImage() {
            const wrapperRect = wrapper.getBoundingClientRect();

            const scaleX = wrapperRect.width / IMG_WIDTH;
            const scaleY = wrapperRect.height / IMG_HEIGHT;
            scale = Math.max(scaleX, scaleY);

            translateX = (wrapperRect.width - IMG_WIDTH * scale) / 2;
            translateY = (wrapperRect.height - IMG_HEIGHT * scale) / 2;

            updateTransform();
        }

        // ===== ЗУМ ПОД КУРСОРОМ (без уменьшения) =====
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();

            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            const newScale = Math.min(Math.max(scale + delta, 1.0), 2.0); // МИНИМУМ = 1.0

            if (newScale === scale) return;

            const percentX = (mouseX - translateX) / (IMG_WIDTH * scale);
            const percentY = (mouseY - translateY) / (IMG_HEIGHT * scale);

            const newWidth = IMG_WIDTH * newScale;
            const newHeight = IMG_HEIGHT * newScale;

            translateX = mouseX - percentX * newWidth;
            translateY = mouseY - percentY * newHeight;

            const wrapperRect = wrapper.getBoundingClientRect();
            const maxX = wrapperRect.width - newWidth;
            const maxY = wrapperRect.height - newHeight;
            translateX = Math.min(Math.max(translateX, maxX), 0);
            translateY = Math.min(Math.max(translateY, maxY), 0);

            scale = newScale;
            updateTransform();
        }, { passive: false });

        // ===== ПЕРЕТАСКИВАНИЕ =====
        let isDragging = false;
        let startX, startY, startTranslateX, startTranslateY;

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startTranslateX = translateX;
            startTranslateY = translateY;
            wrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            translateX = startTranslateX + (e.clientX - startX);
            translateY = startTranslateY + (e.clientY - startY);

            const wrapperRect = wrapper.getBoundingClientRect();
            const maxX = wrapperRect.width - IMG_WIDTH * scale;
            const maxY = wrapperRect.height - IMG_HEIGHT * scale;
            translateX = Math.min(Math.max(translateX, maxX), 0);
            translateY = Math.min(Math.max(translateY, maxY), 0);

            updateTransform();
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            }
        });

        // ===== ЗАПУСК =====
        if (img.complete) {
            centerImage();
        } else {
            img.addEventListener('load', centerImage);
        }

        setTimeout(centerImage, 500);

        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(centerImage, 100);
        });

    })();
</script>

</body>
</html>
