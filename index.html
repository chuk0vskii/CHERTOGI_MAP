<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Интерактивная карта</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.2.4/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.2.4/dist/ol.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .ol-viewport {
            cursor: grab;
        }
        .ol-viewport:active {
            cursor: grabbing;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #eee;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        #coords {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #aaa;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            font-family: monospace;
        }
        #debug {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            font-size: 12px;
            font-family: monospace;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 400px;
            line-height: 1.4;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div id="map-container"></div>
    <div id="info">🗺️ Интерактивная карта • 18×14 тайлов</div>
    <div id="coords">зум: 1.00x</div>
    <div id="debug">⏳ Инициализация...</div>

    <script>
        (function() {
            console.log('🚀 Запуск карты...');
            
            // ----- ПАРАМЕТРЫ КАРТЫ -----
            const COLS = 18;
            const ROWS = 14;
            const TILE_SIZE = 256;
            
            // Размеры всей карты в пикселях
            const WIDTH = COLS * TILE_SIZE;  // 4608
            const HEIGHT = ROWS * TILE_SIZE; // 3584
            
            console.log(`📐 Размер карты: ${WIDTH}×${HEIGHT} пикселей`);
            
            // Функция для формирования URL тайла
            function getTileUrl(row, col) {
                return `tiles4/tile_${row}_${col}.jpg`;
            }

            // ----- СОЗДАЕМ ПРОЕКЦИЮ И ЭКСТЕНТ -----
            const extent = [0, 0, WIDTH, HEIGHT];
            
            const projection = new ol.proj.Projection({
                code: 'pixel',
                units: 'pixels',
                extent: extent
            });

            // ----- СОЗДАЕМ TILE GRID -----
            // Важно: правильно указать origin (левый верхний угол)
            const tileGrid = new ol.tilegrid.TileGrid({
                extent: extent,
                origin: [0, 0],
                resolutions: [1],
                tileSize: TILE_SIZE
            });

            // ----- ИСТОЧНИК ТАЙЛОВ -----
            const tileSource = new ol.source.TileImage({
                projection: projection,
                tileGrid: tileGrid,
                tileUrlFunction: function(tileCoord) {
                    const z = tileCoord[0];
                    const x = tileCoord[1];
                    const y = tileCoord[2];
                    
                    // Логируем запросы для отладки
                    console.log(`📦 Запрос: z=${z}, x=${x}, y=${y}`);
                    
                    // Проверяем границы
                    if (z !== 0) {
                        console.warn(`⚠️ Неподдерживаемый zoom: ${z}`);
                        return undefined;
                    }
                    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) {
                        console.warn(`⚠️ Тайл вне границ: x=${x}, y=${y}`);
                        return undefined;
                    }
                    
                    // Преобразуем: col = x + 1, row = y
                    const col = x + 1;
                    const row = y;
                    const url = getTileUrl(row, col);
                    
                    console.log(`✅ URL: ${url}`);
                    return url;
                },
                // Важно: разрешить кросс-доменные запросы (для GitHub Pages)
                crossOrigin: 'anonymous'
            });

            // ----- СЛОЙ КАРТЫ -----
            const tileLayer = new ol.layer.Tile({
                source: tileSource
            });

            // ----- КАРТА -----
            const map = new ol.Map({
                target: 'map-container',
                layers: [tileLayer],
                view: new ol.View({
                    projection: projection,
                    center: [WIDTH / 2, HEIGHT / 2],
                    zoom: 0,
                    minZoom: 0,
                    maxZoom: 3,
                    extent: extent,
                    constrainResolution: true,
                    showFullExtent: true
                }),
                controls: [],
                interactions: ol.interaction.defaults({
                    dragPan: true,
                    mouseWheelZoom: true,
                    pinchRotate: false,
                    pinchZoom: true,
                    keyboard: false,
                    doubleClickZoom: true
                })
            });

            // ----- ЗУМ ОТНОСИТЕЛЬНО КУРСОРА -----
            map.getInteractions().forEach(function(interaction) {
                if (interaction instanceof ol.interaction.MouseWheelZoom) {
                    if (interaction.setMouseAnchor) {
                        interaction.setMouseAnchor('cursor');
                    }
                }
            });

            // ----- ОТОБРАЖЕНИЕ ЗУМА -----
            const coordsEl = document.getElementById('coords');
            map.getView().on('change:resolution', function() {
                const view = map.getView();
                const zoom = view.getZoom();
                coordsEl.textContent = `зум: ${zoom.toFixed(2)}x`;
            });

            // ----- ПРИНУДИТЕЛЬНО ОБНОВЛЯЕМ КАРТУ -----
            map.getView().fit(extent, {
                padding: [0, 0, 0, 0],
                nearest: true
            });
            
            // Принудительно устанавливаем zoom = 0
            map.getView().setZoom(0);
            
            // Принудительно обновляем слой
            tileLayer.getSource().refresh();

            // ----- ИНФОРМАЦИЯ В ИНТЕРФЕЙСЕ -----
            document.getElementById('debug').textContent = '✅ Карта загружена';
            
            console.log('✅ Карта инициализирована');
            console.log(`📁 Тайлы: tiles4/tile_0_1.jpg ... tile_13_18.jpg`);
            console.log('🔍 Проверьте вкладку Network - должны появиться запросы к тайлам');
            
            // Проверка через 2 секунды
            setTimeout(() => {
                console.log('🔍 Проверка: если тайлы не загрузились - проблема в путях');
                console.log(`📁 Пример пути: ${getTileUrl(0, 1)}`);
                document.getElementById('debug').textContent = `📁 ${getTileUrl(0, 1)}`;
            }, 1000);
            
            // Дополнительная проверка: пробуем загрузить тайл через fetch
            setTimeout(() => {
                const testUrl = getTileUrl(0, 1);
                console.log(`🔍 Проверяем существование файла: ${testUrl}`);
                
                fetch(testUrl, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            console.log('✅ Тайл существует!');
                            document.getElementById('debug').textContent = '✅ Тайлы доступны';
                        } else {
                            console.error('❌ Тайл не найден! Код:', response.status);
                            document.getElementById('debug').textContent = `❌ Ошибка ${response.status}: ${testUrl}`;
                        }
                    })
                    .catch(error => {
                        console.error('❌ Ошибка проверки:', error);
                        document.getElementById('debug').textContent = `❌ Ошибка: ${error.message}`;
                    });
            }, 2000);
        })();
    </script>
</body>
</html>
