<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
    }

    .wrapper:active {
      cursor: grabbing;
    }

    /* ===== ВЕРХНИЙ БАННЕР ===== */
    .top-banner {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255, 215, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px;
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      letter-spacing: 4px;
      font-weight: normal;
    }

    .top-banner .nav-links {
      display: flex;
      gap: 25px;
      align-items: center;
    }

    .top-banner .nav-links a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
    }

    .top-banner .nav-links a:hover {
      color: #ffd700;
    }

    .top-banner .nav-links a.active {
      color: #ffd700;
      border-bottom-color: #ffd700;
    }

    /* ===== КАРТА ===== */
    .wrapper img#mapImage {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ МЕТОК ===== */
    .markers-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 9189px;
      height: 7026px;
      transform-origin: 0 0;
      pointer-events: none;
      z-index: 10;
    }

    /* ===== МЕТКА ===== */
    .marker {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      transform: translate(-50%, -50%);
    }

    .marker img {
      display: block;
      width: auto;
      height: auto;
      max-width: 50px;
      max-height: 50px;
    }

    .marker:hover {
      transform: translate(-50%, -50%) scale(1.3);
      filter: brightness(1.3);
    }

    .marker-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #ffd700;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .marker:hover .marker-tooltip {
      opacity: 1;
    }

    /* ===== ИНФОРМАЦИОННОЕ ОКНО ===== */
    .info-panel {
      position: fixed;
      top: 0;
      right: -450px;
      width: 400px;
      height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #2d2d44);
      color: white;
      padding: 30px 25px;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
      transition: right 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1000;
      font-family: Arial, sans-serif;
      overflow-y: auto;
      border-left: 2px solid rgba(255, 215, 0, 0.3);
    }

    .info-panel.open {
      right: 0;
    }

    .info-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
    }

    .info-panel-title {
      font-size: 24px;
      color: #ffd700;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .info-panel-close {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      font-size: 32px;
      cursor: pointer;
      transition: all 0.3s ease;
      line-height: 1;
      padding: 0 8px;
    }

    .info-panel-close:hover {
      color: #ffd700;
      transform: rotate(90deg);
    }

    .info-panel-content {
      font-size: 16px;
      line-height: 1.8;
      color: #ccc;
    }

    .info-panel-content strong {
      color: #ffd700;
    }

    .info-panel-content .description {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 3px solid #ffd700;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 999;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (max-width: 768px) {
      .top-banner {
        height: 56px;
        padding: 0 16px;
      }
      .top-banner .title {
        font-size: 18px;
        letter-spacing: 2px;
      }
      .top-banner .nav-links {
        gap: 12px;
      }
      .top-banner .nav-links a {
        font-size: 12px;
      }
      .info-panel {
        width: 320px;
        right: -360px;
      }
      .info-panel-title {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .top-banner {
        height: 48px;
        padding: 0 12px;
      }
      .top-banner .title {
        font-size: 15px;
        letter-spacing: 1px;
      }
      .top-banner .nav-links {
        gap: 8px;
      }
      .top-banner .nav-links a {
        font-size: 10px;
      }
      .info-panel {
        width: 280px;
        right: -320px;
        padding: 20px 16px;
      }
      .info-panel-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== ВЕРХНИЙ БАННЕР ===== -->
  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <!-- ===== КАРТА И МЕТКИ ===== -->
  <div class="wrapper" id="mapWrapper">
    <img id="mapImage" src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/mapchertogi1.jpeg" alt="Карта">

    <div class="markers-container" id="markersContainer">
      <div class="marker" style="left: 1500px; top: 800px;" 
           data-name="Штаб синдиката"
           data-description="Здесь находится главный штаб синдиката. Вход строго по пропускам.">
        <img src="assets/icons/sindicat.png" alt="Синдикат">
        <span class="marker-tooltip">Штаб синдиката</span>
      </div>

      <div class="marker" style="left: 2800px; top: 1200px;" 
           data-name="Замок графа"
           data-description="Мрачный замок на скале. Говорят, там водятся призраки.">
        <img src="https://cdn-icons-png.flaticon.com/512/542/542558.png" alt="Замок">
        <span class="marker-tooltip">Замок графа</span>
      </div>

      <div class="marker" style="left: 3800px; top: 600px;" 
           data-name="Деревня Ольховка"
           data-description="Мирная деревня, где можно купить провизию и отдохнуть.">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828977.png" alt="Деревня">
        <span class="marker-tooltip">Деревня Ольховка</span>
      </div>
    </div>
  </div>

  <!-- ===== ИНФОРМАЦИОННОЕ ОКНО ===== -->
  <div class="overlay" id="overlay"></div>
  <div class="info-panel" id="infoPanel">
    <div class="info-panel-header">
      <span class="info-panel-title" id="infoTitle">Название</span>
      <button class="info-panel-close" id="infoClose">✕</button>
    </div>
    <div class="info-panel-content" id="infoContent">
      <p><strong>Описание:</strong></p>
      <div class="description" id="infoDescription">Описание отсутствует.</div>
    </div>
  </div>

  <script>
    (function() {
      const img = document.getElementById('mapImage');
      const wrapper = document.getElementById('mapWrapper');
      const markersContainer = document.getElementById('markersContainer');

      const infoPanel = document.getElementById('infoPanel');
      const infoTitle = document.getElementById('infoTitle');
      const infoDescription = document.getElementById('infoDescription');
      const infoClose = document.getElementById('infoClose');
      const overlay = document.getElementById('overlay');

      // ===== РАЗМЕРЫ КАРТЫ =====
      const IMG_W = 9189;
      const IMG_H = 7026;

      // ===== ПАРАМЕТРЫ ЗУМА =====
      const MAX_SCALE = 0.7;
      const STEP = 0.2;

      let scale = 1;
      let tx = 0;
      let ty = 0;
      let minScale = 1;

      function update() {
        const transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        img.style.transform = transform;
        markersContainer.style.transform = transform;
      }

      function center() {
        const rect = wrapper.getBoundingClientRect();
        const sx = rect.width / IMG_W;
        const sy = rect.height / IMG_H;
        minScale = Math.min(sx, sy);
        scale = minScale;
        tx = (rect.width - IMG_W * scale) / 2;
        ty = (rect.height - IMG_H * scale) / 2;
        update();
      }

      // ===== ЗУМ (работает под курсором) =====
      wrapper.addEventListener('wheel', function(e) {
        e.preventDefault();

        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const delta = e.deltaY > 0 ? -STEP : STEP;
        let newScale = scale + delta;
        newScale = Math.min(Math.max(newScale, minScale), MAX_SCALE);

        if (newScale === scale) return;

        const px = (mouseX - tx) / scale;
        const py = (mouseY - ty) / scale;

        const newW = IMG_W * newScale;
        const newH = IMG_H * newScale;

        tx = mouseX - px * newW;
        ty = mouseY - py * newH;

        const maxX = rect.width - newW;
        const maxY = rect.height - newH;
        tx = Math.min(Math.max(tx, maxX), 0);
        ty = Math.min(Math.max(ty, maxY), 0);

        scale = newScale;
        update();
      }, { passive: false });

      // ===== ПЕРЕТАСКИВАНИЕ (работает) =====
      let isDragging = false;
      let startX, startY, startTx, startTy;

      wrapper.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startTx = tx;
        startTy = ty;
        wrapper.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        tx = startTx + (e.clientX - startX);
        ty = startTy + (e.clientY - startY);
        update();
      });

      window.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          wrapper.style.cursor = 'grab';
        }
      });

      window.addEventListener('mouseleave', function() {
        if (isDragging) {
          isDragging = false;
          wrapper.style.cursor = 'grab';
        }
      });

      // ===== ИНФО-ПАНЕЛЬ =====
      document.querySelectorAll('.marker').forEach(marker => {
        marker.addEventListener('click', function(e) {
          e.stopPropagation();
          const name = this.dataset.name || 'Без названия';
          const description = this.dataset.description || 'Описание отсутствует.';
          infoTitle.textContent = name;
          infoDescription.textContent = description;
          infoPanel.classList.add('open');
          overlay.classList.add('active');
        });
      });

      function closeInfo() {
        infoPanel.classList.remove('open');
        overlay.classList.remove('active');
      }

      infoClose.addEventListener('click', closeInfo);
      overlay.addEventListener('click', closeInfo);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeInfo();
      });

      // ===== ЗАПУСК =====
      if (img.complete) {
        center();
      } else {
        img.addEventListener('load', center);
      }
      setTimeout(center, 500);

      let resizeTimer;
      window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(center, 100);
      });

    })();
  </script>

</body>
</html>
