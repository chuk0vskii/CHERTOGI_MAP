<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тест зума</title>
  <style>
    body { margin: 0; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; background: #1a1a2e; }
    .wrapper { width: 100vw; height: 100vh; overflow: hidden; position: relative; cursor: grab; }
    .wrapper:active { cursor: grabbing; }
    .wrapper img { display: block; position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; user-select: none; -webkit-user-drag: none; }
  </style>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <img id="mapImage" src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles4/mapchertogi1.jpeg" alt="Карта">
  </div>
  <script>
    (function() {
      const img = document.getElementById('mapImage');
      const wrapper = document.getElementById('wrapper');

      let scale = 1;
      let tx = 0;
      let ty = 0;
      const MIN_SCALE = 0.3;
      const MAX_SCALE = 2.0;
      const STEP = 0.08;

      function update() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }

      wrapper.addEventListener('wheel', function(e) {
        e.preventDefault();

        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const delta = e.deltaY > 0 ? -STEP : STEP;
        let newScale = scale + delta;
        newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);

        if (newScale === scale) return;

        const px = (mouseX - tx) / scale;
        const py = (mouseY - ty) / scale;

        scale = newScale;
        tx = mouseX - px * scale;
        ty = mouseY - py * scale;

        update();
      }, { passive: false });
    })();
  </script>
</body>
</html>
