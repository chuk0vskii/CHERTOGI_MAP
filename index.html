<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Тайлы</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .grid { display: grid; grid-template-columns: repeat(18, 1fr); gap: 0; width: 100%; max-width: 1400px; }
    .grid img { display: block; width: 100%; height: auto; border: none; margin: 0; image-rendering: pixelated; }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script>
    const grid = document.getElementById('grid');
    const totalTiles = 252;
    const cols = 18;

    for (let i = 1; i <= totalTiles; i++) {
      const img = document.createElement('img');
      const padded = String(i).padStart(2, '0');
      // Добавляем ?t=Date.now() чтобы обойти кэш
      img.src = `https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/tile_${padded}.jpg?t=${Date.now()}`;
      img.alt = `tile ${i}`;
      grid.appendChild(img);
    }
  </script>
</body>
</html>
