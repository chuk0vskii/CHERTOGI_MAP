<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a2e; overflow: hidden; height: 100vh; }

    .top-banner {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,215,0,0.2);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      user-select: none;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-size: 14px; letter-spacing: 1px;
      transition: all 0.3s ease; padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    #map {
      width: 100vw;
      height: calc(100vh - 70px);
      margin-top: 70px;
      background: #1a1a2e;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <div id="map"></div>

  <script>
    (function() {
      'use strict';

      // ===== РАЗМЕРЫ КАРТЫ =====
      const COLS = 18;
      const ROWS = 14;
      const TILE_SIZE = 512;
      const IMG_W = COLS * TILE_SIZE;
      const IMG_H = ROWS * TILE_SIZE;

      // ===== КАРТА =====
      const map = new ol.Map({
        target: 'map',
        layers: [
          new ol.layer.Tile({
            source: new ol.source.XYZ({
              tileUrlFunction: function(tileCoord) {
                const x = tileCoord[1];
                const y = tileCoord[2];

                if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return '';

                const col = x + 1; // столбцы с 1
                return `tiles4/tile_${y}_${col}.jpg`;
              },
              tileSize: TILE_SIZE,
              crossOrigin: 'anonymous'
            })
          })
        ],
        view: new ol.View({
          center: [0, 0],
          zoom: 0.5,
          minZoom: 0.1,
          maxZoom: 2.5,
          extent: [-IMG_W/2, -IMG_H/2, IMG_W/2, IMG_H/2]
        })
      });

      // === АВТОМАТИЧЕСКИЙ ЗУМ, ЧТОБЫ КАРТА ВЛЕЗЛА В ЭКРАН ===
      map.getView().fit([-IMG_W/2, -IMG_H/2, IMG_W/2, IMG_H/2], {
        padding: [10, 10, 10, 10],
        maxZoom: 2.5
      });

      window.addEventListener('resize', function() {
        map.updateSize();
        map.getView().fit([-IMG_W/2, -IMG_H/2, IMG_W/2, IMG_H/2], {
          padding: [10, 10, 10, 10],
          maxZoom: 2.5
        });
      });

    })();
  </script>

</body>
</html>
