<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с зумом под курсором</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }
        .wrapper:active {
            cursor: grabbing;
        }
        .wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

<div class="wrapper" id="mapWrapper">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта" id="mapImage">
</div>

<script>
    (function() {
        'use strict';

        const img = document.getElementById('mapImage');
        const wrapper = document.getElementById('mapWrapper');

        // ===== СОСТОЯНИЕ =====
        let scale = 1;
        let translateX = 0;
        let translateY = 0;

        // ===== ОБНОВЛЕНИЕ =====
        function updateTransform() {
            img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        // ===== ЦЕНТРИРОВАНИЕ =====
        function centerImage() {
            const wrapperRect = wrapper.getBoundingClientRect();
            const imgWidth = img.naturalWidth || 5100;
            const imgHeight = img.naturalHeight || 2500;

            const scaleX = wrapperRect.width / imgWidth;
            const scaleY = wrapperRect.height / imgHeight;
            scale = Math.min(scaleX, scaleY);

            translateX = (wrapperRect.width - imgWidth * scale) / 2;
            translateY = (wrapperRect.height - imgHeight * scale) / 2;

            updateTransform();
        }

        // ===== ЗУМ ПОД КУРСОРОМ (ПРАВИЛЬНЫЙ) =====
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();

            // Координаты мыши внутри wrapper
            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Текущий размер картинки в пикселях
            const imgWidth = img.naturalWidth || 5100;
            const imgHeight = img.naturalHeight || 2500;
            const currentWidth = imgWidth * scale;
            const currentHeight = imgHeight * scale;

            // Положение мыши относительно картинки (в %)
            const percentX = (mouseX - translateX) / currentWidth;
            const percentY = (mouseY - translateY) / currentHeight;

            // Новый масштаб
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            const newScale = Math.min(Math.max(scale + delta, 0.2), 1.5);

            if (newScale === scale) return;

            // Новый размер
            const newWidth = imgWidth * newScale;
            const newHeight = imgHeight * newScale;

            // Новое смещение, чтобы точка под мышью осталась на месте
            translateX = mouseX - percentX * newWidth;
            translateY = mouseY - percentY * newHeight;

            // Ограничения (чтобы карта не уезжала)
            const wrapperRect = wrapper.getBoundingClientRect();
            const maxX = wrapperRect.width - newWidth;
            const maxY = wrapperRect.height - newHeight;
            translateX = Math.min(Math.max(translateX, maxX), 0);
            translateY = Math.min(Math.max(translateY, maxY), 0);

            scale = newScale;
            updateTransform();
        }, { passive: false });

        // ===== ПЕРЕТАСКИВАНИЕ =====
        let isDragging = false;
        let startX, startY, startTranslateX, startTranslateY;

        wrapper.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startTranslateX = translateX;
            startTranslateY = translateY;
            wrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            translateX = startTranslateX + (e.clientX - startX);
            translateY = startTranslateY + (e.clientY - startY);

            const wrapperRect = wrapper.getBoundingClientRect();
            const imgWidth = img.naturalWidth || 5100;
            const imgHeight = img.naturalHeight || 2500;
            const maxX = wrapperRect.width - imgWidth * scale;
            const maxY = wrapperRect.height - imgHeight * scale;
            translateX = Math.min(Math.max(translateX, maxX), 0);
            translateY = Math.min(Math.max(translateY, maxY), 0);

            updateTransform();
        });

        window.addEventListener('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                wrapper.style.cursor = 'grab';
            }
        });

        // ===== ЗАПУСК =====
        if (img.complete) {
            centerImage();
        } else {
            img.addEventListener('load', centerImage);
        }

        setTimeout(centerImage, 1000);

        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(centerImage, 100);
        });

    })();
</script>

</body>
</html>
