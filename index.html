<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #map { width: 100vw; height: 100vh; background: #1a1a2e; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const COLS = 18;
    const ROWS = 14;
    const TILE_SIZE = 512;

    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.XYZ({
            tileUrlFunction: function(tileCoord) {
              const z = tileCoord[0];
              const x = tileCoord[1];
              const y = tileCoord[2];

              // Только один уровень зума (z=0)
              if (z !== 0) return '';

              const index = y * COLS + x + 1;
              if (index < 1 || index > COLS * ROWS) return '';
              const padded = String(index).padStart(2, '0');
              return `https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/tile_${padded}.jpg`;
            },
            tileSize: TILE_SIZE,
            crossOrigin: 'anonymous'
          })
        })
      ],
      view: new ol.View({
        center: [0, 0],
        zoom: 0,
        minZoom: 0,
        maxZoom: 0,
        resolutions: [1]
      })
    });

    window.addEventListener('resize', function() {
      map.updateSize();
    });
  </script>
</body>
</html>
