<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест зума</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: #0d0d1a;
      cursor: grab;
    }
    .wrapper:active { cursor: grabbing; }
    #container {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #container img {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>

<div class="wrapper" id="wrapper">
  <div id="container"></div>
</div>

<script>
  (function() {
    const container = document.getElementById('container');
    const wrapper = document.getElementById('wrapper');

    // ===== 1. СОЗДАЁМ ТАЙЛЫ =====
    const COLS = 18;
    const ROWS = 14;
    const totalTiles = COLS * ROWS;
    let tileSize = 0;

    // ВРЕМЕННО: просто картинка целиком, чтобы проверить зум
    const img = document.createElement('img');
    img.src = 'map.jpg'; // или 'https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg';
    img.alt = 'Карта';
    container.appendChild(img);

    // ===== 2. СОСТОЯНИЕ =====
    let scale = 1;
    let tx = 0;
    let ty = 0;
    const MIN_SCALE = 0.3;
    const MAX_SCALE = 3.0;
    const STEP = 0.08;

    // ===== 3. ЦЕНТРИРОВАНИЕ =====
    function center() {
      const wrapperRect = wrapper.getBoundingClientRect();
      const imgRect = img.getBoundingClientRect();
      const scaleX = wrapperRect.width / imgRect.width;
      const scaleY = wrapperRect.height / imgRect.height;
      scale = Math.min(scaleX, scaleY);
      tx = (wrapperRect.width - imgRect.width * scale) / 2;
      ty = (wrapperRect.height - imgRect.height * scale) / 2;
      applyTransform();
    }

    // ===== 4. ПРИМЕНЕНИЕ =====
    function applyTransform() {
      container.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }

    // ===== 5. ЗУМ ПОД КУРСОРОМ (ИЗ ТЕСТОВОЙ КАРТЫ) =====
    wrapper.addEventListener('wheel', function(e) {
      e.preventDefault();

      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const delta = e.deltaY > 0 ? -STEP : STEP;
      let newScale = scale + delta;
      newScale = Math.min(Math.max(newScale, MIN_SCALE), MAX_SCALE);

      if (newScale === scale) return;

      const px = (mouseX - tx) / scale;
      const py = (mouseY - ty) / scale;

      scale = newScale;
      tx = mouseX - px * scale;
      ty = mouseY - py * scale;

      applyTransform();
    }, { passive: false });

    // ===== 6. ЗАПУСК =====
    img.onload = center;
    if (img.complete) center();
    window.addEventListener('resize', center);

  })();
</script>

</body>
</html>
