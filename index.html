<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карта</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .map-wrapper {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: grab;
    }
    .map-wrapper:active { cursor: grabbing; }
    .map-container {
      transform-origin: center center;
      transition: transform 0.05s linear;
      will-change: transform;
    }
    .map-container img {
      display: block;
      width: 5100px;
      height: 2500px;
      max-width: none;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

<div class="map-wrapper" id="mapWrapper">
  <div class="map-container" id="mapContainer">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта">
  </div>
</div>

<script>
  // Простой зум от центра
  const container = document.getElementById('mapContainer');
  let scale = 1;

  document.getElementById('mapWrapper').addEventListener('wheel', function(e) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    scale = Math.min(Math.max(scale + delta, 0.3), 1.5);
    container.style.transform = `scale(${scale})`;
  }, { passive: false });
</script>

</body>
</html>
