<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🗺️ Карта мира</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="controls">
    <button id="zoom-in">🔍 +</button>
    <button id="zoom-out">🔍 −</button>
  </div>
  <h1 style="text-align:center;color:#ffd700;">🗺️ Исследование мира</h1>
  <p style="text-align:center;color:#aaa;">Нажимайте на гексы для информации</p>
  <p id="progress" style="text-align:center;color:#aaa;"></p>
  <div id="hex-grid"></div>
  
  <div id="info-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="hex-name"></h2>
      <p id="hex-desc"></p>
      <p id="hex-status"></p>
    </div>
  </div>
  <script type="module" src="js/map.js"></script>
</body>
</html>
