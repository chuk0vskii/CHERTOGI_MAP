<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карта с зумом под курсором</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            cursor: grab;
        }

        .wrapper:active {
            cursor: grabbing;
        }

        .wrapper img {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

<div class="wrapper" id="mapWrapper">
    <img src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/map.jpg" alt="Карта" id="mapImage">
</div>

<script>
    (function() {
        const img = document.getElementById('mapImage');
        const wrapper = document.getElementById('mapWrapper');

        // ===== РАЗМЕРЫ КАРТЫ =====
        const IMG_W = 5100;
        const IMG_H = 2500;

        // ===== СОСТОЯНИЕ =====
        let scale = 1;
        let tx = 0;
        let ty = 0;
        let dragging = false;
        let startX, startY, startTx, startTy;

        // ===== ОБНОВЛЕНИЕ =====
        function update() {
            img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        }

        // ===== ЦЕНТРИРОВАНИЕ ПРИ ЗАГРУЗКЕ (100% + центрирование) =====
        function center() {
            const rect = wrapper.getBoundingClientRect();

            // Масштаб = 1.0 (100%)
            scale = 1.0;

            // Смещаем, чтобы карта была по центру
            tx = (rect.width - IMG_W * scale) / 2;
            ty = (rect.height - IMG_H * scale) / 2;

            update();
        }

        // ===== ЗУМ ПОД КУРСОРОМ =====
        wrapper.addEventListener('wheel', function(e) {
            e.preventDefault();

            const rect = wrapper.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Новый масштаб
            const delta = e.deltaY > 0 ? -0.08 : 0.08;
            let newScale = scale + delta;

            // Ограничения: от 1.0 до 2.0
            newScale = Math.min(Math.max(newScale, 1.0), 2.0);

            if (newScale === scale) return;

            // Процентное положение мыши внутри картинки
            const percentX = (mouseX - tx) / (IMG_W * scale);
            const percentY = (mouseY - ty) / (IMG_H * scale);

            // Новые размеры
            const newW = IMG_W * newScale;
            const newH = IMG_H * newScale;

            // Новое смещение
            tx = mouseX - percentX * newW;
            ty = mouseY - percentY * newH;

            // Ограничения (чтобы карта не уезжала за края)
            const maxX = rect.width - newW;
            const maxY = rect.height - newH;
            tx = Math.min(Math.max(tx, maxX), 0);
            ty = Math.min(Math.max(ty, maxY), 0);

            scale = newScale;
            update();
        }, { passive: false });

        // ===== ПЕРЕТАСКИВАНИЕ =====
        wrapper.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            dragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startTx = tx;
            startTy = ty;
            wrapper.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            tx = startTx + (e.clientX - startX);
            ty = startTy + (e.clientY - startY);

            const rect = wrapper.getBoundingClientRect();
            const maxX = rect.width - IMG_W * scale;
            const maxY = rect.height - IMG_H * scale;
            tx = Math.min(Math.max(tx, maxX), 0);
            ty = Math.min(Math.max(ty, maxY), 0);

            update();
        });

        window.addEventListener('mouseup', function() {
            if (dragging) {
                dragging = false;
                wrapper.style.cursor = 'grab';
            }
        });

        // ===== ЗАПУСК =====
        if (img.complete) {
            center();
        } else {
            img.addEventListener('load', center);
        }

        setTimeout(center, 500);

        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(center, 100);
        });

    })();
</script>

</body>
</html>
