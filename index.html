<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Карта 18×14</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; }
    #map { width: 100%; height: 100%; background: #1a1a1a; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script type="importmap">
    {
      "imports": {
        "ol": "https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.esm.js"
      }
    }
  </script>

  <script type="module">
    import { Map, View } from 'ol';
    import TileLayer from 'ol/layer/Tile';
    import TileImage from 'ol/source/TileImage';
    import { get as getProjection } from 'ol/proj';
    import { createXYZ } from 'ol/tilegrid';

    // ===== КОНФИГУРАЦИЯ =====
    const COLS = 18;              // тайлов по горизонтали
    const ROWS = 14;              // тайлов по вертикали
    const TILE_PATH = 'tiles2/';  // папка с тайлами (относительно index.html)
    const TILE_EXT = '.jpg';      // расширение файлов

    // ===== КАСТОМНЫЙ ИСТОЧНИК =====
    class FlatTileSource extends TileImage {
      constructor(options) {
        super({
          projection: getProjection('EPSG:3857'),
          tileGrid: createXYZ({ 
            minZoom: 6, 
            maxZoom: 6,
            tileSize: 256
          }),
          transition: 0,
        });
        this.baseUrl = options.url || 'tiles2/';
      }

      getTileUrl(tileCoord) {
        const z = tileCoord[0];
        const x = tileCoord[1];
        const y = tileCoord[2];

        // Работаем только на 6-м зуме
        if (z !== 6) return undefined;

        // Проверяем, что тайл в пределах нашей сетки
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return undefined;

        // Плоский номер: 1..252 (с ведущим нулём для 01..09)
        const index = y * COLS + x + 1;
        const paddedIndex = String(index).padStart(2, '0');

        return `${this.baseUrl}tile_${paddedIndex}${TILE_EXT}`;
      }
    }

    // ===== СОЗДАЁМ КАРТУ =====
    const map = new Map({
      target: 'map',
      layers: [
        new TileLayer({
          source: new FlatTileSource({
            url: TILE_PATH,
          }),
        }),
      ],
      view: new View({
        center: [0, 0],
        zoom: 6,
        minZoom: 6,
        maxZoom: 6,
      }),
    });

    // ===== ОТЛАДКА =====
    console.log('Сетка: 18×14 = 252 тайла');
    console.log('Файлы ищутся по пути:', TILE_PATH);
    console.log('Пример: tile_01.jpg →', TILE_PATH + 'tile_01.jpg');
    console.log('Открой Network в F12, чтобы увидеть запросы');
  </script>
</body>
</html>
