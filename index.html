<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Интерактивная карта</title>
    <!-- Подключаем OpenLayers -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.2.1/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v10.2.1/dist/ol.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
            font-family: sans-serif;
        }
        #map-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #2b2b2b;
        }
        .ol-viewport {
            cursor: grab;
        }
        .ol-viewport:active {
            cursor: grabbing;
        }
        #info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #eee;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 14px;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1000;
        }
        #coords {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #aaa;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            pointer-events: none;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.08);
            z-index: 1000;
            font-family: monospace;
        }
        #debug {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            font-family: monospace;
            z-index: 1000;
            background: rgba(0,0,0,0.3);
            padding: 4px 10px;
            border-radius: 12px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="map-container"></div>
    <div id="info">🗺️ Интерактивная карта • 18×14 тайлов</div>
    <div id="coords">зум: 1.00x</div>
    <div id="debug">📁 tiles4/</div>

    <script>
        (function() {
            // ----- ПАРАМЕТРЫ КАРТЫ -----
            const COLS = 18;          // столбцы 1..18
            const ROWS = 14;          // ряды 0..13
            const TILE_SIZE = 256;
            
            // ПУТЬ К ТАЙЛАМ: папка tiles4 в корне репозитория
            function getTileUrl(row, col) {
                // row: 0..13, col: 1..18
                return `tiles4/tile_${row}_${col}.jpg`;
            }

            // ----- ЭКСТЕНТ КАРТЫ -----
            const EXTENT = [0, 0, COLS * TILE_SIZE, ROWS * TILE_SIZE];
            
            // Проекция
            const projection = new ol.proj.Projection({
                code: 'pixel',
                units: 'pixels',
                extent: EXTENT
            });

            // ----- ИСТОЧНИК ТАЙЛОВ -----
            const tileSource = new ol.source.TileImage({
                projection: projection,
                tileGrid: new ol.tilegrid.TileGrid({
                    extent: EXTENT,
                    resolutions: [1],
                    tileSize: TILE_SIZE,
                    origin: [0, 0]
                }),
                tileUrlFunction: function(tileCoord) {
                    const z = tileCoord[0];
                    const x = tileCoord[1];
                    const y = tileCoord[2];
                    
                    if (z !== 0) return undefined;
                    if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return undefined;
                    
                    const col = x + 1;
                    const row = y;
                    
                    return getTileUrl(row, col);
                },
                transition: 0
            });

            // ----- СЛОЙ КАРТЫ -----
            const tileLayer = new ol.layer.Tile({
                source: tileSource,
                renderMode: 'hybrid'
            });

            // ----- КАРТА -----
            const map = new ol.Map({
                target: 'map-container',
                layers: [tileLayer],
                view: new ol.View({
                    projection: projection,
                    center: [EXTENT[2] / 2, EXTENT[3] / 2],
                    zoom: 0,
                    minZoom: 0,
                    maxZoom: 3,
                    extent: EXTENT,
                    constrainOnlyCenter: false,
                    smoothExtentConstraint: true
                }),
                controls: [],
                interactions: ol.interaction.defaults({
                    dragPan: true,
                    mouseWheelZoom: true,
                    pinchRotate: false,
                    pinchZoom: true,
                    keyboard: false,
                    doubleClickZoom: true,
                    select: false,
                    dragZoom: false,
                    shiftDragZoom: false
                })
            });

            // ----- ЗУМ ОТНОСИТЕЛЬНО КУРСОРА -----
            const interactions = map.getInteractions();
            interactions.forEach(function(interaction) {
                if (interaction instanceof ol.interaction.MouseWheelZoom) {
                    interaction.setMouseAnchor('cursor');
                }
            });

            // ----- ОТОБРАЖЕНИЕ ЗУМА -----
            const coordsEl = document.getElementById('coords');
            map.getView().on('change:resolution', function() {
                const view = map.getView();
                const zoom = view.getZoom();
                coordsEl.textContent = `зум: ${zoom.toFixed(2)}x`;
            });

            // ----- ЦЕНТРИРОВАНИЕ -----
            const view = map.getView();
            view.fit(EXTENT, {
                padding: [10, 10, 10, 10],
                nearest: true,
                minResolution: 1,
                maxZoom: 0
            });
            view.setZoom(0);
            view.setCenter([EXTENT[2] / 2, EXTENT[3] / 2]);

            console.log('✅ Карта инициализирована');
            console.log(`📐 Тайлы: ${COLS}×${ROWS} = ${COLS * ROWS} шт.`);
            console.log(`📁 Путь: tiles4/tile_0_1.jpg ... tile_13_18.jpg`);
            console.log(`🔗 Пример URL: ${getTileUrl(0, 1)}`);
        })();
    </script>
</body>
</html>
