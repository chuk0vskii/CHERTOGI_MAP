<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="imagetoolbar" content="no"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Огненные чертоги</title>

  <!-- СТИЛИ -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.maptiler.com/ol/v6.12.0/ol.css">

  <!-- ПОЛИФИЛЛЫ -->
  <script src="https://cdnjs.cloudflare.com/polyfill/v2/polyfill.min.js?features=requestAnimationFrame,Element.prototype.classList,URL,fetch,Function.prototype.bind,es5&flags=always,gated&unknown=polyfill"></script>
</head>
<body>

  <!-- БАННЕР -->
  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <div id="version-counter">⚙️ v1.0</div>
  <div id="map"></div>

  <!-- БОКОВАЯ ПАНЕЛЬ -->
  <div id="region-sidebar">
    <button id="close-sidebar">✕</button>
    <h2 id="sidebar-title">Название региона</h2>
    <p id="sidebar-description">Описание региона</p>
    <button id="report-btn">📝 Составить отчёт</button>
    <div>
      <h4>📋 Отчёты игроков</h4>
      <div id="reports-list"><p>Загрузка...</p></div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div id="report-modal">
    <div>
      <h3>📝 Новый отчёт</h3>
      <p id="modal-region-name">Регион: Лесной край</p>
      <input id="report-author" type="text" placeholder="Ваше имя (опционально)">
      <textarea id="report-content" placeholder="Опишите события..."></textarea>
      <div>
        <button id="submit-report-btn">Отправить</button>
        <button id="cancel-report-btn">Отмена</button>
      </div>
    </div>
  </div>

  <!-- СКРИПТЫ -->
  <script src="https://cdn.maptiler.com/ol/v6.12.0/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  
  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
  <script src="js/regions.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
