<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Огненные чертоги</title>
  <style>
    body { margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; background: #1a1a2e; }

    .top-banner {
      position: fixed; top: 0; left: 0; width: 100%; height: 70px;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      border-bottom: 2px solid rgba(255,215,0,0.2);
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100; padding: 0 30px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.5);
      user-select: none;
    }
    .top-banner .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 28px; color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.3);
      letter-spacing: 4px; font-weight: normal;
    }
    .top-banner .nav-links { display: flex; gap: 25px; align-items: center; }
    .top-banner .nav-links a {
      color: rgba(255,255,255,0.5); text-decoration: none;
      font-size: 14px; letter-spacing: 1px;
      transition: all 0.3s ease; padding: 6px 0;
      border-bottom: 2px solid transparent;
    }
    .top-banner .nav-links a:hover { color: #ffd700; }
    .top-banner .nav-links a.active { color: #ffd700; border-bottom-color: #ffd700; }

    .wrapper {
      flex: 1;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      cursor: grab;
      padding-top: 70px;
      background: #1a1a2e;
    }
    .wrapper:active { cursor: grabbing; }
    .wrapper img {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>

  <div class="top-banner">
    <span class="title">Огненные чертоги</span>
    <div class="nav-links">
      <a href="index.html" class="active">Карта</a>
      <a href="znaki.html">Знаки</a>
      <a href="put.html">Путь</a>
    </div>
  </div>

  <div class="wrapper" id="wrapper">
    <img id="mapImage" src="https://raw.githubusercontent.com/chuk0vskii/CHERTOGI_MAP/main/tiles2/mapchertogi1.jpeg" alt="Карта">
  </div>

  <script>
    (function() {
      const img = document.getElementById('mapImage');
      const wrapper = document.getElementById('wrapper');

      const IMG_W = 9189;
      const IMG_H = 7026;

      let scale = 1;
      let tx = 0;
      let ty = 0;
      let minScale = 1;
      const MAX_SCALE = 2.0;
      const STEP = 0.08;

      function update() {
        img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      }

      // ===== ОГРАНИЧЕНИЯ (НЕ ДАЁМ УЕХАТЬ ЗА КРАЯ) =====
      function constrain() {
        const rect = wrapper.getBoundingClientRect();
        const imgW = IMG_W * scale;
        const imgH = IMG_H * scale;

        // Минимальное и максимальное смещение
        const minX = rect.width - imgW;
        const maxX = 0;
        const minY = rect.height - imgH;
        const maxY = 0;

        tx = Math.min(Math.max(tx, minX), maxX);
        ty = Math.min(Math.max(ty, minY), maxY);
      }

      function center() {
        const rect = wrapper.getBoundingClientRect();
        const sx = rect.width / IMG_W;
        const sy = rect.height / IMG_H;
        minScale = Math.min(sx, sy);
        scale = minScale;
        tx = (rect.width - IMG_W * scale) / 2;
        ty = (rect.height - IMG_H * scale) / 2;
        update();
      }

      // ===== ЗУМ =====
      wrapper.addEventListener('wheel', function(e) {
        e.preventDefault();

        const rect = wrapper.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const delta = e.deltaY > 0 ? -STEP : STEP;
        let newScale = scale + delta;
        newScale = Math.min(Math.max(newScale, minScale), MAX_SCALE);

        if (newScale === scale) return;

        const px = (mouseX - tx) / scale;
        const py = (mouseY - ty) / scale;

        scale = newScale;
        tx = mouseX - px * scale;
        ty = mouseY - py * scale;

        constrain(); // ← НЕ ДАЁМ УЕХАТЬ ЗА КРАЯ
        update();
      }, { passive: false });

      // ===== ПЕРЕТАСКИВАНИЕ =====
      let isDragging = false;
      let startX, startY, startTx, startTy;

      wrapper.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startTx = tx;
        startTy = ty;
        wrapper.style.cursor = 'grabbing';
      });

      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        tx = startTx + (e.clientX - startX);
        ty = startTy + (e.clientY - startY);
        constrain();
        update();
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          wrapper.style.cursor = 'grab';
        }
      });

      // ===== ЗАПУСК =====
      if (img.complete) {
        center();
      } else {
        img.addEventListener('load', center);
      }
      window.addEventListener('resize', center);

    })();
  </script>

</body>
</html>
