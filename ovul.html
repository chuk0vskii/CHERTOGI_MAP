<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Овуль</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(180deg, #0a0a0a 0%, #1a1010 40%, #0f0a0a 70%, #050505 100%);
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== ДЕКОРАТИВНЫЕ ГЕКСЫ ===== */
    .bg-image {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      pointer-events: none;
      opacity: 0.15;
      width: 700px;
      height: 700px;
      object-fit: contain;
      filter: brightness(1.3) contrast(1.1);
    }
    .bg-image-left { left: -350px; animation: rotateLeft 60s linear infinite; }
    .bg-image-right { right: -350px; animation: rotateRight 60s linear infinite; }
    @keyframes rotateLeft { 0% { transform: translateY(-50%) rotate(0deg); } 100% { transform: translateY(-50%) rotate(360deg); } }
    @keyframes rotateRight { 0% { transform: translateY(-50%) rotate(0deg); } 100% { transform: translateY(-50%) rotate(-360deg); } }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 100px 20px 40px 40px;
      position: relative;
      z-index: 2;
    }

    /* ===== МЕСТО ДЛЯ КАРТИНКИ ===== */
    .map-container {
      width: 100%;
      height: 320px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      background: transparent;
      border: none; 
      border-radius: 0; 
      padding: 0;
    }
    
    .map-container img {
      width: 120%;
      height: 120%;
      object-fit: contain;
      object-position: center; 
      margin-top: -10px;
      margin-bottom: -10px;
      display: block;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
      cursor: crosshair; /* Курсор в виде прицела для удобства */
    }

    .page-title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 42px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 4px;
      font-weight: normal;
      text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .page-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    /* ===== ПАНЕЛЬ ФИЛЬТРОВ ===== */
    .filters-panel {
      background: rgba(74, 14, 14, 0.2);
      border: 1px solid rgba(74, 14, 14, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      backdrop-filter: blur(4px);
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .filters-panel input, .filters-panel select {
      padding: 10px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #ffffff;
      font-family: 'Philosopher', sans-serif;
      font-size: 14px;
      flex: 1;
      min-width: 150px;
    }
    .filters-panel input:focus, .filters-panel select:focus {
      outline: none;
      border-color: #ffd700;
    }
    .filters-panel select option { background: #1a0a1a; color: #fff; }

    /* ===== СЕТКА ПЕРСОНАЖЕЙ ===== */
    .characters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
    }

    .character-card {
      background: rgba(74, 14, 14, 0.2);
      border: 1px solid rgba(74, 14, 14, 0.2);
      border-radius: 12px;
      padding: 12px 15px;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      height: 90px;
      min-height: 90px;
    }
    .character-card:hover {
      background: rgba(74, 14, 14, 0.4);
      border-color: #4a0e0e;
      transform: translateY(-3px);
    }

    /* Миниатюра в карточке */
    .char-thumbnail {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      border: 1px solid #4a0e0e;
      flex-shrink: 0;
      background: #1a0a1a;
    }

    .char-info-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      flex: 1;
    }
    
    .char-name {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 18px;
      color: #ffffff;
      letter-spacing: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .char-class-race {
      font-size: 12px;
      color: #ffd700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .char-squad {
      font-size: 11px;
      color: #51cf66;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* ===== МОДАЛЬНЫЕ ОКНА ===== */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1a0a1a;
      border: 1px solid #4a0e0e;
      border-radius: 12px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      color: #ffffff;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    
    /* Увеличиваем окно просмотра */
    #view-modal .modal-content {
      max-width: 900px;
    }
    #view-modal .modal-content img {
      max-height: 500px;
      object-fit: contain;
    }

    .modal-close {
      position: absolute;
      top: 15px; right: 15px;
      cursor: pointer;
      font-size: 24px;
      color: #ff6b6b;
    }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid #4a0e0e;
      border-radius: 6px;
      color: #ffffff;
      font-family: 'Philosopher', sans-serif;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group select option { background: #1a0a1a; }
    
    .btn-submit {
      width: 100%; padding: 12px;
      background: #4a0e0e; color: #ffd700;
      border: none; border-radius: 6px;
      cursor: pointer; font-family: 'Philosopher', sans-serif;
      font-weight: bold; font-size: 16px;
    }
    .btn-submit:hover { background: #6a1a1a; }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: rgba(255,255,255,0.3);
      font-size: 18px;
    }
  </style>
</head>
<body>

  <!-- БАННЕР -->
  <div class="top-banner">
    <div class="banner-left">
      <img src="/CHERTOGI_MAP/images/flamechertogi.png" alt="Огненные чертоги">
      <span class="title">Огненные чертоги</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Карта</a>
      <a href="znaki.html">В путь</a>
      <a href="bestiary.html">Бестиарий</a>
      <a href="tree.html">Древо смерти</a>
    </div>
  </div>

  <!-- ФОНОВЫЕ ГЕКСЫ -->
  <img src="/CHERTOGI_MAP/images/gex3.png" alt="" class="bg-image bg-image-left">
  <img src="/CHERTOGI_MAP/images/gex3.png" alt="" class="bg-image bg-image-right">

  <div class="container">
    <!-- МЕСТО ДЛЯ КАРТИНКИ -->
    <div class="map-container">
      <img id="ovul-map-image" src="/CHERTOGI_MAP/images/mapOvul.png" alt="Карта Овуля" onerror="this.style.display='none'; this.parentElement.innerHTML='<span style=\'color:rgba(255,255,255,0.3)\'>Карта Овуля</span>';">
    </div>

    <h1 class="page-title">Овуль</h1>
    <div class="page-subtitle">Архив искателей</div>

    <!-- КНОПКА ДОБАВЛЕНИЯ -->
    <div id="auth-section" style="text-align: right; margin-bottom: 20px;">
      <button id="login-btn" class="btn-submit" style="width: auto; padding: 10px 20px;">Добавить вашего искателя</button>
      <button id="add-char-btn" class="btn-submit" style="width: auto; padding: 10px 20px; display: none;">+ Добавить персонажа</button>
    </div>

    <!-- ФИЛЬТРЫ -->
    <div class="filters-panel">
      <input type="text" id="search-input" placeholder="Поиск по имени...">
      <select id="filter-class">
        <option value="">Все классы</option>
        <option value="Варвар">Варвар</option>
        <option value="Бард">Бард</option>
        <option value="Жрец">Жрец</option>
        <option value="Друид">Друид</option>
        <option value="Воин">Воин</option>
        <option value="Монах">Монах</option>
        <option value="Паладин">Паладин</option>
        <option value="Следопыт">Следопыт</option>
        <option value="Плут">Плут</option>
        <option value="Чародей">Чародей</option>
        <option value="Колдун">Колдун</option>
        <option value="Волшебник">Волшебник</option>
        <option value="Шаман">Шаман</option>
        <option value="Дрифтер">Дрифтер</option>
        <option value="Изобретатель">Изобретатель</option>
      </select>
      <select id="filter-race">
        <option value="">Все расы</option>
        <option value="Браллец">Браллец</option>
        <option value="Дангунец">Дангунец</option>
        <option value="Хешег">Хешег</option>
        <option value="Адаад">Адаад</option>
        <option value="Ойрдуг">Ойрдуг</option>
        <option value="Сар-худдулин">Сар-худдулин</option>
        <option value="Омор-худдулин">Омор-худдулин</option>
        <option value="Эрх-худдулин">Эрх-худдулин</option>
        <option value="Самагхи">Самагхи</option>
        <option value="Эрил-удриш">Эрил-удриш</option>
        <option value="Урма-удриш">Урма-удриш</option>
        <option value="Пьюр-пьюр-удриш">Пьюр-пьюр-удриш</option>
        <option value="Янтарный маракиец">Янтарный маракиец</option>
        <option value="Пепельный маракиец">Пепельный маракиец</option>
        <option value="Драгмирец">Драгмирец</option>
        <option value="Вирморожденный">Вирморожденный</option>
        <option value="Борос">Борос</option>
        <option value="Аджаид">Аджаид</option>
        <option value="Элорец">Элорец</option>
        <option value="Джабари">Джабари</option>
        <option value="Джахази">Джахази</option>
        <option value="Кобольд">Кобольд</option>
      </select>
      <select id="filter-squad">
        <option value="">Все отряды</option>
        <option value="Без отряда">Без отряда</option>
      </select>
    </div>

    <!-- СЕТКА ПЕРСОНАЖЕЙ -->
    <div id="characters-grid" class="characters-grid">
      <div class="empty-state">Загрузка персонажей...</div>
    </div>
  </div>

  <!-- МОДАЛКА: ПРОСМОТР ПЕРСОНАЖА -->
  <div id="view-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="document.getElementById('view-modal').style.display='none'">&times;</span>
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 200px;">
          <img id="view-image" src="" alt="" style="width: 100%; border-radius: 8px; border: 1px solid #4a0e0e; display: none;">
        </div>
        <div style="flex: 2;">
          <h2 id="view-name" style="font-family: 'Calypso', serif; color: #ffd700; font-size: 28px; margin-bottom: 5px;"></h2>
          <div id="view-class-race" style="color: #aaa; font-size: 16px; margin-bottom: 10px;"></div>
          <div id="view-squad" style="color: #51cf66; font-size: 14px; margin-bottom: 15px;"></div>
          <div id="view-desc" style="font-size: 15px; line-height: 1.6; margin-bottom: 15px;"></div>
          <div id="view-traits" style="font-size: 14px; color: #ffd700; background: rgba(255,215,0,0.1); padding: 10px; border-radius: 6px;"></div>
          <button id="edit-char-btn" style="margin-top: 20px; padding: 8px 16px; background: #4a0e0e; color: #ffd700; border: none; border-radius: 6px; cursor: pointer; display: none;">✏️ Редактировать</button>
        </div>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА: ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ПЕРСОНАЖА -->
  <div id="edit-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" onclick="document.getElementById('edit-modal').style.display='none'">&times;</span>
      <h3 style="font-family: 'Calypso', serif; color: #ffd700; margin-bottom: 20px; text-align: center;">Новый персонаж</h3>
      
      <form id="character-form">
        <input type="hidden" id="char-id">
        
        <div class="form-group">
          <label>Имя персонажа</label>
          <input type="text" id="char-name-input" required>
        </div>
        
        <div class="form-group">
          <label>Класс</label>
          <select id="char-class-input" required onchange="toggleMulticlass()">
            <option value="">— Выберите класс —</option>
            <option value="Варвар">Варвар</option>
            <option value="Бард">Бард</option>
            <option value="Жрец">Жрец</option>
            <option value="Друид">Друид</option>
            <option value="Воин">Воин</option>
            <option value="Монах">Монах</option>
            <option value="Паладин">Паладин</option>
            <option value="Следопыт">Следопыт</option>
            <option value="Плут">Плут</option>
            <option value="Чародей">Чародей</option>
            <option value="Колдун">Колдун</option>
            <option value="Волшебник">Волшебник</option>
            <option value="Шаман">Шаман</option>
            <option value="Дрифтер">Дрифтер</option>
            <option value="Изобретатель">Изобретатель</option>
            <option value="Мультикласс">Мультикласс</option>
          </select>
          
          <!-- Блок для мультикласса -->
          <div id="multiclass-fields" style="display: none; gap: 10px; margin-top: 10px; flex-wrap: wrap;">
            <select id="char-class-multi-1" style="flex: 1; min-width: 120px;">
              <option value="">— Первый класс —</option>
              <option value="Варвар">Варвар</option>
              <option value="Бард">Бард</option>
              <option value="Жрец">Жрец</option>
              <option value="Друид">Друид</option>
              <option value="Воин">Воин</option>
              <option value="Монах">Монах</option>
              <option value="Паладин">Паладин</option>
              <option value="Следопыт">Следопыт</option>
              <option value="Плут">Плут</option>
              <option value="Чародей">Чародей</option>
              <option value="Колдун">Колдун</option>
              <option value="Волшебник">Волшебник</option>
              <option value="Шаман">Шаман</option>
              <option value="Дрифтер">Дрифтер</option>
              <option value="Изобретатель">Изобретатель</option>
            </select>
            <select id="char-class-multi-2" style="flex: 1; min-width: 120px;">
              <option value="">— Второй класс —</option>
              <option value="Варвар">Варвар</option>
              <option value="Бард">Бард</option>
              <option value="Жрец">Жрец</option>
              <option value="Друид">Друид</option>
              <option value="Воин">Воин</option>
              <option value="Монах">Монах</option>
              <option value="Паладин">Паладин</option>
              <option value="Следопыт">Следопыт</option>
              <option value="Плут">Плут</option>
              <option value="Чародей">Чародей</option>
              <option value="Колдун">Колдун</option>
              <option value="Волшебник">Волшебник</option>
              <option value="Шаман">Шаман</option>
              <option value="Дрифтер">Дрифтер</option>
              <option value="Изобретатель">Изобретатель</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Раса</label>
          <select id="char-race-input" required>
            <option value="">— Выберите расу —</option>
            <option value="Браллец">Браллец</option>
            <option value="Дангунец">Дангунец</option>
            <option value="Хешег">Хешег</option>
            <option value="Адаад">Адаад</option>
            <option value="Ойрдуг">Ойрдуг</option>
            <option value="Сар-худдулин">Сар-худдулин</option>
            <option value="Омор-худдулин">Омор-худдулин</option>
            <option value="Эрх-худдулин">Эрх-худдулин</option>
            <option value="Самагхи">Самагхи</option>
            <option value="Эрил-удриш">Эрил-удриш</option>
            <option value="Урма-удриш">Урма-удриш</option>
            <option value="Пьюр-пьюр-удриш">Пьюр-пьюр-удриш</option>
            <option value="Янтарный маракиец">Янтарный маракиец</option>
            <option value="Пепельный маракиец">Пепельный маракиец</option>
            <option value="Драгмирец">Драгмирец</option>
            <option value="Вирморожденный">Вирморожденный</option>
            <option value="Борос">Борос</option>
            <option value="Аджаид">Аджаид</option>
            <option value="Элорец">Элорец</option>
            <option value="Джабари">Джабари</option>
            <option value="Джахази">Джахази</option>
            <option value="Кобольд">Кобольд</option>
          </select>
        </div>

        <div class="form-group">
          <label>Отряд (если есть)</label>
          <input type="text" id="char-squad-input" placeholder="Название отряда">
        </div>

        <div class="form-group">
          <label>Мини-черты (достижения)</label>
          <input type="text" id="char-traits-input" placeholder="Например: Бегущий по нефриту">
        </div>

        <div class="form-group">
          <label>Описание</label>
          <textarea id="char-desc-input" required></textarea>
        </div>

        <div class="form-group">
          <label>Картинка (макс. 1 МБ)</label>
          <input type="file" id="char-image-input" accept="image/*">
          <div id="image-preview" style="margin-top: 10px;"></div>
        </div>

        <button type="submit" class="btn-submit">Сохранить</button>
      </form>
    </div>
  </div>

  <!-- МОДАЛКА: ВВОД ПАРОЛЯ -->
  <div id="auth-modal" class="modal">
    <div class="modal-content" style="max-width: 400px;">
      <span class="modal-close" onclick="document.getElementById('auth-modal').style.display='none'">&times;</span>
      <h3 style="font-family: 'Calypso', serif; color: #ffd700; margin-bottom: 20px; text-align: center;">Введите пароль</h3>
      <div class="form-group">
        <input type="password" id="auth-password" placeholder="Пароль...">
      </div>
      <button id="auth-submit" class="btn-submit">Войти</button>
      <div id="auth-error" style="color: #ff6b6b; text-align: center; margin-top: 10px; display: none;">Неверный пароль</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ovul.js"></script>
</body>
</html>
