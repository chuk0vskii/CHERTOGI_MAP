<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Бестиарий</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(180deg, #0a0a0a 0%, #1a1010 40%, #0f0a0a 70%, #050505 100%);
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== ФОНОВОЕ КОЛЕСО (вращается) ===== */
    .bg-wheel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.2;
      animation: spinWheel 120s linear infinite;
    }
    .bg-wheel img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @keyframes spinWheel {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ===== ДЕКОРАТИВНЫЕ ГЕКСЫ ПО БОКАМ ===== */
    .bg-image {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 1;
      pointer-events: none;
      opacity: 0.2;
      width: 700px;
      height: 700px;
      object-fit: contain;
      filter: brightness(1.3) contrast(1.1);
    }
    .bg-image-left {
      left: -350px;
      animation: rotateLeft 60s linear infinite;
    }
    .bg-image-right {
      right: -350px;
      animation: rotateRight 60s linear infinite;
    }

    @keyframes rotateLeft {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(360deg); }
    }
    @keyframes rotateRight {
      0% { transform: translateY(-50%) rotate(0deg); }
      100% { transform: translateY(-50%) rotate(-360deg); }
    }

    /* ===== ОСНОВНАЯ ЛИНИЯ (отступ 150px от левого края) ===== */
    .main-line-container {
      position: absolute;
      left: 150px;
      top: 120px;
      bottom: 20px;
      width: 2px;
      z-index: 3;
      pointer-events: none;
    }
    .main-line-container .main-line {
      position: absolute;
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      background: #b5001b;
      transform: translateX(-50%);
      opacity: 0.5;
    }

    /* ===== УЗЕЛ (ГЛАВНАЯ ИКОНКА СВЕРХУ) ===== */
    .main-line-container .main-node {
      position: absolute;
      left: 50%;
      top: -30px;
      transform: translateX(-50%);
      width: 42px;
      height: 42px;
      z-index: 4;
      pointer-events: none;
    }
    .main-line-container .main-node img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(181, 0, 27, 0.4));
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 40px;
      position: relative;
      z-index: 2;
      padding-left: 120px;
    }

    .page-title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 42px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 4px;
      font-weight: normal;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .page-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    /* ===== КАЖДЫЙ РАЗДЕЛ ===== */
    .section {
      margin-bottom: 40px;
      position: relative;
      z-index: 2;
    }

    /* ===== ГОРИЗОНТАЛЬНАЯ ЛИНИЯ ОТ ОСНОВНОЙ К РАЗДЕЛУ ===== */
    .section .horizontal-line {
      position: absolute;
      top: 50%;
      height: 2px;
      background: #b5001b;
      transform: translateY(-50%);
      opacity: 0.3;
      z-index: 3;
      pointer-events: none;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 16px 24px;
      background: rgba(74, 14, 14, 0.4);
      border: 1px solid rgba(74, 14, 14, 0.3);
      border-radius: 12px;
      transition: all 0.3s ease;
      user-select: none;
      position: sticky;
      top: 70px;
      z-index: 50;
      backdrop-filter: blur(8px);
    }
    .section-header:hover {
      background: rgba(74, 14, 14, 0.6);
      border-color: #4a0e0e;
    }
    .section-header .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 24px;
      color: #ffffff;
      letter-spacing: 2px;
      font-weight: normal;
    }
    .section-header .count {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.3);
    }
    .section-header .arrow {
      font-size: 18px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }
    .section-header .arrow.open {
      transform: rotate(180deg);
    }
    .section-header .collapse-btn {
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.2);
      color: #ffd700;
      padding: 4px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Philosopher', sans-serif;
      font-size: 12px;
      transition: all 0.3s ease;
      display: none;
      margin-left: 12px;
    }
    .section-header .collapse-btn:hover {
      background: rgba(255, 215, 0, 0.2);
    }
    .section-header .collapse-btn.visible {
      display: inline-block;
    }

    .section-content {
      display: none;
      padding: 20px 0;
      gap: 20px;
      flex-direction: row;
      flex-wrap: wrap;
    }
    .section-content.open {
      display: flex;
    }

    .creature-card {
      background: rgba(74, 14, 14, 0.2);
      border: 1px solid rgba(74, 14, 14, 0.2);
      border-radius: 12px;
      padding: 20px 22px;
      transition: all 0.3s ease;
      flex: 0 0 calc(50% - 10px);
      max-width: calc(50% - 10px);
      box-sizing: border-box;
    }
    .creature-card:hover {
      background: rgba(74, 14, 14, 0.35);
      border-color: rgba(74, 14, 14, 0.5);
    }
    .creature-card .creature-name {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 20px;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: normal;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .creature-card .creature-name .expand-icon {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease;
    }
    .creature-card .creature-name .expand-icon.open {
      transform: rotate(180deg);
    }
    .creature-card .creature-meta {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }
    .creature-card .creature-meta span {
      margin-right: 14px;
    }

    .creature-card .creature-body {
      display: none;
    }
    .creature-card .creature-body.open {
      display: block;
    }

    .creature-card .creature-description {
      font-size: 14px;
      line-height: 1.7;
      color: #ccc;
      margin-bottom: 10px;
      white-space: pre-line;
      word-wrap: break-word;
    }

    .creature-card .creature-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 6px;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }
    .creature-card .creature-stats .stat {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }
    .creature-card .creature-stats .stat strong {
      color: #ffffff;
    }

    .creature-card .stats-full {
      display: none;
      margin-top: 10px;
      padding: 12px 16px;
      background: rgba(74, 14, 14, 0.2);
      border-radius: 8px;
      border-left: 2px solid rgba(74, 14, 14, 0.5);
    }
    .creature-card .stats-full.open {
      display: block;
    }
    .creature-card .stats-full .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      padding: 3px 0;
      line-height: 1.5;
    }
    .creature-card .stats-full .stat-row .label {
      color: rgba(255, 255, 255, 0.4);
      min-width: 100px;
    }
    .creature-card .stats-full .stat-row .value {
      color: #e0d5c0;
      white-space: pre-line;
      word-wrap: break-word;
      max-width: 100%;
      flex: 1;
    }

    .creature-card .abilities-block {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 50, 50, 0.3);
      border-radius: 8px;
      background: transparent;
    }
    .creature-card .abilities-block.open {
      display: block;
    }
    .creature-card .abilities-block .abilities-label {
      color: rgba(255, 100, 100, 0.7);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 3px;
      font-family: 'Philosopher', sans-serif;
      text-transform: uppercase;
    }
    .creature-card .abilities-block .abilities-content {
      color: #e0d5c0;
      font-size: 13px;
      white-space: pre-line;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .creature-card .actions-block {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 50, 50, 0.3);
      border-radius: 8px;
      background: transparent;
    }
    .creature-card .actions-block.open {
      display: block;
    }
    .creature-card .actions-block .actions-label {
      color: rgba(255, 100, 100, 0.7);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 3px;
      font-family: 'Philosopher', sans-serif;
      text-transform: uppercase;
    }
    .creature-card .actions-block .actions-content {
      color: #e0d5c0;
      font-size: 13px;
      white-space: pre-line;
      word-wrap: break-word;
      line-height: 1.5;
    }

    .creature-card .resource-block {
      display: none;
      margin-top: 10px;
      padding: 10px 14px;
      background: rgba(255, 215, 0, 0.08);
      border: 1px solid rgba(255, 215, 0, 0.2);
      border-radius: 8px;
      border-left: 3px solid #ffd700;
    }
    .creature-card .resource-block.open {
      display: block;
    }
    .creature-card .resource-block .resource-label {
      color: #ffd700;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 3px;
      font-family: 'Philosopher', sans-serif;
    }
    .creature-card .resource-block .resource-content {
      color: #e0d5c0;
      font-size: 13px;
      white-space: pre-line;
      word-wrap: break-word;
      line-height: 1.4;
    }
    .creature-card .resource-block .resource-content .resource-item {
      display: block;
      padding: 1px 0;
    }

    .creature-card .btn-toggle-stats {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.4);
      padding: 4px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Philosopher', sans-serif;
      font-size: 12px;
      transition: all 0.3s ease;
      margin-top: 8px;
    }
    .creature-card .btn-toggle-stats:hover {
      background: rgba(74, 14, 14, 0.3);
      color: #ffffff;
      border-color: rgba(74, 14, 14, 0.5);
    }

    .creature-card .creature-image-container {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .creature-card .creature-image-container.open {
      display: block;
    }
    .creature-card .creature-image-container img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .creature-card .creature-image-container .image-placeholder {
      text-align: center;
      padding: 30px 20px;
      color: rgba(255, 255, 255, 0.15);
      font-size: 13px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .loading {
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      padding: 20px 0;
      position: relative;
      z-index: 2;
    }
    .no-data {
      color: rgba(255, 255, 255, 0.15);
      text-align: center;
      padding: 20px 0;
      font-size: 16px;
      width: 100%;
    }

    .scroll-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(74, 14, 14, 0.8);
      border: 1px solid rgba(255, 215, 0, 0.3);
      color: #ffd700;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
      z-index: 100;
      opacity: 0;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      display: none;
    }
    .scroll-top.visible {
      opacity: 1;
      display: block;
    }
    .scroll-top:hover {
      background: rgba(74, 14, 14, 1);
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .container { padding: 80px 16px 30px; padding-left: 80px; }
      .main-line-container { left: 80px; }
      .section .horizontal-line { width: 40px; }
      .main-line-container .main-node { width: 32px; height: 32px; top: -25px; }
      .bg-wheel { width: 150px; height: 150px; }
      .page-title { font-size: 30px; }
      .section-header .title { font-size: 20px; }
      .creature-card { flex: 0 0 100%; max-width: 100%; }
      .creature-card { padding: 16px 18px; }
      .creature-card .creature-stats { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
      .creature-card .stats-full .stat-row { flex-direction: column; gap: 2px; }
      .creature-card .creature-image-container img { max-height: 250px; }
      .creature-card .resource-block { padding: 8px 12px; }
      .creature-card .abilities-block { padding: 8px 12px; }
      .creature-card .actions-block { padding: 8px 12px; }
      .bg-image { width: 350px; height: 350px; opacity: 0.15; }
      .bg-image-left { left: -175px; }
      .bg-image-right { right: -175px; }
    }
    @media (max-width: 480px) {
      .container { padding: 70px 12px 20px; padding-left: 60px; }
      .main-line-container { left: 50px; }
      .section .horizontal-line { width: 30px; }
      .main-line-container .main-node { width: 28px; height: 28px; top: -20px; }
      .bg-wheel { width: 120px; height: 120px; opacity: 0.25; }
      .page-title { font-size: 24px; }
      .section-header .title { font-size: 17px; }
      .section-header { padding: 12px 14px; }
      .creature-card { padding: 12px 14px; }
      .creature-card .creature-stats { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); }
      .creature-card .creature-image-container img { max-height: 180px; }
      .creature-card .creature-name { font-size: 17px; }
      .bg-image { width: 200px; height: 200px; opacity: 0.1; }
      .bg-image-left { left: -100px; }
      .bg-image-right { right: -100px; }
    }
  </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
  var SUPABASE_URL = 'https://djieimjwhgjgsjcysceh.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_R2gXWQPVT5trC7cL2BDIpw_Av1QHxDi';

  var supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var _supabase = supabaseClient;

  console.log('Supabase подключён');

  var SECTIONS = [
    { id: 'beasts', title: 'Звери', table: 'beasts' },
    { id: 'great_beasts', title: 'Великие странствующие звери', table: 'great_beasts' },
    { id: 'monsters', title: 'Монстры', table: 'monsters' },
    { id: 'humanoids', title: 'Гуманоиды', table: 'humanoids' },
    { id: 'insectoids', title: 'Инсектоиды Чертогов', table: 'insectoids' },
    { id: 'veil_aberrations', title: 'Аберрации Вуали', table: 'veil_aberrations' },
    { id: 'parasitic_creatures', title: 'Паразиты Чертогов', table: 'parasitic_creatures' },
    { id: 'dangerous_desert', title: 'Опасные существа пустыни и пустошей', table: 'opasnost_pustini' },
    { id: 'dangerous_steppes', title: 'Опасные существа степей и холмов', table: 'opasnost_stepi' },
    { id: 'dangerous_mountains', title: 'Опасные существа гор и скал', table: 'opasnost_gor' },
    { id: 'dangerous_swamps', title: 'Опасные существа топей, рек и джунглей', table: 'opasnost_jungle' }
  ];

  function getCreatureImagePath(name) {
    var fileName = name.trim().toLowerCase().replace(/\s+/g, '_');
    return '/CHERTOGI_MAP/images/bestiarii/' + fileName;
  }

  async function loadSection(section) {
    try {
      console.log('Загрузка ' + section.table + '...');
      
      var result = await _supabase
        .from(section.table)
        .select('*')
        .order('name');

      if (result.error) {
        console.error('Ошибка загрузки ' + section.table + ':', result.error);
        return [];
      }

      console.log('Загружено ' + (result.data ? result.data.length : 0) + ' записей из ' + section.table);
      return result.data || [];
    } catch (err) {
      console.error('Критическая ошибка ' + section.table + ':', err);
      return [];
    }
  }

  function getFieldLabel(field) {
    var labels = {
      'name': 'Название',
      'size': 'Размер',
      'type': 'Тип существа',
      'armor_class': 'КД',
      'hit_points': 'Хиты',
      'speed': 'Скорость',
      'strength': 'Сил',
      'dexterity': 'Лов',
      'constitution': 'Тел',
      'intelligence': 'Инт',
      'wisdom': 'Мдр',
      'charisma': 'Хур',
      'saving_throws': 'Спасброски',
      'skills': 'Навыки',
      'senses': 'Чувства',
      'proficiency_bonus': 'Бонус мастерства',
      'damage_resistances': 'Сопротивление к урону',
      'damage_vulnerabilities': 'Уязвимость к урону',
      'condition_immunities': 'Иммунитет к состоянию',
      'treasure': 'Сокровище'
    };
    return labels[field] || field;
  }

  function formatText(text) {
    if (!text) return '—';
    return String(text).replace(/\n/g, '<br>');
  }

  function formatResource(text) {
    if (!text) return null;
    var lines = String(text).split('\n').filter(function(line) {
      return line.trim() !== '';
    });
    return lines.join('<br>');
  }

  function renderCreatureCard(creature) {
    var description = creature.description || '';

    var statsFields = ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'];
    var extraFields = ['saving_throws', 'skills', 'senses', 'proficiency_bonus', 
                       'damage_resistances', 'damage_vulnerabilities', 'condition_immunities', 
                       'treasure'];

    var statsHTML = '';
    for (var i = 0; i < statsFields.length; i++) {
      var f = statsFields[i];
      if (creature[f] !== undefined && creature[f] !== null) {
        statsHTML += '<div class="stat"><strong>' + getFieldLabel(f) + '</strong> ' + creature[f] + '</div>';
      }
    }

    var extraRows = '';
    for (var j = 0; j < extraFields.length; j++) {
      var f = extraFields[j];
      if (creature[f] !== undefined && creature[f] !== null && creature[f] !== '') {
        var label = getFieldLabel(f);
        var value = formatText(creature[f]);
        extraRows += '<div class="stat-row"><span class="label">' + label + ':</span> <span class="value">' + value + '</span></div>';
      }
    }

    var abilitiesHTML = '';
    var abilitiesData = creature.abilities;
    if (abilitiesData && abilitiesData !== '') {
      abilitiesHTML = `
        <div class="abilities-block" id="abilities-${creature.id || 'unknown'}">
          <div class="abilities-label">⚔ Умения</div>
          <div class="abilities-content">${formatText(abilitiesData)}</div>
        </div>
      `;
    }

    var actionsHTML = '';
    var actionsData = creature.actions;
    if (actionsData && actionsData !== '') {
      actionsHTML = `
        <div class="actions-block" id="actions-${creature.id || 'unknown'}">
          <div class="actions-label">⚔ Действия</div>
          <div class="actions-content">${formatText(actionsData)}</div>
        </div>
      `;
    }

    var resourceHTML = '';
    var resourceData = creature.resource;
    if (resourceData && resourceData !== '') {
      var formattedResource = formatResource(resourceData);
      if (formattedResource) {
        var resourceItems = formattedResource.split('<br>').map(function(item) {
          return '<span class="resource-item">' + item + '</span>';
        }).join('');
        
        resourceHTML = `
          <div class="resource-block" id="resource-${creature.id || 'unknown'}">
            <div class="resource-label">✦ Ресурсы</div>
            <div class="resource-content">${resourceItems}</div>
          </div>
        `;
      }
    }

    var extraHTML = extraRows ? '<button class="btn-toggle-stats" onclick="toggleStats(this)">Показать характеристики</button><div class="stats-full">' + extraRows + '</div>' : '';

    var metaHTML = '';
    if (creature.size) metaHTML += '<span>' + creature.size + '</span>';
    if (creature.type) metaHTML += '<span>' + creature.type + '</span>';
    if (creature.armor_class) metaHTML += '<span>КД ' + creature.armor_class + '</span>';
    if (creature.hit_points) metaHTML += '<span>Хиты ' + creature.hit_points + '</span>';
    if (creature.speed) metaHTML += '<span>Скорость ' + creature.speed + '</span>';

    var descHTML = description ? '<div class="creature-description">' + formatText(description) + '</div>' : '';
    var statsContainerHTML = statsHTML ? '<div class="creature-stats">' + statsHTML + '</div>' : '';

    var creatureName = creature.name || 'Без имени';
    var imagePath = getCreatureImagePath(creatureName);
    var imageExtensions = ['.png', '.jpg', '.jpeg', '.webp'];
    
    var imageHTML = '';
    for (var k = 0; k < imageExtensions.length; k++) {
      var ext = imageExtensions[k];
      imageHTML += `
        <img src="${imagePath}${ext}" 
             onerror="this.style.display='none'" 
             style="display:none;"
             data-ext="${ext}"
             alt="${creatureName}">
      `;
    }
    imageHTML += `
      <div class="image-placeholder" id="placeholder-${creature.id || 'unknown'}">
        Нет изображения для "${creatureName}"
      </div>
    `;

    var creatureId = creature.id || 'unknown';
    
    return '<div class="creature-card" data-id="' + creatureId + '" data-name="' + encodeURIComponent(creatureName) + '">' +
      '<div class="creature-name" onclick="toggleCreature(this)">' + 
        creatureName + 
        '<span class="expand-icon">▼</span>' +
      '</div>' +
      (metaHTML ? '<div class="creature-meta">' + metaHTML + '</div>' : '') +
      '<div class="creature-body">' +
        descHTML +
        statsContainerHTML +
        extraHTML +
        abilitiesHTML +
        actionsHTML +
        resourceHTML +
        '<div class="creature-image-container" id="image-container-' + creatureId + '">' +
          imageHTML +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function toggleCreature(nameEl) {
    var card = nameEl.closest('.creature-card');
    var body = card.querySelector('.creature-body');
    var icon = nameEl.querySelector('.expand-icon');
    
    if (body) {
      body.classList.toggle('open');
      if (icon) icon.classList.toggle('open');
    }
  }

  function toggleStats(btn) {
    var card = btn.closest('.creature-card');
    var statsFull = btn.nextElementSibling;
    
    if (statsFull && statsFull.classList.contains('stats-full')) {
      var isOpening = !statsFull.classList.contains('open');
      
      statsFull.classList.toggle('open');
      btn.textContent = statsFull.classList.contains('open') ? 'Скрыть характеристики' : 'Показать характеристики';
      
      var abilitiesBlock = card.querySelector('.abilities-block');
      if (abilitiesBlock) {
        abilitiesBlock.classList.toggle('open', isOpening);
      }
      
      var actionsBlock = card.querySelector('.actions-block');
      if (actionsBlock) {
        actionsBlock.classList.toggle('open', isOpening);
      }
      
      var resourceBlock = card.querySelector('.resource-block');
      if (resourceBlock) {
        resourceBlock.classList.toggle('open', isOpening);
      }
      
      var imageContainer = card.querySelector('.creature-image-container');
      if (imageContainer) {
        imageContainer.classList.toggle('open', isOpening);
        
        if (isOpening) {
          var images = imageContainer.querySelectorAll('img');
          var placeholder = imageContainer.querySelector('.image-placeholder');
          var found = false;
          
          for (var i = 0; i < images.length; i++) {
            var img = images[i];
            if (img.complete && img.naturalWidth > 0) {
              img.style.display = 'block';
              if (placeholder) placeholder.style.display = 'none';
              found = true;
              break;
            }
          }
          
          if (!found && placeholder) {
            placeholder.style.display = 'block';
          }
        }
      }
    }
  }

  function renderSection(section, creatures, index) {
    var sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';
    sectionDiv.id = 'section-' + section.id;

    var contentHTML = '';
    if (creatures.length === 0) {
      contentHTML = '<div class="no-data">Нет существ в этом разделе</div>';
    } else {
      for (var i = 0; i < creatures.length; i++) {
        contentHTML += renderCreatureCard(creatures[i]);
      }
    }

    var collapseBtn = '<button class="collapse-btn" onclick="collapseSection(\'' + section.id + '\')">✕ Свернуть</button>';

    var horizontalLine = '<div class="horizontal-line" id="hline-' + section.id + '"></div>';

    sectionDiv.innerHTML = 
      horizontalLine +
      '<div class="section-header" onclick="toggleSection(\'' + section.id + '\')">' +
        '<span class="title">' + section.title + '</span>' +
        '<span style="display:flex; align-items:center; gap:12px;">' +
          '<span class="count">' + creatures.length + ' существ</span>' +
          '<span class="arrow" id="arrow-' + section.id + '">▼</span>' +
          collapseBtn +
        '</span>' +
      '</div>' +
      '<div class="section-content" id="content-' + section.id + '">' +
        contentHTML +
      '</div>';

    return sectionDiv;
  }

  function toggleSection(sectionId) {
    var content = document.getElementById('content-' + sectionId);
    var arrow = document.getElementById('arrow-' + sectionId);
    var collapseBtn = document.querySelector('#section-' + sectionId + ' .collapse-btn');
    
    if (content) {
      var isOpening = !content.classList.contains('open');
      content.classList.toggle('open');
      if (arrow) arrow.classList.toggle('open');
      
      if (collapseBtn) {
        if (isOpening) {
          collapseBtn.classList.add('visible');
        } else {
          collapseBtn.classList.remove('visible');
        }
      }
    }
  }

  function collapseSection(sectionId) {
    var content = document.getElementById('content-' + sectionId);
    var arrow = document.getElementById('arrow-' + sectionId);
    var collapseBtn = document.querySelector('#section-' + sectionId + ' .collapse-btn');
    
    if (content) {
      content.classList.remove('open');
      if (arrow) arrow.classList.remove('open');
      if (collapseBtn) collapseBtn.classList.remove('visible');
    }
  }

  // ============================================================
  // ПОЗИЦИОНИРОВАНИЕ ЛИНИЙ
  // ============================================================

  function positionLines() {
    var container = document.querySelector('.container');
    var mainLine = document.getElementById('mainLineContainer');
    var sections = document.querySelectorAll('.section');
    
    if (!container || !mainLine || sections.length === 0) return;
    
    var containerRect = container.getBoundingClientRect();
    var containerLeft = containerRect.left;
    
    // Получаем позицию основной линии (из CSS)
    var mainLineStyle = getComputedStyle(mainLine);
    var mainLineLeft = parseFloat(mainLineStyle.left) || 150;
    
    // Для каждой секции устанавливаем горизонтальную линию
    sections.forEach(function(section) {
      var hline = section.querySelector('.horizontal-line');
      if (!hline) return;
      
      var sectionRect = section.getBoundingClientRect();
      var sectionLeft = sectionRect.left - containerLeft;
      
      // Горизонтальная линия от основной линии до раздела
      var startX = mainLineLeft;
      var endX = sectionLeft;
      var width = endX - startX;
      
      if (width > 0) {
        hline.style.left = startX + 'px';
        hline.style.width = width + 'px';
        hline.style.opacity = '0.3';
      }
    });
  }

  // ============================================================
  // КНОПКА "НАВЕРХ"
  // ============================================================

  function initScrollTop() {
    var btn = document.getElementById('scrollTopBtn');
    
    window.addEventListener('scroll', function() {
      if (window.scrollY > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    });
    
    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  // ============================================================
  // ОБРАБОТКА ПАРАМЕТРОВ URL
  // ============================================================

  function getUrlParams() {
    var params = {};
    var query = window.location.search.substring(1);
    if (query) {
      var pairs = query.split('&');
      for (var i = 0; i < pairs.length; i++) {
        var pair = pairs[i].split('=');
        params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
      }
    }
    return params;
  }

  function openBeastFromUrl() {
    var params = getUrlParams();
    
    console.log('🔍 Параметры URL:', params);
    
    if (!params.section && !params.beast) {
      console.log('Нет параметров для открытия существа');
      return;
    }
    
    var sectionId = params.section || 'dangerous_creatures';
    var beastName = params.beast || '';
    
    console.log('🔍 Открытие существа:', { sectionId, beastName });
    
    if (!beastName) {
      return;
    }
    
    var sectionContent = document.getElementById('content-' + sectionId);
    var sectionHeader = document.querySelector('#section-' + sectionId + ' .section-header');
    var collapseBtn = document.querySelector('#section-' + sectionId + ' .collapse-btn');
    
    if (!sectionContent || !sectionHeader) {
      console.warn('⚠️ Раздел не найден:', sectionId);
      return;
    }
    
    sectionContent.classList.add('open');
    var arrow = document.getElementById('arrow-' + sectionId);
    if (arrow) arrow.classList.add('open');
    if (collapseBtn) collapseBtn.classList.add('visible');
    
    var cards = sectionContent.querySelectorAll('.creature-card');
    var targetCard = null;
    var decodedName = decodeURIComponent(beastName);
    
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var nameEl = card.querySelector('.creature-name');
      var cardName = nameEl ? nameEl.textContent.trim() : '';
      if (cardName === decodedName) {
        targetCard = card;
        break;
      }
    }
    
    if (targetCard) {
      setTimeout(function() {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        targetCard.style.transition = 'background 0.5s ease, border-color 0.5s ease';
        targetCard.style.background = 'rgba(255, 215, 0, 0.15)';
        targetCard.style.borderColor = '#ffd700';
        
        var body = targetCard.querySelector('.creature-body');
        var icon = targetCard.querySelector('.expand-icon');
        if (body) {
          body.classList.add('open');
          if (icon) icon.classList.add('open');
        }
        
        var toggleBtn = targetCard.querySelector('.btn-toggle-stats');
        if (toggleBtn) {
          setTimeout(function() {
            toggleBtn.click();
          }, 500);
        }
        
        setTimeout(function() {
          targetCard.style.background = '';
          targetCard.style.borderColor = '';
        }, 5000);
      }, 300);
    }
  }

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================

  async function init() {
    console.log('Загрузка бестиария...');

    var container = document.getElementById('sections-container');
    container.innerHTML = '<div class="loading">Загрузка бестиария...</div>';

    var totalCreatures = 0;
    var fragment = document.createDocumentFragment();

    for (var i = 0; i < SECTIONS.length; i++) {
      var section = SECTIONS[i];
      var creatures = await loadSection(section);
      totalCreatures += creatures.length;
      var sectionEl = renderSection(section, creatures, i);
      fragment.appendChild(sectionEl);
    }

    container.innerHTML = '';
    container.appendChild(fragment);

    if (totalCreatures === 0) {
      container.innerHTML = '<div class="no-data">Бестиарий пуст. Добавьте существ в базу данных.</div>';
    }

    console.log('Бестиарий загружен (' + totalCreatures + ' существ)');

    // Позиционируем линии после загрузки
    setTimeout(positionLines, 100);
    window.addEventListener('resize', positionLines);

    initScrollTop();
    setTimeout(openBeastFromUrl, 500);
  }

  window.toggleSection = toggleSection;
  window.toggleStats = toggleStats;
  window.toggleCreature = toggleCreature;
  window.collapseSection = collapseSection;

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
