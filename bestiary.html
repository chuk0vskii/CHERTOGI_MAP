<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Бестиарий</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 40px;
    }

    .page-title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 42px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 4px;
      font-weight: normal;
    }
    .page-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    .section {
      margin-bottom: 40px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      padding: 16px 24px;
      background: rgba(74, 14, 14, 0.4);
      border: 1px solid rgba(74, 14, 14, 0.3);
      border-radius: 12px;
      transition: all 0.3s ease;
      user-select: none;
    }
    .section-header:hover {
      background: rgba(74, 14, 14, 0.6);
      border-color: #4a0e0e;
    }
    .section-header .title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 24px;
      color: #ffffff;
      letter-spacing: 2px;
      font-weight: normal;
    }
    .section-header .count {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.3);
    }
    .section-header .arrow {
      font-size: 18px;
      color: #ffffff;
      transition: transform 0.3s ease;
    }
    .section-header .arrow.open {
      transform: rotate(180deg);
    }

    .section-content {
      display: none;
      padding: 20px 0;
      gap: 16px;
      flex-direction: column;
    }
    .section-content.open {
      display: flex;
    }

    .creature-card {
      background: rgba(74, 14, 14, 0.2);
      border: 1px solid rgba(74, 14, 14, 0.2);
      border-radius: 12px;
      padding: 20px 24px;
      transition: all 0.3s ease;
    }
    .creature-card:hover {
      background: rgba(74, 14, 14, 0.35);
      border-color: rgba(74, 14, 14, 0.5);
    }
    .creature-card .creature-name {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 4px;
      font-weight: normal;
    }
    .creature-card .creature-meta {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 8px;
    }
    .creature-card .creature-meta span {
      margin-right: 16px;
    }
    .creature-card .creature-description {
      font-size: 14px;
      line-height: 1.6;
      color: #ccc;
      margin-bottom: 10px;
    }
    .creature-card .creature-stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 6px;
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }
    .creature-card .creature-stats .stat {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
    }
    .creature-card .creature-stats .stat strong {
      color: #ffffff;
    }
    .creature-card .btn-toggle-stats {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.5);
      padding: 4px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Philosopher', sans-serif;
      font-size: 12px;
      transition: all 0.3s ease;
      margin-top: 6px;
    }
    .creature-card .btn-toggle-stats:hover {
      background: rgba(74, 14, 14, 0.3);
      color: #ffffff;
      border-color: rgba(74, 14, 14, 0.5);
    }
    .creature-card .stats-full {
      display: none;
      margin-top: 10px;
      padding: 14px 16px;
      background: rgba(74, 14, 14, 0.2);
      border-radius: 8px;
      border-left: 2px solid rgba(74, 14, 14, 0.5);
    }
    .creature-card .stats-full.open {
      display: block;
    }
    .creature-card .stats-full .stat-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      padding: 2px 0;
    }
    .creature-card .stats-full .stat-row .label {
      color: rgba(255, 255, 255, 0.4);
      min-width: 100px;
    }
    .creature-card .stats-full .stat-row .value {
      color: #e0d5c0;
    }

    .loading {
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      padding: 20px 0;
    }
    .no-data {
      color: rgba(255, 255, 255, 0.15);
      text-align: center;
      padding: 20px 0;
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .container { padding: 80px 16px 30px; }
      .page-title { font-size: 30px; }
      .section-header .title { font-size: 20px; }
      .creature-card .creature-stats { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
      .creature-card .stats-full .stat-row { flex-direction: column; gap: 0; }
    }
    @media (max-width: 480px) {
      .container { padding: 70px 12px 20px; }
      .page-title { font-size: 24px; }
      .section-header .title { font-size: 17px; }
      .creature-card .creature-stats { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); }
    }
  </style>
</head>
<body>

<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>
    <a href="znaki.html">В путь</a>
    <a href="bestiary.html" class="active">Бестиарий</a>
    <a href="tree.html">Древо смерти</a>
  </div>
</div>

<div class="container">
  <h1 class="page-title">Бестиарий</h1>
  <div class="page-subtitle">Существа, населяющие Чертоги</div>
  <div id="sections-container"></div>
</div>

<script>
  // ============================================================
  // ТЕСТОВЫЕ ДАННЫЕ ДЛЯ БЕСТИАРИЯ
  // ============================================================

  var TEST_DATA = {
    beasts: [
      { id: 1, name: 'Кенеф', size: 'Средний', type: 'Зверь', armor_class: 13, hit_points: 22, speed: '40 футов', strength: 8, dexterity: 18, constitution: 12, intelligence: 4, wisdom: 14, charisma: 6, skills: 'Восприятие +6, Скрытность +8', senses: 'Пассивная Внимательность 16', abilities: 'Особый слух: Преимущество на проверки Внимательности, связанные со слухом. Стайная тактика.', actions: 'Укус: +6, 1к4+3. Ядовитый плевок: +6, спасбросок Ловкости Сл 13 или ослепление.', description: 'Кенеф — хищник средних размеров, напоминающий помесь лисицы и пустынной ящерицы.' },
      { id: 2, name: 'Сагун', size: 'Средний', type: 'Зверь', armor_class: 15, hit_points: 40, speed: '40 футов, лазание 30 футов', strength: 14, dexterity: 18, constitution: 14, intelligence: 4, wisdom: 12, charisma: 6, skills: 'Восприятие +5, Скрытность +8', senses: 'Тёмное зрение 60 футов, пассивная Внимательность 15', abilities: 'Планирующий охотник: Преимущество при атаке с высоты.', actions: 'Укус: +6, 1к10+4. Кровососание.', description: 'Сагун — мускулистый шакал с густой темной шерстью.' },
      { id: 3, name: 'Марчик', size: 'Средний', type: 'Зверь', armor_class: 14, hit_points: 35, speed: '40 футов', strength: 12, dexterity: 16, constitution: 12, intelligence: 4, wisdom: 12, charisma: 8, skills: 'Восприятие +5', senses: 'Пассивная Внимательность 15', abilities: 'Хоровой смех: Могут испугать существ.', actions: 'Укус: +5, 1к6+3.', description: 'Марчик — пятнистый шакал с короткой грубой шерстью.' }
    ],
    great_beasts: [
      { id: 1, name: 'Газур - владыка Снегов', size: 'Гигантский', type: 'Великий зверь', armor_class: 20, hit_points: 165, speed: '50 футов', strength: 30, dexterity: 10, constitution: 28, intelligence: 8, wisdom: 16, charisma: 14, damage_resistances: 'холодный', damage_vulnerabilities: 'огненный', condition_immunities: 'истощение', abilities: 'Ледяная Аура, Сверхмассивный', actions: 'Мультиатака: рогами. Топот Ледника.', description: 'Исполинский бизон с шерстью белее снега и рогами из чистейшего льда.' }
    ],
    monsters: [
      { id: 1, name: 'Кан', size: 'Средний', type: 'Монстр', armor_class: 13, hit_points: 35, speed: '45 футов', strength: 15, dexterity: 16, constitution: 14, intelligence: 10, wisdom: 12, charisma: 6, skills: 'Восприятие +3', senses: 'Пассивное Восприятие 13', abilities: 'Тактика стаи, Глаз ночи', actions: 'Мультиатака: укус и две когтями.', description: 'Кан — двуногий ящер с клювом, отличающийся красными перьями у самцов.' }
    ],
    humanoids: [
      { id: 1, name: 'Хунохой воин', size: 'Средний', type: 'Гуманоид', armor_class: 15, hit_points: 30, speed: '30 футов', strength: 14, dexterity: 16, constitution: 14, intelligence: 10, wisdom: 12, charisma: 8, skills: 'Восприятие +3, Выживание +3', senses: 'Тёмное зрение 60 футов', abilities: 'Стайная тактика', actions: 'Мультиатака: когти и укус.', description: 'Хунохой — низкорослые гуманоиды, напоминающие гиен.' }
    ],
    veil_aberrations: [
      { id: 1, name: 'Нинавеш Грани', size: 'Средний', type: 'Аберрация', armor_class: 16, hit_points: 125, speed: '30 футов, ползая 30 футов', strength: 18, dexterity: 22, constitution: 14, intelligence: 14, wisdom: 14, charisma: 10, abilities: 'Рука Изира, Хаос Вуали', actions: 'Мультиатака: 4 атаки крюком.', description: 'Вуаль полностью заполняет существо и оно становится лишь оболочкой для Изира.' }
    ]
  };

  // ============================================================
  // ОТРИСОВКА
  // ============================================================

  function getFieldLabel(field) {
    var labels = {
      'name': 'Название',
      'size': 'Размер',
      'type': 'Тип существа',
      'armor_class': 'КД',
      'hit_points': 'Хиты',
      'speed': 'Скорость',
      'strength': 'Сил',
      'dexterity': 'Лов',
      'constitution': 'Тел',
      'intelligence': 'Инт',
      'wisdom': 'Мдр',
      'charisma': 'Хур',
      'skills': 'Навыки',
      'senses': 'Чувства',
      'proficiency_bonus': 'Бонус мастерства',
      'damage_resistances': 'Сопротивление к урону',
      'damage_vulnerabilities': 'Уязвимость к урону',
      'condition_immunities': 'Иммунитет к состоянию',
      'abilities': 'Умения',
      'actions': 'Действия',
      'description': 'Описание',
      'treasure': 'Сокровище'
    };
    return labels[field] || field;
  }

  function renderCreatureCard(creature) {
    var description = creature.description || '';

    var statsFields = ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'];
    var extraFields = ['skills', 'senses', 'proficiency_bonus', 'damage_resistances', 'damage_vulnerabilities', 'condition_immunities', 'abilities', 'actions', 'treasure'];

    var statsHTML = '';
    for (var i = 0; i < statsFields.length; i++) {
      var f = statsFields[i];
      if (creature[f] !== undefined && creature[f] !== null) {
        statsHTML += '<div class="stat"><strong>' + getFieldLabel(f) + '</strong> ' + creature[f] + '</div>';
      }
    }

    var extraRows = '';
    for (var j = 0; j < extraFields.length; j++) {
      var f = extraFields[j];
      if (creature[f] !== undefined && creature[f] !== null && creature[f] !== '') {
        var label = getFieldLabel(f);
        var value = creature[f] || '—';
        extraRows += '<div class="stat-row"><span class="label">' + label + ':</span> <span class="value">' + value + '</span></div>';
      }
    }

    var extraHTML = extraRows ? '<button class="btn-toggle-stats" onclick="toggleStats(this)">Показать все характеристики</button><div class="stats-full">' + extraRows + '</div>' : '';

    var metaHTML = '';
    if (creature.size) metaHTML += '<span>' + creature.size + '</span>';
    if (creature.type) metaHTML += '<span>' + creature.type + '</span>';
    if (creature.armor_class) metaHTML += '<span>КД ' + creature.armor_class + '</span>';
    if (creature.hit_points) metaHTML += '<span>Хиты ' + creature.hit_points + '</span>';
    if (creature.speed) metaHTML += '<span>Скорость ' + creature.speed + '</span>';

    var descHTML = description ? '<div class="creature-description">' + description + '</div>' : '';
    var statsContainerHTML = statsHTML ? '<div class="creature-stats">' + statsHTML + '</div>' : '';

    return '<div class="creature-card" data-id="' + (creature.id || '') + '">' +
      '<div class="creature-name">' + (creature.name || 'Без имени') + '</div>' +
      (metaHTML ? '<div class="creature-meta">' + metaHTML + '</div>' : '') +
      descHTML +
      statsContainerHTML +
      extraHTML +
    '</div>';
  }

  function toggleStats(btn) {
    var statsFull = btn.nextElementSibling;
    if (statsFull && statsFull.classList.contains('stats-full')) {
      statsFull.classList.toggle('open');
      btn.textContent = statsFull.classList.contains('open') ? 'Скрыть характеристики' : 'Показать все характеристики';
    }
  }

  function renderSection(title, creatures, sectionId) {
    var sectionDiv = document.createElement('div');
    sectionDiv.className = 'section';
    sectionDiv.id = 'section-' + sectionId;

    var contentHTML = '';
    if (creatures.length === 0) {
      contentHTML = '<div class="no-data">Нет существ в этом разделе</div>';
    } else {
      for (var i = 0; i < creatures.length; i++) {
        contentHTML += renderCreatureCard(creatures[i]);
      }
    }

    sectionDiv.innerHTML = 
      '<div class="section-header" onclick="toggleSection(\'' + sectionId + '\')">' +
        '<span class="title">' + title + '</span>' +
        '<span style="display:flex; align-items:center; gap:12px;">' +
          '<span class="count">' + creatures.length + ' существ</span>' +
          '<span class="arrow" id="arrow-' + sectionId + '">▼</span>' +
        '</span>' +
      '</div>' +
      '<div class="section-content" id="content-' + sectionId + '">' +
        contentHTML +
      '</div>';

    return sectionDiv;
  }

  function toggleSection(sectionId) {
    var content = document.getElementById('content-' + sectionId);
    var arrow = document.getElementById('arrow-' + sectionId);
    if (content) {
      content.classList.toggle('open');
      if (arrow) arrow.classList.toggle('open');
    }
  }

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================

  function init() {
    console.log('📖 Загрузка бестиария (тестовые данные)...');

    var container = document.getElementById('sections-container');
    container.innerHTML = '';

    var sections = [
      { id: 'beasts', title: 'Звери', data: TEST_DATA.beasts },
      { id: 'great_beasts', title: 'Великие странствующие звери', data: TEST_DATA.great_beasts },
      { id: 'monsters', title: 'Монстры', data: TEST_DATA.monsters },
      { id: 'humanoids', title: 'Гуманоиды', data: TEST_DATA.humanoids },
      { id: 'veil_aberrations', title: 'Аберрации Вуали', data: TEST_DATA.veil_aberrations }
    ];

    var fragment = document.createDocumentFragment();
    var totalCreatures = 0;

    for (var i = 0; i < sections.length; i++) {
      var section = sections[i];
      totalCreatures += section.data.length;
      var sectionEl = renderSection(section.title, section.data, section.id);
      fragment.appendChild(sectionEl);
    }

    container.appendChild(fragment);

    // Открываем первый раздел
    var firstContent = document.getElementById('content-beasts');
    if (firstContent) {
      firstContent.classList.add('open');
      var arrow = document.getElementById('arrow-beasts');
      if (arrow) arrow.classList.add('open');
    }

    console.log('✅ Бестиарий загружен (' + totalCreatures + ' существ)');
  }

  window.toggleSection = toggleSection;
  window.toggleStats = toggleStats;

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
