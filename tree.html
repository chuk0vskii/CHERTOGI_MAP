<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Древо смерти</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== КОНТЕЙНЕР НА ВЕСЬ ЭКРАН ===== */
    .container {
      width: 100vw;
      height: 100vh;
      padding: 70px 0 0 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    /* ===== КОНТЕЙНЕР С КАРТИНКОЙ (на весь экран) ===== */
    .tree-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tree-container .tree-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ УЗЛОВ ===== */
    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== УЗЕЛ ===== */
    .node-point {
      position: absolute;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0;
      animation: nodeAppear 0.5s ease forwards;
      z-index: 10;
    }
    .node-point img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s ease;
      opacity: 1 !important;
    }
    .node-point:hover img {
      transform: scale(1.5);
      filter: drop-shadow(0 2px 12px rgba(0, 0, 0, 0.5));
    }
    
    /* ===== ПОДПИСЬ ПРИ НАВЕДЕНИИ ===== */
    .node-point .node-tooltip {
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(0, 0, 0, 0.9);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Philosopher', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .node-point .node-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }
    .node-point:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    /* ===== УЗЕЛ С ИМЕНЕМ (заполненный) ===== */
    .node-point.filled img {
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }
    .node-point.filled:hover img {
      filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.7));
    }
    .node-point.filled .node-tooltip {
      color: #ffd700;
      border-color: rgba(255, 215, 0, 0.3);
    }

    /* ===== УЗЕЛ БЕЗ ИМЕНИ (пустой) ===== */
    .node-point.empty img {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      opacity: 0.6 !important;
    }
    .node-point.empty:hover img {
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
      opacity: 0.8 !important;
    }
    .node-point.empty .node-tooltip {
      color: rgba(255, 255, 255, 0.4);
      border-color: rgba(255, 255, 255, 0.1);
    }

    @keyframes nodeAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ===== СТАТИСТИКА (поверх картинки, внизу) ===== */
    .tree-stats {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
      padding: 12px 30px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 10px;
      border: 1px solid rgba(255, 215, 0, 0.1);
      flex-wrap: wrap;
      justify-content: center;
      z-index: 20;
    }
    .tree-stats .stat-item {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      white-space: nowrap;
    }
    .tree-stats .stat-item strong {
      color: #ffd700;
      font-size: 18px;
    }

    /* ===== ЗАГРУЗКА ===== */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0, 0, 0, 0.3);
      font-size: 18px;
      z-index: 5;
    }

    /* ===== КООРДИНАТЫ (уведомление) ===== */
    .coords-notification {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #51cf66;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Philosopher', sans-serif;
      border: 1px solid rgba(81, 207, 102, 0.3);
      z-index: 999;
      display: none;
      pointer-events: none;
      letter-spacing: 1px;
      text-align: center;
    }
    .coords-notification.visible {
      display: block;
      animation: fadeInOut 2s ease forwards;
    }
    .coords-notification .coords-text {
      color: #ffd700;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    /* ===== АДАПТАЦИЯ ===== */
    @media (max-width: 768px) {
      .node-point { width: 20px; height: 20px; }
      .node-point .node-tooltip { font-size: 11px; padding: 4px 10px; }
      .tree-stats { gap: 20px; padding: 10px 20px; bottom: 20px; }
      .tree-stats .stat-item { font-size: 11px; }
      .tree-stats .stat-item strong { font-size: 15px; }
    }
    @media (max-width: 480px) {
      .node-point { width: 18px; height: 18px; }
      .node-point .node-tooltip { font-size: 10px; padding: 3px 8px; }
      .tree-stats { gap: 12px; padding: 8px 16px; bottom: 15px; flex-wrap: wrap; }
      .tree-stats .stat-item { font-size: 10px; }
      .tree-stats .stat-item strong { font-size: 13px; }
    }
  </style>
</head>
<body>

<!-- БАННЕР -->
<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>
    <a href="znaki.html">В путь</a>
    <a href="bestiary.html">Бестиарий</a>
    <a href="tree.html" class="active">Древо смерти</a>
  </div>
</div>

<div class="container">
  <div id="treeContainer" class="tree-container">
    <img src="/CHERTOGI_MAP/znakiimg/drevo_smerty.jpg" alt="Древо смерти" class="tree-image" id="treeImage">
    <div class="nodes-container" id="nodesContainer"></div>
    
    <!-- СТАТИСТИКА ПОВЕРХ КАРТИНКИ -->
    <div class="tree-stats" id="treeStats">
      <div class="stat-item">Всего павших: <strong id="totalDeceased">0</strong></div>
      <div class="stat-item">Узлов на древе: <strong id="totalNodes">0</strong></div>
      <div class="stat-item">Последний павший: <strong id="lastDeceased">—</strong></div>
    </div>
    
    <div id="loadingMessage" class="loading">Загрузка...</div>
  </div>
</div>

<!-- УВЕДОМЛЕНИЕ О КООРДИНАТАХ -->
<div class="coords-notification" id="coordsNotification">
  Координаты скопированы: <span class="coords-text" id="coordsText">X: 0.0%, Y: 0.0%</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>
  // ============================================================
  // КОНФИГУРАЦИЯ УЗЛОВ (координаты в процентах от картинки)
  // ============================================================

  var DEFAULT_NODES = [
    { id: 1, x: 43.5, y: 87.3 },
    { id: 2, x: 44.1, y: 82.9 },
    { id: 3, x: 50.2, y: 81.7 },
    { id: 4, x: 37.0, y: 80.1 },
    { id: 5, x: 42.5, y: 79.9 },
    { id: 6, x: 44.8, y: 74.8 },
    { id: 7, x: 41.0, y: 73.5 },
    { id: 8, x: 33.0, y: 75.7 },
    { id: 9, x: 32.0, y: 77.6 },
    { id: 10, x: 30.1, y: 80.3 },
    { id: 11, x: 33.9, y: 84.7 },
    { id: 12, x: 32.0, y: 83.3 },
    { id: 13, x: 24.8, y: 86.6 },
    { id: 14, x: 21.5, y: 81.3 },
    { id: 15, x: 20.1, y: 73.9 },
    { id: 16, x: 26.0, y: 78.3 },
    { id: 17, x: 28.0, y: 77.2 },
    { id: 18, x: 21.0, y: 60.3 },
    { id: 19, x: 46.0, y: 72.5 },
    { id: 20, x: 47.8, y: 75.5 },
    { id: 21, x: 54.0, y: 81.7 },
    { id: 22, x: 63.7, y: 81.7 },
    { id: 23, x: 64.3, y: 77.4 },
    { id: 24, x: 76.5, y: 78.3 },
    { id: 25, x: 89.0, y: 56.0 },
    { id: 26, x: 76.1, y: 42.8 }
  ];

  var allNodePositions = DEFAULT_NODES;
  var allDeceasedNames = [];

  // ============================================================
  // ОПРЕДЕЛЕНИЕ КООРДИНАТ ПРИ КЛИКЕ НА КАРТИНКУ
  // ============================================================

  var coordsNotification = document.getElementById('coordsNotification');
  var coordsText = document.getElementById('coordsText');

  document.getElementById('treeContainer').addEventListener('click', function(e) {
    if (e.target.closest('.node-point')) return;
    
    var rect = this.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    var y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    
    var coordString = '{ x: ' + x + ', y: ' + y + ' }';
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(coordString).then(function() {
        console.log('Координаты скопированы:', coordString);
      }).catch(function() {
        copyFallback(coordString);
      });
    } else {
      copyFallback(coordString);
    }
    
    coordsText.textContent = 'X: ' + x + '%, Y: ' + y + '%';
    coordsNotification.classList.remove('visible');
    void coordsNotification.offsetWidth;
    coordsNotification.classList.add('visible');
    
    setTimeout(function() {
      coordsNotification.classList.remove('visible');
    }, 3000);
  });

  function copyFallback(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      console.log('Координаты скопированы (fallback):', text);
    } catch (e) {
      console.log('Не удалось скопировать:', text);
    }
    document.body.removeChild(textarea);
  }

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
  // ============================================================

  async function loadDeceased() {
    var container = document.getElementById('nodesContainer');
    var loading = document.getElementById('loadingMessage');
    
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      var result = await _supabase
        .from('game_reports')
        .select('deceased_names, created_at')
        .not('deceased_names', 'is', null)
        .order('created_at', { ascending: false });

      if (result.error) {
        console.error('Ошибка загрузки:', result.error);
        loading.textContent = 'Ошибка загрузки данных';
        return;
      }

      var reports = result.data || [];
      
      var allDeceased = [];
      var lastDeceasedName = null;
      var lastDeceasedTime = null;

      for (var i = 0; i < reports.length; i++) {
        var report = reports[i];
        var names = report.deceased_names;
        
        if (!names || names.length === 0) continue;
        
        if (typeof names === 'string') {
          names = names.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        }
        
        for (var j = 0; j < names.length; j++) {
          var name = names[j];
          if (name && name.trim()) {
            allDeceased.push({
              name: name.trim(),
              created_at: report.created_at
            });
            if (!lastDeceasedName) {
              lastDeceasedName = name.trim();
              lastDeceasedTime = report.created_at;
            }
          }
        }
      }

      allDeceasedNames = allDeceased;

      document.getElementById('totalDeceased').textContent = allDeceased.length;
      document.getElementById('totalNodes').textContent = allNodePositions.length;
      
      if (lastDeceasedName) {
        var date = new Date(lastDeceasedTime);
        document.getElementById('lastDeceased').textContent = lastDeceasedName + ' (' + date.toLocaleDateString('ru-RU') + ')';
      }

      loading.style.display = 'none';
      renderNodes(allDeceased);

    } catch (err) {
      console.error('Ошибка:', err);
      loading.textContent = 'Ошибка загрузки данных';
    }
  }

  // ============================================================
  // ОТРИСОВКА УЗЛОВ
  // ============================================================

  function renderNodes(deceased) {
    var container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    var shuffled = deceased.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }

    for (var m = 0; m < allNodePositions.length; m++) {
      var pos = allNodePositions[m];
      var person = shuffled[m] || null;
      var isEmpty = !person;
      
      var node = document.createElement('div');
      
      if (isEmpty) {
        node.className = 'node-point empty';
      } else {
        node.className = 'node-point filled';
      }
      
      node.style.left = pos.x + '%';
      node.style.top = pos.y + '%';
      node.style.animationDelay = (m * 0.04) + 's';
      
      var tooltipText = '';
      if (isEmpty) {
        tooltipText = 'Узел #' + pos.id + ' — Пустой';
      } else {
        tooltipText = '#' + pos.id + ' — ' + person.name;
      }
      
      node.innerHTML = `
        <img src="/CHERTOGI_MAP/icons/uzelsmerty.png" alt="узел">
        <span class="node-tooltip">${tooltipText}</span>
      `;
      
      container.appendChild(node);
    }
  }

  // ============================================================
  // ЗАПУСК
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    var img = document.getElementById('treeImage');
    if (img.complete) {
      loadDeceased();
    } else {
      img.addEventListener('load', loadDeceased);
    }
  });

  window.addEventListener('focus', function() {
    loadDeceased();
  });
</script>

</body>
</html>
