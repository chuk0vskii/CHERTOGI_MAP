<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Древо смерти</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== КОНТЕЙНЕР НА ВЕСЬ ЭКРАН ===== */
    .container {
      width: 100vw;
      height: 100vh;
      padding: 70px 0 0 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    /* ===== КОНТЕЙНЕР С КАРТИНКОЙ (на весь экран) ===== */
    .tree-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tree-container .tree-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ УЗЛОВ ===== */
    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== УЗЕЛ (только заполненные) ===== */
    .node-point {
      position: absolute;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0;
      animation: nodeAppear 0.5s ease forwards;
      z-index: 10;
    }
    .node-point img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s ease;
      opacity: 1 !important;
    }
    .node-point:hover img {
      transform: scale(1.5);
      filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.7));
    }
    
    /* ===== ПОДПИСЬ ПРИ НАВЕДЕНИИ ===== */
    .node-point .node-tooltip {
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(0, 0, 0, 0.9);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Philosopher', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .node-point .node-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }
    .node-point:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    @keyframes nodeAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ===== СТАТИСТИКА (слева, столбиком, без фона) ===== */
    .tree-stats {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0;
      z-index: 20;
      min-width: 160px;
    }
    .tree-stats .stat-item {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      gap: 0px;
    }
    .tree-stats .stat-item .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.25);
    }
    .tree-stats .stat-item strong {
      color: #1a1a1a;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Calypso', serif;
      letter-spacing: 1px;
    }
    .tree-stats .stat-item .sub-text {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: normal;
      font-family: 'Philosopher', sans-serif;
      word-break: break-all;
      max-width: 160px;
    }

    /* ===== ЗАГРУЗКА ===== */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0, 0, 0, 0.3);
      font-size: 18px;
      z-index: 5;
    }

    /* ===== АДАПТАЦИЯ ===== */
    @media (max-width: 768px) {
      .node-point { width: 20px; height: 20px; }
      .node-point .node-tooltip { font-size: 11px; padding: 4px 10px; }
      .tree-stats { 
        left: 16px; 
        min-width: 120px;
        gap: 16px;
      }
      .tree-stats .stat-item strong { font-size: 22px; }
      .tree-stats .stat-item .stat-label { font-size: 10px; }
      .tree-stats .stat-item .sub-text { font-size: 12px; max-width: 100px; }
    }
    @media (max-width: 480px) {
      .node-point { width: 18px; height: 18px; }
      .node-point .node-tooltip { font-size: 10px; padding: 3px 8px; }
      .tree-stats { 
        left: 10px; 
        min-width: 90px;
        gap: 12px;
      }
      .tree-stats .stat-item strong { font-size: 18px; }
      .tree-stats .stat-item .stat-label { font-size: 9px; }
      .tree-stats .stat-item .sub-text { font-size: 10px; max-width: 80px; }
    }
  </style>
</head>
<body>

<!-- БАННЕР -->
<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>

<div class="container">
  <div id="treeContainer" class="tree-container">
    <img src="/CHERTOGI_MAP/znakiimg/drevo_smerty.jpg" alt="Древо смерти" class="tree-image" id="treeImage">
    <div class="nodes-container" id="nodesContainer"></div>
    
    <!-- СТАТИСТИКА СЛЕВА (без фона) -->
    <div class="tree-stats" id="treeStats">
      <div class="stat-item">
        <span class="stat-label">Всего павших</span>
        <strong id="totalDeceased">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Последний павший</span>
        <strong id="lastDeceased" class="sub-text">—</strong>
      </div>
    </div>
    
    <div id="loadingMessage" class="loading">Загрузка...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>
  // ============================================================
  // ФИКСИРОВАННЫЕ КООРДИНАТЫ УЗЛОВ (52 штуки)
  // ============================================================

  var DEFAULT_NODES = [
    { id: 1, x: 41.0, y: 84.6 },

    { id: 21, x: 55.0, y: 31.7 },
    { id: 22, x: 60.9, y: 46.1 },

    { id: 32, x: 69.5, y: 65.9 },
    { id: 33, x: 49.0, y: 75.3 },
    { id: 34, x: 41.1, y: 59.1 },

    { id: 36, x: 49.9, y: 36.8 },
    { id: 37, x: 71.8, y: 22.1 },
    { id: 38, x: 42.7, y: 69.5 },
    { id: 39, x: 41.6, y: 77.1 },
    { id: 40, x: 65.5, y: 63.8 },
    { id: 41, x: 71.2, y: 46.7 },
    { id: 42, x: 52.0, y: 73.9 },
    { id: 43, x: 53.4, y: 73.8 },
    { id: 44, x: 44.1, y: 52.1 },
    { id: 45, x: 48.8, y: 49.6 },
    { id: 46, x: 45.6, y: 39.2 },
    { id: 47, x: 68.5, y: 36.2 },
    { id: 48, x: 68.4, y: 80.4 },
    { id: 49, x: 61.7, y: 66.2 },
    { id: 50, x: 67.3, y: 54.5 },
    { id: 51, x: 58.1, y: 58.3 },
    { id: 52, x: 56.4, y: 54.6 }
  ];

  var allNodePositions = DEFAULT_NODES;

  console.log('✅ Загружено ' + allNodePositions.length + ' узлов');

  // ============================================================
  // ХРАНЕНИЕ СООТВЕТСТВИЙ ИМЯ → НОМЕР УЗЛА
  // ============================================================

  var STORAGE_KEY = 'tree_node_assignments';

  function loadAssignments() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.warn('Ошибка загрузки назначений:', e);
    }
    return {};
  }

  function saveAssignments(assignments) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
    } catch (e) {
      console.warn('Ошибка сохранения назначений:', e);
    }
  }

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
  // ============================================================

  async function loadDeceased() {
    var container = document.getElementById('nodesContainer');
    var loading = document.getElementById('loadingMessage');
    
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      var result = await _supabase
        .from('game_reports')
        .select('deceased_names, created_at')
        .not('deceased_names', 'is', null)
        .order('created_at', { ascending: false });

      if (result.error) {
        console.error('Ошибка загрузки:', result.error);
        loading.textContent = 'Ошибка загрузки данных';
        return;
      }

      var reports = result.data || [];
      
      // Собираем ВСЕ имена умерших из ВСЕХ отчётов
      var allDeceasedNames = [];
      var lastDeceasedName = null;
      var lastDeceasedTime = null;

      for (var i = 0; i < reports.length; i++) {
        var report = reports[i];
        var names = report.deceased_names;
        
        if (!names || names.length === 0) continue;
        
        if (typeof names === 'string') {
          names = names.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        }
        
        for (var j = 0; j < names.length; j++) {
          var name = names[j];
          if (name && name.trim()) {
            allDeceasedNames.push(name.trim());
            if (!lastDeceasedName) {
              lastDeceasedName = name.trim();
              lastDeceasedTime = report.created_at;
            }
          }
        }
      }

      // Убираем дубликаты имён (если один персонаж упомянут в нескольких отчётах)
      var uniqueNames = [];
      var seen = {};
      for (var k = 0; k < allDeceasedNames.length; k++) {
        var name = allDeceasedNames[k];
        if (!seen[name]) {
          seen[name] = true;
          uniqueNames.push(name);
        }
      }

      // Загружаем сохранённые назначения
      var assignments = loadAssignments();
      
      // Назначаем новым именам свободные узлы
      var nextNodeId = 1;
      var assignedCount = Object.keys(assignments).length;
      
      // Находим следующий свободный ID
      var usedIds = {};
      for (var key in assignments) {
        usedIds[assignments[key]] = true;
      }
      
      // Для каждого уникального имени проверяем, есть ли у него назначение
      var updatedAssignments = {};
      var namesWithoutNode = [];
      
      for (var m = 0; m < uniqueNames.length; m++) {
        var name = uniqueNames[m];
        // Проверяем, есть ли уже назначение для этого имени
        var found = false;
        for (var key in assignments) {
          if (key === name) {
            updatedAssignments[name] = assignments[key];
            found = true;
            break;
          }
        }
        if (!found) {
          namesWithoutNode.push(name);
        }
      }
      
      // Назначаем новые имена на свободные узлы
      for (var n = 0; n < namesWithoutNode.length; n++) {
        var newName = namesWithoutNode[n];
        // Находим первый свободный ID
        var freeId = null;
        for (var id = 1; id <= allNodePositions.length; id++) {
          var isUsed = false;
          for (var key in updatedAssignments) {
            if (updatedAssignments[key] === id) {
              isUsed = true;
              break;
            }
          }
          if (!isUsed) {
            freeId = id;
            break;
          }
        }
        if (freeId !== null) {
          updatedAssignments[newName] = freeId;
          console.log('📌 Назначен узел #' + freeId + ' для "' + newName + '"');
        } else {
          console.warn('⚠️ Нет свободных узлов для "' + newName + '"');
        }
      }
      
      // Сохраняем обновлённые назначения
      saveAssignments(updatedAssignments);
      
      // Обновляем статистику
      document.getElementById('totalDeceased').textContent = uniqueNames.length;
      
      if (lastDeceasedName) {
        var date = new Date(lastDeceasedTime);
        document.getElementById('lastDeceased').textContent = lastDeceasedName + ' (' + date.toLocaleDateString('ru-RU') + ')';
      }

      loading.style.display = 'none';
      
      // Отрисовываем узлы на основе назначений
      renderNodesFromAssignments(updatedAssignments);

    } catch (err) {
      console.error('Ошибка:', err);
      loading.textContent = 'Ошибка загрузки данных';
    }
  }

  // ============================================================
  // ОТРИСОВКА УЗЛОВ НА ОСНОВЕ НАЗНАЧЕНИЙ
  // ============================================================

  function renderNodesFromAssignments(assignments) {
    var container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    var assignedCount = Object.keys(assignments).length;
    
    if (assignedCount === 0) {
      var emptyMsg = document.createElement('div');
      emptyMsg.style.cssText = 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(0,0,0,0.15); font-family: "Philosopher", sans-serif; font-size: 20px; letter-spacing: 2px; pointer-events: none; z-index: 5;';
      emptyMsg.textContent = 'Нет павших...';
      container.appendChild(emptyMsg);
      return;
    }

    console.log('🟢 Отображаем ' + assignedCount + ' узлов');

    var index = 0;
    for (var name in assignments) {
      var nodeId = assignments[name];
      var pos = allNodePositions[nodeId - 1]; // -1 потому что ID начинаются с 1
      
      if (!pos) {
        console.warn('⚠️ Узел #' + nodeId + ' не найден для "' + name + '"');
        continue;
      }
      
      var node = document.createElement('div');
      node.className = 'node-point';
      
      node.style.left = pos.x + '%';
      node.style.top = pos.y + '%';
      node.style.animationDelay = (index * 0.05) + 's';
      
      node.innerHTML = `
        <img src="/CHERTOGI_MAP/icons/uzelsmerty.png" alt="узел">
        <span class="node-tooltip">#${nodeId} — ${name}</span>
      `;
      
      container.appendChild(node);
      index++;
    }
  }

  // ============================================================
  // ЗАПУСК
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    var img = document.getElementById('treeImage');
    if (img.complete) {
      loadDeceased();
    } else {
      img.addEventListener('load', loadDeceased);
    }
  });

  window.addEventListener('focus', function() {
    loadDeceased();
  });
</script>
