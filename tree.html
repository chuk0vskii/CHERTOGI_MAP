<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Древо смерти</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;
      padding: 70px 0 0 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    .tree-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tree-container .tree-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .node-point {
      position: absolute;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0;
      animation: nodeAppear 0.5s ease forwards;
      z-index: 10;
    }
    .node-point img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s ease;
      opacity: 1 !important;
    }
    .node-point:hover img {
      transform: scale(1.5);
      filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.7));
    }
    
    .node-point .node-tooltip {
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(0, 0, 0, 0.9);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Philosopher', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .node-point .node-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }
    .node-point:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    @keyframes nodeAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    .tree-stats {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0;
      z-index: 20;
      min-width: 160px;
    }
    .tree-stats .stat-item {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      gap: 0px;
    }
    .tree-stats .stat-item .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.25);
    }
    .tree-stats .stat-item strong {
      color: #1a1a1a;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Calypso', serif;
      letter-spacing: 1px;
    }
    .tree-stats .stat-item .sub-text {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: normal;
      font-family: 'Philosopher', sans-serif;
      word-break: break-all;
      max-width: 160px;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0, 0, 0, 0.3);
      font-size: 18px;
      z-index: 5;
    }

    @media (max-width: 768px) {
      .node-point { width: 20px; height: 20px; }
      .node-point .node-tooltip { font-size: 11px; padding: 4px 10px; }
      .tree-stats { 
        left: 16px; 
        min-width: 120px;
        gap: 16px;
      }
      .tree-stats .stat-item strong { font-size: 22px; }
      .tree-stats .stat-item .stat-label { font-size: 10px; }
      .tree-stats .stat-item .sub-text { font-size: 12px; max-width: 100px; }
    }
    @media (max-width: 480px) {
      .node-point { width: 18px; height: 18px; }
      .node-point .node-tooltip { font-size: 10px; padding: 3px 8px; }
      .tree-stats { 
        left: 10px; 
        min-width: 90px;
        gap: 12px;
      }
      .tree-stats .stat-item strong { font-size: 18px; }
      .tree-stats .stat-item .stat-label { font-size: 9px; }
      .tree-stats .stat-item .sub-text { font-size: 10px; max-width: 80px; }
    }
  </style>
</head>
<body>

<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>
    <a href="znaki.html">В путь</a>
    <a href="bestiary.html">Бестиарий</a>
    <a href="tree.html" class="active">Древо смерти</a>
  </div>
</div>

<div class="container">
  <div id="treeContainer" class="tree-container">
    <img src="/CHERTOGI_MAP/znakiimg/drevo_smerty.jpg" alt="Древо смерти" class="tree-image" id="treeImage">
    <div class="nodes-container" id="nodesContainer"></div>
    
    <div class="tree-stats" id="treeStats">
      <div class="stat-item">
        <span class="stat-label">Всего павших</span>
        <strong id="totalDeceased">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Последний павший</span>
        <strong id="lastDeceased" class="sub-text">-</strong>
      </div>
    </div>
    
    <div id="loadingMessage" class="loading">Загрузка...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>

  // ============================================================

  var allNodePositions = DEFAULT_NODES;
  var STORAGE_KEY = 'tree_node_assignments';

  function loadAssignments() {
    try {
      var saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        return JSON.parse(saved);
      }
    } catch (e) {
      console.warn('Ошибка загрузки назначений:', e);
    }
    return {};
  }

  function saveAssignments(assignments) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(assignments));
    } catch (e) {
      console.warn('Ошибка сохранения назначений:', e);
    }
  }

  // ============================================================
  // ПОИСК ОТЧЁТА ПО ИМЕНИ
  // ============================================================

  async function findReportByDeceasedName(name) {
    try {
      var result = await _supabase
        .from('game_reports')
        .select('id, region_id')
        .contains('deceased_names', [name])
        .limit(1);
      
      if (result.error) {
        console.error('Ошибка поиска отчёта:', result.error);
        return null;
      }
      
      if (result.data && result.data.length > 0) {
        return result.data[0];
      }
      return null;
    } catch (err) {
      console.error('Ошибка:', err);
      return null;
    }
  }

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ
  // ============================================================

  async function loadDeceased() {
    var container = document.getElementById('nodesContainer');
    var loading = document.getElementById('loadingMessage');
    
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      var result = await _supabase
        .from('game_reports')
        .select('deceased_names, created_at, id, region_id')
        .not('deceased_names', 'is', null)
        .order('created_at', { ascending: false });

      if (result.error) {
        console.error('Ошибка загрузки:', result.error);
        loading.textContent = 'Ошибка загрузки данных';
        return;
      }

      var reports = result.data || [];
      
      var allDeceased = [];
      var lastDeceasedName = null;
      var lastDeceasedTime = null;
      var nameToReportMap = {};

      for (var i = 0; i < reports.length; i++) {
        var report = reports[i];
        var names = report.deceased_names;
        
        if (!names || names.length === 0) continue;
        
        if (typeof names === 'string') {
          names = names.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        }
        
        for (var j = 0; j < names.length; j++) {
          var name = names[j];
          if (name && name.trim()) {
            var trimmedName = name.trim();
            // Сохраняем только уникальные имена, но запоминаем отчёт
            if (!nameToReportMap[trimmedName]) {
              nameToReportMap[trimmedName] = {
                report_id: report.id,
                region_id: report.region_id
              };
              allDeceased.push({
                name: trimmedName,
                created_at: report.created_at,
                report_id: report.id,
                region_id: report.region_id
              });
            }
            if (!lastDeceasedName) {
              lastDeceasedName = trimmedName;
              lastDeceasedTime = report.created_at;
            }
          }
        }
      }

      document.getElementById('totalDeceased').textContent = allDeceased.length;
      
      if (lastDeceasedName) {
        var date = new Date(lastDeceasedTime);
        document.getElementById('lastDeceased').textContent = lastDeceasedName + ' (' + date.toLocaleDateString('ru-RU') + ')';
      }

      loading.style.display = 'none';
      renderFilledNodes(allDeceased);

    } catch (err) {
      console.error('Ошибка:', err);
      loading.textContent = 'Ошибка загрузки данных';
    }
  }

  // ============================================================
  // ОТРИСОВКА УЗЛОВ С ПЕРЕХОДОМ НА КАРТУ
  // ============================================================

  function renderFilledNodes(deceased) {
    var container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    var shuffled = deceased.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }

    var nodesToShow = Math.min(shuffled.length, allNodePositions.length);
    
    console.log('Отображаем ' + nodesToShow + ' узлов из ' + allNodePositions.length + ' доступных');

    for (var m = 0; m < nodesToShow; m++) {
      var pos = allNodePositions[m];
      var person = shuffled[m];
      
      if (!person) continue;
      
      var node = document.createElement('div');
      node.className = 'node-point';
      
      node.style.left = pos.x + '%';
      node.style.top = pos.y + '%';
      node.style.animationDelay = (m * 0.05) + 's';
      
      var tooltipText = '#' + pos.id + ' - ' + person.name;
      
      node.innerHTML = `
        <img src="/CHERTOGI_MAP/icons/uzelsmerty.png" alt="узел">
        <span class="node-tooltip">${tooltipText}</span>
      `;
      
      // Клик по узлу - переход на карту и открытие отчёта
      node.addEventListener('click', function(e) {
        e.stopPropagation();
        var name = person.name;
        var reportId = person.report_id;
        var regionId = person.region_id;
        
        // Переходим на страницу карты с параметрами
        var url = 'index.html?report_id=' + reportId + '&region_id=' + regionId + '&name=' + encodeURIComponent(name);
        window.location.href = url;
      });
      
      container.appendChild(node);
    }
    
    if (nodesToShow === 0) {
      var emptyMsg = document.createElement('div');
      emptyMsg.style.cssText = 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(0,0,0,0.15); font-family: "Philosopher", sans-serif; font-size: 20px; letter-spacing: 2px; pointer-events: none; z-index: 5;';
      emptyMsg.textContent = 'Нет павших...';
      container.appendChild(emptyMsg);
    }
  }

  // ============================================================
  // ЗАПУСК
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    var img = document.getElementById('treeImage');
    if (img.complete) {
      loadDeceased();
    } else {
      img.addEventListener('load', loadDeceased);
    }
  });

  window.addEventListener('focus', function() {
    loadDeceased();
  });
</script>

</html>
