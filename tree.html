<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Древо смерти</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 100px 20px 40px;
      position: relative;
    }

    /* ===== ЗАГОЛОВОК ===== */
    .page-title {
      font-family: 'Calypso', 'Times New Roman', serif;
      font-size: 42px;
      color: #ffffff;
      text-align: center;
      margin-bottom: 10px;
      letter-spacing: 4px;
      font-weight: normal;
    }
    .page-subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.3);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    /* ===== КОНТЕЙНЕР С КАРТИНКОЙ ===== */
    .tree-container {
      position: relative;
      max-width: 800px;
      margin: 0 auto;
      background: rgba(74, 14, 14, 0.1);
      border-radius: 16px;
      border: 1px solid rgba(74, 14, 14, 0.2);
      overflow: hidden;
    }
    .tree-container .tree-image {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ УЗЛОВ ===== */
    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== УЗЕЛ ===== */
    .node-point {
      position: absolute;
      width: 32px;
      height: 32px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0;
      animation: nodeAppear 0.5s ease forwards;
    }
    .node-point img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(255, 215, 0, 0.3));
      transition: transform 0.3s ease;
    }
    .node-point:hover img {
      transform: scale(1.3);
      filter: drop-shadow(0 2px 12px rgba(255, 215, 0, 0.6));
    }
    .node-point .node-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(10, 10, 10, 0.95);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Philosopher', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .node-point .node-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(10, 10, 10, 0.95);
    }
    .node-point:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    @keyframes nodeAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ===== ЗАГРУЗКА ===== */
    .loading {
      color: rgba(255, 255, 255, 0.3);
      text-align: center;
      padding: 60px 0;
      font-size: 18px;
    }
    .no-data {
      color: rgba(255, 255, 255, 0.15);
      text-align: center;
      padding: 60px 0;
      font-size: 16px;
    }

    /* ===== СТАТИСТИКА ===== */
    .tree-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
      padding: 16px 24px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      flex-wrap: wrap;
    }
    .tree-stats .stat-item {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 1px;
    }
    .tree-stats .stat-item strong {
      color: #ffd700;
      font-size: 20px;
    }

    /* ===== АДАПТАЦИЯ ===== */
    @media (max-width: 768px) {
      .container { padding: 80px 16px 30px; }
      .page-title { font-size: 30px; }
      .tree-stats { gap: 20px; }
      .node-point { width: 24px; height: 24px; }
      .node-point .node-tooltip { font-size: 11px; padding: 4px 10px; }
    }
    @media (max-width: 480px) {
      .container { padding: 70px 12px 20px; }
      .page-title { font-size: 24px; }
      .node-point { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

<!-- БАННЕР -->
<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>
    <a href="znaki.html">В путь</a>
    <a href="bestiary.html">Бестиарий</a>
    <a href="tree.html" class="active">Древо смерти</a>
  </div>
</div>

<div class="container">
  <h1 class="page-title">Древо смерти</h1>
  <div class="page-subtitle">Каждый павший оставляет след на ветвях</div>

  <div id="treeContainer" class="tree-container">
    <img src="/CHERTOGI_MAP/drevo_smerty.jpg" alt="Древо смерти" class="tree-image" id="treeImage">
    <div class="nodes-container" id="nodesContainer"></div>
  </div>

  <div class="tree-stats" id="treeStats">
    <div class="stat-item">Всего павших: <strong id="totalDeceased">0</strong></div>
    <div class="stat-item">Узлов на древе: <strong id="totalNodes">0</strong></div>
    <div class="stat-item">Последний павший: <strong id="lastDeceased">—</strong></div>
  </div>

  <div id="loadingMessage" class="loading">Загрузка...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>
  // ============================================================
  // КОНФИГУРАЦИЯ УЗЛОВ (координаты в процентах от картинки)
  // ============================================================

  var NODE_POSITIONS = [
    { x: 50, y: 8 },
    { x: 35, y: 15 },
    { x: 65, y: 15 },
    { x: 25, y: 25 },
    { x: 75, y: 25 },
    { x: 40, y: 30 },
    { x: 60, y: 30 },
    { x: 20, y: 40 },
    { x: 80, y: 40 },
    { x: 45, y: 45 },
    { x: 55, y: 45 },
    { x: 30, y: 55 },
    { x: 70, y: 55 },
    { x: 50, y: 58 },
    { x: 35, y: 68 },
    { x: 65, y: 68 },
    { x: 25, y: 78 },
    { x: 75, y: 78 },
    { x: 45, y: 82 },
    { x: 55, y: 82 },
    { x: 30, y: 90 },
    { x: 70, y: 90 },
    { x: 50, y: 95 }
  ];

  var usedNodeIndex = 0;
  var allDeceasedNames = [];
  var nodeAssignments = [];

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
  // ============================================================

  async function loadDeceased() {
    var container = document.getElementById('nodesContainer');
    var loading = document.getElementById('loadingMessage');
    
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      var result = await _supabase
        .from('game_reports')
        .select('deceased_names, created_at')
        .not('deceased_names', 'is', null)
        .order('created_at', { ascending: false });

      if (result.error) {
        console.error('Ошибка загрузки:', result.error);
        loading.textContent = 'Ошибка загрузки данных';
        return;
      }

      var reports = result.data || [];
      
      var allDeceased = [];
      var lastDeceasedName = null;
      var lastDeceasedTime = null;

      for (var i = 0; i < reports.length; i++) {
        var report = reports[i];
        var names = report.deceased_names;
        
        if (!names || names.length === 0) continue;
        
        if (typeof names === 'string') {
          names = names.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        }
        
        for (var j = 0; j < names.length; j++) {
          var name = names[j];
          if (name && name.trim()) {
            allDeceased.push({
              name: name.trim(),
              created_at: report.created_at
            });
            if (!lastDeceasedName) {
              lastDeceasedName = name.trim();
              lastDeceasedTime = report.created_at;
            }
          }
        }
      }

      allDeceasedNames = allDeceased;

      document.getElementById('totalDeceased').textContent = allDeceased.length;
      document.getElementById('totalNodes').textContent = Math.min(allDeceased.length, NODE_POSITIONS.length);
      
      if (lastDeceasedName) {
        var date = new Date(lastDeceasedTime);
        document.getElementById('lastDeceased').textContent = lastDeceasedName + ' (' + date.toLocaleDateString('ru-RU') + ')';
      }

      if (allDeceased.length === 0) {
        loading.textContent = 'Пока нет павших... Древо смерти пустует';
        loading.style.display = 'block';
        return;
      }

      loading.style.display = 'none';
      renderNodes(allDeceased);

    } catch (err) {
      console.error('Ошибка:', err);
      loading.textContent = 'Ошибка загрузки данных';
    }
  }

  // ============================================================
  // ОТРИСОВКА УЗЛОВ
  // ============================================================

  function renderNodes(deceased) {
    var container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    var count = Math.min(deceased.length, NODE_POSITIONS.length);
    
    var shuffled = deceased.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }

    for (var k = 0; k < count; k++) {
      var pos = NODE_POSITIONS[k];
      var person = shuffled[k];
      
      var node = document.createElement('div');
      node.className = 'node-point';
      node.style.left = pos.x + '%';
      node.style.top = pos.y + '%';
      node.style.animationDelay = (k * 0.08) + 's';
      
      node.innerHTML = `
        <img src="/CHERTOGI_MAP/uzelsmerty.png" alt="узел">
        <span class="node-tooltip">${person.name}</span>
      `;
      
      container.appendChild(node);
    }
  }

  // ============================================================
  // ЗАПУСК
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    var img = document.getElementById('treeImage');
    if (img.complete) {
      loadDeceased();
    } else {
      img.addEventListener('load', loadDeceased);
    }
  });

  window.addEventListener('focus', function() {
    loadDeceased();
  });
</script>

</body>
</html>
