<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Огненные чертоги — Древо смерти</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== СТИЛИ ДЛЯ СТРАНИЦЫ ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #ffffff;
      color: #e0d5c0;
      font-family: 'Philosopher', 'Arial', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ===== КОНТЕЙНЕР НА ВЕСЬ ЭКРАН ===== */
    .container {
      width: 100vw;
      height: 100vh;
      padding: 70px 0 0 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }

    /* ===== КОНТЕЙНЕР С КАРТИНКОЙ (на весь экран) ===== */
    .tree-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tree-container .tree-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    /* ===== КОНТЕЙНЕР ДЛЯ УЗЛОВ ===== */
    .nodes-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ===== ВРЕМЕННЫЙ МАРКЕР (красная точка) ===== */
    .temp-marker {
      position: absolute;
      width: 16px;
      height: 16px;
      background: #ff0000;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 25;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 60px rgba(255, 0, 0, 0.4);
      animation: markerPulse 1s ease-in-out infinite;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }
    .temp-marker .marker-label {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);
      color: #ff0000;
      font-size: 11px;
      font-family: 'Philosopher', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      border: 1px solid rgba(255, 0, 0, 0.3);
      pointer-events: none;
    }
    .temp-marker .marker-coords {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 10px;
      font-family: 'Philosopher', monospace;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @keyframes markerPulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    /* ===== УЗЕЛ (только заполненные) ===== */
    .node-point {
      position: absolute;
      width: 24px;
      height: 24px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.3s ease;
      opacity: 0;
      animation: nodeAppear 0.5s ease forwards;
      z-index: 10;
    }
    .node-point img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s ease;
      opacity: 1 !important;
    }
    .node-point:hover img {
      transform: scale(1.5);
      filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.7));
    }
    
    /* ===== ПОДПИСЬ ПРИ НАВЕДЕНИИ ===== */
    .node-point .node-tooltip {
      position: absolute;
      bottom: 130%;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: rgba(0, 0, 0, 0.9);
      color: #ffd700;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-family: 'Philosopher', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.5px;
      line-height: 1.4;
    }
    .node-point .node-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0, 0, 0, 0.9);
    }
    .node-point:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) scale(1);
    }

    @keyframes nodeAppear {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.3);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }

    /* ===== СТАТИСТИКА (слева, столбиком, без фона) ===== */
    .tree-stats {
      position: absolute;
      left: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 0;
      z-index: 20;
      min-width: 160px;
    }
    .tree-stats .stat-item {
      font-size: 13px;
      color: rgba(0, 0, 0, 0.4);
      letter-spacing: 0.5px;
      display: flex;
      flex-direction: column;
      gap: 0px;
    }
    .tree-stats .stat-item .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(0, 0, 0, 0.25);
    }
    .tree-stats .stat-item strong {
      color: #1a1a1a;
      font-size: 28px;
      font-weight: 700;
      font-family: 'Calypso', serif;
      letter-spacing: 1px;
    }
    .tree-stats .stat-item .sub-text {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: normal;
      font-family: 'Philosopher', sans-serif;
      word-break: break-all;
      max-width: 160px;
    }

    /* ===== КНОПКА ОЧИСТКИ МАРКЕРОВ ===== */
    .clear-markers-btn {
      position: absolute;
      left: 30px;
      bottom: 30px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Philosopher', sans-serif;
      font-size: 12px;
      z-index: 20;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
    }
    .clear-markers-btn:hover {
      background: rgba(255, 0, 0, 0.3);
      border-color: rgba(255, 0, 0, 0.3);
    }

    /* ===== ЗАГРУЗКА ===== */
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(0, 0, 0, 0.3);
      font-size: 18px;
      z-index: 5;
    }

    /* ===== КООРДИНАТЫ (уведомление) ===== */
    .coords-notification {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #51cf66;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-family: 'Philosopher', sans-serif;
      border: 1px solid rgba(81, 207, 102, 0.3);
      z-index: 999;
      display: none;
      pointer-events: none;
      letter-spacing: 1px;
      text-align: center;
    }
    .coords-notification.visible {
      display: block;
      animation: fadeInOut 2s ease forwards;
    }
    .coords-notification .coords-text {
      color: #ffd700;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(10px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    }

    /* ===== АДАПТАЦИЯ ===== */
    @media (max-width: 768px) {
      .node-point { width: 20px; height: 20px; }
      .node-point .node-tooltip { font-size: 11px; padding: 4px 10px; }
      .tree-stats { 
        left: 16px; 
        min-width: 120px;
        gap: 16px;
      }
      .tree-stats .stat-item strong { font-size: 22px; }
      .tree-stats .stat-item .stat-label { font-size: 10px; }
      .tree-stats .stat-item .sub-text { font-size: 12px; max-width: 100px; }
      .temp-marker { width: 14px; height: 14px; }
      .clear-markers-btn { left: 16px; bottom: 16px; font-size: 10px; padding: 6px 12px; }
    }
    @media (max-width: 480px) {
      .node-point { width: 18px; height: 18px; }
      .node-point .node-tooltip { font-size: 10px; padding: 3px 8px; }
      .tree-stats { 
        left: 10px; 
        min-width: 90px;
        gap: 12px;
      }
      .tree-stats .stat-item strong { font-size: 18px; }
      .tree-stats .stat-item .stat-label { font-size: 9px; }
      .tree-stats .stat-item .sub-text { font-size: 10px; max-width: 80px; }
      .temp-marker { width: 12px; height: 12px; }
      .temp-marker .marker-label { font-size: 9px; top: -24px; }
      .temp-marker .marker-coords { font-size: 8px; top: 16px; }
      .clear-markers-btn { left: 10px; bottom: 10px; font-size: 9px; padding: 4px 10px; }
    }
  </style>
</head>
<body>

<!-- БАННЕР -->
<div class="top-banner">
  <span class="title">Огненные чертоги</span>
  <div class="nav-links">
    <a href="index.html">Карта</a>
    <a href="znaki.html">В путь</a>
    <a href="bestiary.html">Бестиарий</a>
    <a href="tree.html" class="active">Древо смерти</a>
  </div>
</div>

<div class="container">
  <div id="treeContainer" class="tree-container">
    <img src="/CHERTOGI_MAP/znakiimg/drevo_smerty.jpg" alt="Древо смерти" class="tree-image" id="treeImage">
    <div class="nodes-container" id="nodesContainer"></div>
    
    <!-- СТАТИСТИКА СЛЕВА (без фона) -->
    <div class="tree-stats" id="treeStats">
      <div class="stat-item">
        <span class="stat-label">Всего павших</span>
        <strong id="totalDeceased">0</strong>
      </div>
      <div class="stat-item">
        <span class="stat-label">Последний павший</span>
        <strong id="lastDeceased" class="sub-text">—</strong>
      </div>
    </div>

    <!-- КНОПКА ОЧИСТКИ МАРКЕРОВ -->
    <button class="clear-markers-btn" id="clearMarkersBtn">✕ Очистить маркеры</button>
    
    <div id="loadingMessage" class="loading">Загрузка...</div>
  </div>
</div>

<!-- УВЕДОМЛЕНИЕ О КООРДИНАТАХ -->
<div class="coords-notification" id="coordsNotification">
  Координаты скопированы: <span class="coords-text" id="coordsText">X: 0.0%, Y: 0.0%</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>

<script>
  // ============================================================
  // НОВЫЕ КООРДИНАТЫ УЗЛОВ (57 штук)
  // ============================================================

  var ALL_NODES = [
    { x: 41.0, y: 84.6 },
    { x: 39.6, y: 83.1 },
    { x: 38.2, y: 80.9 },
    { x: 35.4, y: 87.7 },
    { x: 33.2, y: 80.1 },
    { x: 32.7, y: 72.2 },
    { x: 33.2, y: 60.2 },
    { x: 29.8, y: 66.2 },
    { x: 35.8, y: 69.8 },
    { x: 37.2, y: 59.5 },
    { x: 38.3, y: 70.4 },
    { x: 45.8, y: 76.4 },
    { x: 49.2, y: 66.8 },
    { x: 47.3, y: 60.0 },
    { x: 52.3, y: 82.1 },
    { x: 55.6, y: 75.0 },
    { x: 58.3, y: 81.6 },
    { x: 57.6, y: 70.8 },
    { x: 55.7, y: 63.6 },
    { x: 55.5, y: 44.7 },
    { x: 55.0, y: 31.7 },
    { x: 60.9, y: 46.1 },
    { x: 62.9, y: 41.7 },
    { x: 72.9, y: 38.1 },
    { x: 67.6, y: 41.5 },
    { x: 65.6, y: 42.5 },
    { x: 68.2, y: 73.9 },
    { x: 72.9, y: 68.4 },
    { x: 72.7, y: 57.0 },
    { x: 73.7, y: 47.4 },
    { x: 67.9, y: 62.9 },
    { x: 69.5, y: 65.9 },
    { x: 49.0, y: 75.3 },
    { x: 41.1, y: 59.1 },
    { x: 61.2, y: 15.8 },
    { x: 49.9, y: 36.8 },
    { x: 71.8, y: 22.1 },
    { x: 42.7, y: 69.5 },
    { x: 41.6, y: 77.1 },
    { x: 65.5, y: 63.8 },
    { x: 71.2, y: 46.7 },
    { x: 52.0, y: 73.9 },
    { x: 53.4, y: 73.8 },
    { x: 44.1, y: 52.1 },
    { x: 48.8, y: 49.6 },
    { x: 45.6, y: 39.2 },
    { x: 68.5, y: 36.2 },
    { x: 68.4, y: 80.4 },
    { x: 61.7, y: 66.2 },
    { x: 67.3, y: 54.5 },
    { x: 58.1, y: 58.3 },
    { x: 56.4, y: 54.6 }
  ];

  // Перемешиваем массив в случайном порядке
  function shuffleArray(arr) {
    var shuffled = arr.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }
    return shuffled;
  }

  // Создаём перемешанный массив с ID
  var shuffledNodes = shuffleArray(ALL_NODES);
  var DEFAULT_NODES = shuffledNodes.map(function(node, index) {
    return {
      id: index + 1,
      x: node.x,
      y: node.y
    };
  });

  var allNodePositions = DEFAULT_NODES;

  console.log('✅ Загружено ' + allNodePositions.length + ' узлов в случайном порядке');

  // ============================================================
  // ВРЕМЕННЫЕ МАРКЕРЫ
  // ============================================================

  var tempMarkers = [];

  function addTempMarker(x, y, coordString) {
    var container = document.getElementById('treeContainer');
    
    var marker = document.createElement('div');
    marker.className = 'temp-marker';
    marker.style.left = x + '%';
    marker.style.top = y + '%';
    marker.dataset.x = x;
    marker.dataset.y = y;
    
    var label = document.createElement('span');
    label.className = 'marker-label';
    label.textContent = '📍';
    marker.appendChild(label);
    
    var coordsLabel = document.createElement('span');
    coordsLabel.className = 'marker-coords';
    coordsLabel.textContent = 'X: ' + x + '% Y: ' + y + '%';
    marker.appendChild(coordsLabel);
    
    container.appendChild(marker);
    tempMarkers.push(marker);
    
    showCoordsNotification(coordString, x, y);
  }

  function clearTempMarkers() {
    tempMarkers.forEach(function(marker) {
      if (marker.parentNode) {
        marker.parentNode.removeChild(marker);
      }
    });
    tempMarkers = [];
    console.log('🗑️ Все временные маркеры удалены');
  }

  // ============================================================
  // УВЕДОМЛЕНИЕ О КООРДИНАТАХ
  // ============================================================

  var coordsNotification = document.getElementById('coordsNotification');
  var coordsText = document.getElementById('coordsText');

  function showCoordsNotification(coordString, x, y) {
    coordsText.textContent = 'X: ' + x + '%, Y: ' + y + '%  →  ' + coordString;
    coordsNotification.classList.remove('visible');
    void coordsNotification.offsetWidth;
    coordsNotification.classList.add('visible');
    
    setTimeout(function() {
      coordsNotification.classList.remove('visible');
    }, 3000);
  }

  // ============================================================
  // КЛИК ПО КАРТИНКЕ — СОЗДАНИЕ МАРКЕРА
  // ============================================================

  document.getElementById('treeContainer').addEventListener('click', function(e) {
    if (e.target.closest('.node-point')) return;
    if (e.target.closest('.clear-markers-btn')) return;
    
    var rect = this.getBoundingClientRect();
    var x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1);
    var y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1);
    
    var coordString = '{ x: ' + x + ', y: ' + y + ' }';
    
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(coordString).then(function() {
        console.log('📋 Координаты скопированы:', coordString);
      }).catch(function() {
        copyFallback(coordString);
      });
    } else {
      copyFallback(coordString);
    }
    
    addTempMarker(x, y, coordString);
  });

  function copyFallback(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      console.log('📋 Координаты скопированы (fallback):', text);
    } catch (e) {
      console.log('❌ Не удалось скопировать:', text);
    }
    document.body.removeChild(textarea);
  }

  // ============================================================
  // КНОПКА ОЧИСТКИ МАРКЕРОВ
  // ============================================================

  document.getElementById('clearMarkersBtn').addEventListener('click', function(e) {
    e.stopPropagation();
    clearTempMarkers();
  });

  // ============================================================
  // ЗАГРУЗКА ДАННЫХ ИЗ SUPABASE
  // ============================================================

  async function loadDeceased() {
    var container = document.getElementById('nodesContainer');
    var loading = document.getElementById('loadingMessage');
    
    loading.style.display = 'block';
    container.innerHTML = '';

    try {
      var result = await _supabase
        .from('game_reports')
        .select('deceased_names, created_at')
        .not('deceased_names', 'is', null)
        .order('created_at', { ascending: false });

      if (result.error) {
        console.error('Ошибка загрузки:', result.error);
        loading.textContent = 'Ошибка загрузки данных';
        return;
      }

      var reports = result.data || [];
      
      // Собираем ВСЕ имена умерших из ВСЕХ отчётов
      var allDeceased = [];
      var lastDeceasedName = null;
      var lastDeceasedTime = null;

      for (var i = 0; i < reports.length; i++) {
        var report = reports[i];
        var names = report.deceased_names;
        
        if (!names || names.length === 0) continue;
        
        // Если names — строка, разбиваем по запятой
        if (typeof names === 'string') {
          names = names.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
        }
        
        for (var j = 0; j < names.length; j++) {
          var name = names[j];
          if (name && name.trim()) {
            allDeceased.push({
              name: name.trim(),
              created_at: report.created_at
            });
            // Запоминаем последнего (первый в списке, т.к. сортировка по убыванию)
            if (!lastDeceasedName) {
              lastDeceasedName = name.trim();
              lastDeceasedTime = report.created_at;
            }
          }
        }
      }

      // Обновляем статистику
      document.getElementById('totalDeceased').textContent = allDeceased.length;
      
      if (lastDeceasedName) {
        var date = new Date(lastDeceasedTime);
        document.getElementById('lastDeceased').textContent = lastDeceasedName + ' (' + date.toLocaleDateString('ru-RU') + ')';
      }

      loading.style.display = 'none';
      
      // Отрисовываем ТОЛЬКО заполненные узлы
      renderFilledNodes(allDeceased);

    } catch (err) {
      console.error('Ошибка:', err);
      loading.textContent = 'Ошибка загрузки данных';
    }
  }

  // ============================================================
  // ОТРИСОВКА ТОЛЬКО ЗАПОЛНЕННЫХ УЗЛОВ
  // ============================================================

  function renderFilledNodes(deceased) {
    var container = document.getElementById('nodesContainer');
    container.innerHTML = '';

    // Перемешиваем имена умерших
    var shuffled = deceased.slice();
    for (var i = shuffled.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = shuffled[i];
      shuffled[i] = shuffled[j];
      shuffled[j] = temp;
    }

    // Берём столько узлов, сколько есть имён (но не больше общего количества узлов)
    var nodesToShow = Math.min(shuffled.length, allNodePositions.length);
    
    console.log('🟢 Отображаем ' + nodesToShow + ' узлов из ' + allNodePositions.length + ' доступных');

    for (var m = 0; m < nodesToShow; m++) {
      var pos = allNodePositions[m];
      var person = shuffled[m];
      
      if (!person) continue; // Пропускаем, если нет имени
      
      var node = document.createElement('div');
      node.className = 'node-point';
      
      node.style.left = pos.x + '%';
      node.style.top = pos.y + '%';
      node.style.animationDelay = (m * 0.05) + 's';
      
      node.innerHTML = `
        <img src="/CHERTOGI_MAP/icons/uzelsmerty.png" alt="узел">
        <span class="node-tooltip">#${pos.id} — ${person.name}</span>
      `;
      
      container.appendChild(node);
    }
    
    // Если нет ни одного умершего, показываем сообщение
    if (nodesToShow === 0) {
      var emptyMsg = document.createElement('div');
      emptyMsg.style.cssText = 'position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(0,0,0,0.15); font-family: "Philosopher", sans-serif; font-size: 20px; letter-spacing: 2px; pointer-events: none; z-index: 5;';
      emptyMsg.textContent = 'Нет павших...';
      container.appendChild(emptyMsg);
    }
  }

  // ============================================================
  // ЗАПУСК
  // ============================================================

  document.addEventListener('DOMContentLoaded', function() {
    var img = document.getElementById('treeImage');
    if (img.complete) {
      loadDeceased();
    } else {
      img.addEventListener('load', loadDeceased);
    }
  });

  window.addEventListener('focus', function() {
    loadDeceased();
  });
</script>

</body>
</html>
